}

/* =====================================================================
   ١١. المعايرة المرجعية الحجمية — ضبط مقياس النموذج لا تشغيله
   المشكلة المُثبَتة: GloFAS نموذج أمطار–جريان طبيعى لا يمثّل بخر السدود
   ولا السحب الزراعى ولا فواقد المجرى الصحراوى، فتخرج تصرفاته أعلى من
   الواقع بأضعاف. وإعادة تثبيت الخلية لا تُصلحه (فُحصت ٤٩ خلية حول حلفا
   فكانت كلها فى نفس النطاق).
   العلاج: معامل لكل محطة = المتوسط المرجعى المنشور ÷ متوسط النموذج على
   أرشيف طويل. والمعامل يصحّح **المقياس** فقط: الشكل والتوقيت من النموذج.
   ===================================================================== */
var CAL_FROM = "2010-01-01";
/* المراجع الافتراضية: متوسطات النظام الطبيعى المنشورة (ميزان النيل التقليدى)
   — قابلة للتعديل والحفظ، وتُستبدل بأرقام الوزارة عند اعتمادها */
var CAL_REF_DEF = { eldiem:1544, bnkhart:1585, jaulia:890, khartoum:2470,
                    shendi:2470, atbara:365, merowe:2660, halfa:2660 };
var CAL_STN = ["eldiem","bnkhart","jaulia","khartoum","shendi","atbara","merowe","halfa"];

function calRef(){ return ST.cal.ref || CAL_REF_DEF; }
function calFactor(id){
  var M=ST.cal.model, R=calRef();
  if(!M || !M[id] || !M[id].mean || !R[id]) return null;
  return R[id]/M[id].mean;
}
function calQ(id, q){
  var f=calFactor(id);
  if(f===null||q===null||q===undefined||isNaN(q)) return null;
  return q*f;
}
function calLoadModel(){
  var lats=[], lons=[], i;
  for(i=0;i<CAL_STN.length;i++){ var S=stn(CAL_STN[i]); lats.push(S.lat); lons.push(S.lon); }
  var to=new Date(Date.now()-2*864e5).toISOString().slice(0,10);
  var url=FLOOD_API+"?latitude="+lats.join(",")+"&longitude="+lons.join(",")
    +"&daily=river_discharge&start_date="+CAL_FROM+"&end_date="+to;
  ST.cal.loading=true; render();
  return getJSON(url,"تعذّر جلب أرشيف المعايرة").then(function(a){
    var list=(a&&a.length!==undefined)?a:[a], M={}, j, n;
    for(j=0;j<CAL_STN.length;j++){
      var d=list[j];
      if(!d||!d.daily){ continue; }
      var q=d.daily.river_discharge, sum=0, c=0;
      for(n=0;n<q.length;n++) if(q[n]!==null&&!isNaN(q[n])){ sum+=q[n]; c++; }
      if(c>365) M[CAL_STN[j]]={ mean:sum/c, n:c, from:CAL_FROM, to:to };
    }
    ST.cal.model=M; ST.cal.loading=false;
    auditLog("جلب أرشيف المعايرة", Object.keys(M).length+" محطة منذ "+CAL_FROM);
    render(); return M;
  }).catch(function(){ ST.cal.loading=false; render(); return null; });
}
/* اتساق مجموعة المراجع: هل تغلق عند الملتقيات؟ (متوسطات طويلة الأمد بلا إزاحة) */
function calBalance(){
  var R=calRef(), out=[];
  function node(nm, ins, outId, tol){
    var s=0, i, ok=true;
    for(i=0;i<ins.length;i++){ if(!R[ins[i]]){ ok=false; } else s+=R[ins[i]]; }
    if(!ok||!R[outId]) return;
    var wb = window.MWRIHyd? MWRIHyd.waterBalance(
      ins.map(function(x){ return {Q:R[x]}; }), [{Q:R[outId]}], {tolerancePct:tol}) : null;
    out.push({ nm:nm, sum:s, out:R[outId], pct:(s-R[outId])/s*100, wb:wb });
  }
  node("ملتقى الخرطوم", ["bnkhart","jaulia"], "khartoum", 3);
  node("ملتقى عطبرة ← دنقلا", ["shendi","atbara"], "merowe", 10);
  return out;
}

/* =====================================================================
   المعايرة على موسم تاريخى كامل — يحلّ ضعف تعريف K على الساق الملساء
   المرجع: إعادة تحليل GloFAS لنفس المحطات (اتساق داخلى، لا مطابقة ميدانية)
   ===================================================================== */
var CALH_YEARS=[2019,2020,2021,2022,2023,2024,2025];
function loadSeason(year){
  var ids=["eldiem","bnkhart","khartoum","shendi","atbara","merowe","halfa"];
  var lats=[],lons=[],i;
  for(i=0;i<ids.length;i++){ var st=stn(ids[i]); lats.push(st.lat); lons.push(st.lon); }
  var url=FLOOD_API+"?latitude="+lats.join(",")+"&longitude="+lons.join(",")
    +"&daily=river_discharge&start_date="+year+"-05-01&end_date="+year+"-12-31";
  ST.calH.loading=true; ST.calH.year=year; ST.calH.res=null; render();
  return getJSON(url,"تعذّر جلب أرشيف موسم "+year).then(function(arr){
    var list=(arr&&arr.length!==undefined)?arr:[arr], H={};
    for(i=0;i<ids.length;i++){
      var d=list[i];
      if(d&&d.daily) H[ids[i]]={t:d.daily.time, q:d.daily.river_discharge};
    }
    ST.calH.H=H;
    ST.calH.res=calibrateAllSeason(H);
    ST.calH.loading=false; render();
    return ST.calH.res;
  }).catch(function(){ ST.calH.loading=false; render(); return null; });
}
function calibrateReachSeason(idx, H){
  var inflow, obs;
  if(idx===0){ if(!H.eldiem||!H.bnkhart) return null; inflow=H.eldiem.q; obs=H.bnkhart.q; }
  else if(idx===1){ if(!H.khartoum||!H.shendi) return null; inflow=H.khartoum.q; obs=H.shendi.q; }
  else if(idx===2){ if(!H.shendi||!H.atbara||!H.merowe) return null;
    inflow=addS(H.shendi.q, H.atbara.q, 1); obs=H.merowe.q; }
  else { if(!H.merowe||!H.halfa) return null; inflow=H.merowe.q; obs=H.halfa.q; }
  var t=H.eldiem.t, a=2, b=t.length-1;
  var best=muskGrid(inflow, obs, a, b);
  var wv=[],wi;
  for(wi=a;wi<=b;wi++) if(inflow[wi]!==null&&!isNaN(inflow[wi])) wv.push(inflow[wi]);
  if(wv.length<60) return null;
  var wmin=Math.min.apply(null,wv), wmax=Math.max.apply(null,wv), wmean=FIT.mean(wv);
  var ident=wmean>0?(wmax-wmin)/wmean:0;
  /* ذروة داخلية حقيقية: القمة ليست على أى من طرفى النافذة */
  var pk=peakOf(inflow,t), hasPeak=(pk.i>a+5 && pk.i<b-5);
  var R=ST.reaches[idx];
  var cur=routeCascade(inflow,R.K,R.x,R.n,1);
  var curM=FIT.metrics(obs,cur.out,a,b);
  var pe=best? FIT.peakErr(obs,best.out,t,a,b):null;
  return { idx:idx, cur:{K:R.K,x:R.x,n:R.n,m:curM}, best:best, peak:pe,
           ident:ident, hasPeak:hasPeak, reliable:(ident>=0.5&&hasPeak&&best&&best.m.KGE>=0.75),
           window:{from:t[a], to:t[b], n:b-a+1} };
}
function calibrateAllSeason(H){
  var out=[],i;
  for(i=0;i<ST.reaches.length;i++) out.push(calibrateReachSeason(i,H));
  return out;
}

           "المُتتبَّع الخام "+nf(n.raw,0))

/* =====================================================================
   معايرة متعددة المواسم — الوسيط عبر السنوات لا موسم واحد
   موسم واحد قد يكون شاذاً (فيضان استثنائى أو موسم مبتور)، والوسيط
   يقاوم ذلك. ولا يُحتسب موسم إلا إذا كان قابلاً للتعريف وذا ذروة داخلية.
   ===================================================================== */
var CALM_YEARS = [2019,2020,2021,2022,2023,2024,2025];
function seasonFetch(year){
  var ids=["eldiem","bnkhart","khartoum","shendi","atbara","merowe","halfa"];
  var lats=[], lons=[], i;
  for(i=0;i<ids.length;i++){ var st=stn(ids[i]); lats.push(st.lat); lons.push(st.lon); }
  var url=FLOOD_API+"?latitude="+lats.join(",")+"&longitude="+lons.join(",")
    +"&daily=river_discharge&start_date="+year+"-05-01&end_date="+year+"-12-31";
  return getJSON(url,"تعذّر جلب موسم "+year).then(function(arr){
    var list=(arr&&arr.length!==undefined)?arr:[arr], H={}, j;
    for(j=0;j<ids.length;j++){
      var d=list[j];
      if(d&&d.daily) H[ids[j]]={t:d.daily.time, q:d.daily.river_discharge};
    }
    return H;
  });
}
function calMRun(){
  ST.calM.running=true; ST.calM.done=0; ST.calM.res={}; ST.calM.fail=[]; render();
  var i=0;
  function step(){
    if(i>=CALM_YEARS.length){
      ST.calM.running=false;
      auditLog("معايرة متعددة المواسم", Object.keys(ST.calM.res).length+" موسماً نجح");
      render(); return true;
    }
    var y=CALM_YEARS[i++];
    return seasonFetch(y).then(function(H){
      if(H&&H.eldiem) ST.calM.res[y]=calibrateAllSeason(H);
      else ST.calM.fail.push(y);
      ST.calM.done=i; render();
      return new Promise(function(res){ setTimeout(res, 1200); });
    }).catch(function(){
      ST.calM.fail.push(y); ST.calM.done=i; render();
      return new Promise(function(res){ setTimeout(res, 1500); });
    }).then(step);
  }
  return Promise.resolve(step()).catch(function(){ ST.calM.running=false; render(); });
}
function med(a){
  if(!a.length) return null;
  var b=a.slice().sort(function(x,y){ return x-y; }), n=b.length;
  return (n%2)? b[(n-1)/2] : (b[n/2-1]+b[n/2])/2;
}
function calMMedian(){
  var out=[], i, ys=Object.keys(ST.calM.res);
  for(i=0;i<ST.reaches.length;i++){
    var K=[], X=[], N=[], kge=[], used=[];
    ys.forEach(function(y){
      var c=ST.calM.res[y][i];
      if(!c||!c.best||!c.reliable) return;
      K.push(c.best.K); X.push(c.best.x); N.push(c.best.n);
      kge.push(c.best.m.KGE); used.push(y);
    });
    out.push({ idx:i, n:K.length, used:used,
      K:med(K), x:med(X), nSub:med(N), kge:med(kge) });
  }
  return out;
}

/* =====================================================================
   الألتيمترى — مناسيب البحيرات من المدارات (DAHITI / DGFI-TUM)
   العقد: GET /api/v2/download-water-level/?api_key=..&dahiti_id=..&format=json
   الرد: { target:{..}, data:[ {date:"YYYY-MM-DDT00:00:00", wse, wse_u, data:mission} ] }
   CORS مفتوح لنطاق github.io (متحقَّق منه) — والمفتاح مجانى بالتسجيل فى dahiti.dgfi.tum.de
   ===================================================================== */
var ALTI_API="https://dahiti.dgfi.tum.de/api/v2/download-water-level/";
var ALTI_TARGETS=[
  { id:"gerd",   dahiti:27208, nm:"بحيرة سد النهضة", regulated:true,
    note:"منسوب البحر (م) — منسوب الاعتماد الطبيعى المنشور 640 م",
    miles:[{y:"ملء 2020",v:540},{y:"ملء 2021",v:575},{y:"ملء 2022",v:600},{y:"ملء 2023",v:625},{y:"اكتمال الملء 2024",v:640}] },
  { id:"nasser", dahiti:210,   nm:"بحيرة ناصر", regulated:true,
    note:"منسوب البحر (م) — المرجع الرسمى هو مقياس السد العالى؛ الألتيمترى تحقق مستقل",
    miles:[] }
];
function altiTarget(id){ var i; for(i=0;i<ALTI_TARGETS.length;i++) if(ALTI_TARGETS[i].id===id) return ALTI_TARGETS[i]; return null; }
function altiKey(){
  try{ var k=localStorage.getItem("mwri_dahiti_key"); if(k) return Promise.resolve({key:k,src:"محلى"}); }catch(e){}
  /* نمط اعتماد Copernicus نفسه: خارج جذر /mwri على sh_config — يُقرأ من MwriDb.base مباشرة */
  return fetch(MwriDb.base+"/sh_config/dahiti_key.json").then(function(r){ return r.json(); })
    .then(function(v){ if(!v) return null; return {key:b64decode(v), src:"القاعدة"}; })
    .catch(function(){ return null; });
}
function altiLoad(sel){
  var T=altiTarget(sel); if(!T) return Promise.resolve(null);
  ST.alti.loading=true; render();
  return Promise.resolve(altiKey()).then(function(K){
    if(!K||!K.key){ ST.alti.keyOk=false; ST.alti.loading=false; render(); return null; }
    var url=ALTI_API+"?api_key="+encodeURIComponent(K.key)+"&dahiti_id="+T.dahiti+"&format=json";
    return fetch(url).then(function(r){
      if(!r.ok) return r.text().then(function(tx){
        throw new Error("HTTP "+r.status+" — "+String(tx).slice(0,160)); });
      return r.json();
    }).then(function(d){
      var arr=(d&&d.data)?d.data:[], out=[],i;
      for(i=0;i<arr.length;i++){
        var w=arr[i];
        /* العقد الموثَّق: date/water_level/error — مع قبول wse/datetime لو غيّرت v2 المسميات */
        var lv=(w.water_level!==undefined)?w.water_level:w.wse;
        var er=(w.error!==undefined)?w.error:w.wse_u;
        var dt=(w.date!==undefined)?w.date:w.datetime;
        if(lv!==null && lv!==undefined && !isNaN(lv) && dt)
          out.push({t:String(dt).slice(0,10), v:+lv, u:(er!==undefined&&er!==null? +er : null)});
      }
      out.sort(function(p,q){ return p.t<q.t? -1:1; });
      ST.alti.data[sel]={ series:out, target:(d&&d.target)?d.target:null, at:Date.now() };
      ST.alti.keyOk=true; ST.alti.loading=false; render();
      return ST.alti.data[sel];
    });
  }).catch(function(e){
    ST.alti.loading=false; ST.alti.keyOk=(String(e).indexOf("403")===-1)?ST.alti.keyOk:false;
    netErr("تعذّر جلب الألتيمترى (DAHITI)", e); render(); return null;
  });
}
function altiDayNum(iso){ var p=String(iso).split("-"); return Date.UTC(+p[0],+p[1]-1,+p[2])/864e5; }
function altiStats(sel){
  var D=ST.alti.data[sel]; if(!D||D.series.length<2) return null;
  var S=D.series, last=S[S.length-1], tn=altiDayNum(last.t);
  function at(daysBack){
    var i,best=null,bd=1e9;
    for(i=0;i<S.length;i++){ var dd=Math.abs((tn-altiDayNum(S[i].t))-daysBack);
      if(dd<bd){ bd=dd; best=S[i]; } }
    return (bd<=daysBack*0.5+12)? best:null;
  }
  var p30=at(30), p90=at(90), p365=at(365);
  function d(p){ return p? last.v-p.v : null; }
  var d30=d(p30);
  var rate=(p30&&d30!==null)? d30/((tn-altiDayNum(p30.t))||1)*30 : null;
  var trend = rate===null? null : (rate>0.15? {nm:"صاعد — احتجاز",cls:"sand"} :
              (rate<-0.15? {nm:"هابط — تمرير أكبر من الوارد",cls:"lake"} : {nm:"شبه مستقر",cls:"green"}));
  return { last:last, n:S.length, from:S[0].t, d30:d30, d90:d(p90), d365:d(p365), rate:rate, trend:trend };
}

   تُكتب «غير محمَّل» ولا يُختلق لها رقم أبداً
   ===================================================================== */
function certLine(ctx,x0,x1,y){ ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke(); }
function certSeries(ctx, box, t, arrs, thr){
  /* أصغر راسم سلاسل على canvas: يكفى منحنى حلفا والعتبات */
  var lo=Infinity, hi=-Infinity, i,j;
  for(i=0;i<arrs.length;i++){ var a=arrs[i].v; if(!a) continue;
    for(j=0;j<a.length;j++){ var vv=a[j]; if(vv===null||vv===undefined||isNaN(vv)) continue;
      if(vv<lo) lo=vv; if(vv>hi) hi=vv; } }
  if(thr){ if(thr.a<lo) lo=thr.a; if(thr.c>hi) hi=thr.c; }
  if(!(hi>lo)){ return; }
  var pad=(hi-lo)*0.08; lo-=pad; hi+=pad;
  function X(k){ return box.x + (t.length<2? box.w/2 : k/(t.length-1)*box.w); }
  function Y(v){ return box.y + box.h - (v-lo)/(hi-lo)*box.h; }
  ctx.save();
  ctx.strokeStyle="#d8d2c2"; ctx.lineWidth=1;
  ctx.strokeRect(box.x, box.y, box.w, box.h);
  if(thr){
    var tt=[{v:thr.a,c:"#c58a2f"},{v:thr.b,c:"#b46f4b"},{v:thr.c,c:"#b8503f"}];
    ctx.setLineDash([5,4]);
    for(i=0;i<tt.length;i++){ ctx.strokeStyle=tt[i].c; certLine(ctx, box.x, box.x+box.w, Y(tt[i].v)); }
    ctx.setLineDash([]);
  }
  for(i=0;i<arrs.length;i++){
    var A=arrs[i]; if(!A.v) continue;
    ctx.strokeStyle=A.c; ctx.lineWidth=A.wd||2.5;
    if(A.dash) ctx.setLineDash(A.dash);
    ctx.beginPath(); var started=false;
    for(j=0;j<A.v.length;j++){ var vv=A.v[j];
      if(vv===null||vv===undefined||isNaN(vv)){ started=false; continue; }
      if(!started){ ctx.moveTo(X(j),Y(vv)); started=true; } else ctx.lineTo(X(j),Y(vv)); }
    ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.fillStyle="#7a756a"; ctx.font="20px Cairo"; ctx.textAlign="left"; ctx.direction="ltr";
  ctx.fillText(nf(lo,0), box.x+6, box.y+box.h-8);
  ctx.fillText(nf(hi,0), box.x+6, box.y+24);
  ctx.restore();
}

/* =====================================================================
   ١٥. تشغيل الخزانات — صافى تغيّر التخزين والإطلاق المُقدَّر
   المبدأ: GloFAS لا يرى السد، فتصرف الديم المُنمذَج ≈ الوارد الطبيعى للخزان.
   والألتيمترى يرى المنسوب ومنه التخزين. فالفرق بينهما = قرار التشغيل نفسه.
   الاتزان يمرّ عبر MWRIHyd.waterBalance حصراً — لا معادلة اتزان جديدة هنا.
   ===================================================================== */
var DAM_V_UNC = 0.12;   /* عدم يقين منحنى المنسوب–الحجم التقريبى */
var RESERVOIRS = [
  { id:"gerd", altiId:"gerd", nm:"سد النهضة", inflow:"eldiem", nmInflow:"الديم",
    hv:[{h:505,v:0},{h:560,v:4.9},{h:575,v:13.5},{h:600,v:22.0},{h:625,v:42.0},{h:640,v:74.0}],
    hvSrc:"معالم الملء المعلنة ٢٠٢٠–٢٠٢٤ مع منسوب الاعتماد ٦٤٠ م = ٧٤ مليار م³" }
];
function resv(id){ var i; for(i=0;i<RESERVOIRS.length;i++) if(RESERVOIRS[i].id===id) return RESERVOIRS[i]; return RESERVOIRS[0]; }
function hvV(R,h){
  var P=R.hv, i;
  if(h<=P[0].h) return {v:P[0].v, out:true};
  if(h>=P[P.length-1].h) return {v:P[P.length-1].v, out:true};
  for(i=0;i<P.length-1;i++) if(h>=P[i].h&&h<=P[i+1].h){
    var f=(h-P[i].h)/(P[i+1].h-P[i].h);
    return {v:P[i].v+f*(P[i+1].v-P[i].v), out:false};
  }
  return {v:null, out:true};
}
function hvArea(R,h){   /* كم² = ميل المنحنى (مليار م³ لكل متر) × ١٠٠٠ */
  var P=R.hv, i;
  for(i=0;i<P.length-1;i++) if(h>=P[i].h&&h<=P[i+1].h)
    return (P[i+1].v-P[i].v)/(P[i+1].h-P[i].h)*1000;
  return null;
}
function damNatural(){
  if(ST.dam.nat) return ST.dam.nat;
  if(ST.q&&ST.q.eldiem) return {t:ST.q.eldiem.t, q:ST.q.eldiem.q, src:"النافذة الحية ("+PAST+" يوماً)"};
  return null;
}
function damNatMean(N,t1,t2){
  var n1=altiDayNum(t1), n2=altiDayNum(t2), days=n2-n1, i, sum=0, c=0;
  if(days<=0) return null;
  for(i=0;i<N.t.length;i++){
    var dd=altiDayNum(N.t[i]);
    if(dd>n1&&dd<=n2&&N.q[i]!==null&&!isNaN(N.q[i])){ sum+=N.q[i]; c++; }
  }
  if(c < Math.max(2, Math.round(days*0.6))) return null;   /* تغطية ناقصة = لا رقم */
  return sum/c;
}
function damIntervals(id){
  var R=resv(id), D=ST.alti.data[R.altiId];
  if(!D||!D.series||D.series.length<2) return [];
  var S=D.series.slice().sort(function(a,b){ return altiDayNum(a.t)-altiDayNum(b.t); });
  var N=damNatural(), out=[], i, mm=ST.dam.evap;
  for(i=1;i<S.length;i++){
    var days=altiDayNum(S[i].t)-altiDayNum(S[i-1].t);
    if(days<4||days>75) continue;
    var v1=hvV(R,S[i-1].v), v2=hvV(R,S[i].v);
    if(v1.v===null||v2.v===null) continue;
    var dV=v2.v-v1.v;
    var dS=dV*1e9/(days*86400);
    var A=hvArea(R,(S[i-1].v+S[i].v)/2);
    var evap=(A!==null)? A*1e6*(mm/1000)/86400 : 0;
    var nat=N? damNatMean(N,S[i-1].t,S[i].t) : null;
    var rel=(nat!==null)? nat-dS-evap : null;
    var wb=null;
    if(nat!==null && window.MWRIHyd)
      wb=MWRIHyd.waterBalance([{Q:nat}],[{Q:rel}],{evaporation:evap, tolerancePct:5});
    out.push({ t1:S[i-1].t, t2:S[i].t, days:days, h1:S[i-1].v, h2:S[i].v,
      dH:S[i].v-S[i-1].v, dV:dV, dS:dS, area:A, evap:evap, nat:nat, rel:rel,
      wb:wb, clamp:(v1.out||v2.out) });
  }
  return out;
}
function damState(dS){
  if(dS===null||dS===undefined) return {nm:"—", cls:"info"};
  if(dS>300)  return {nm:"احتجاز", cls:"sand"};
  if(dS<-300) return {nm:"تمرير يفوق الوارد", cls:"lake"};
  return {nm:"شبه متوازن", cls:"green"};
}

/* تحقق مستقل من تقدير الإطلاق: احتجاز السد يجب أن يظهر هبوطاً فى منسوب
   النيل المرصود عند الخرطوم بعد زمن العبور (K مقطع الديم←الخرطوم = 3.5 يوم).
   مصدران لا يشتركان فى شىء: ألتيمترى بحيرة السد وألتيمترى المجرى. */
var DAM_LAG_KHARTOUM = 3.5;
function damCheck(){
  var IV=damIntervals(ST.dam.sel);
  if(!IV.length) return null;
  var D=ST.rlv.data.khartoum;
  if(!D||!D.series.length) return { noRiver:true };
  var L=IV[IV.length-1];
  var a=altiDayNum(L.t1)+DAM_LAG_KHARTOUM, b=altiDayNum(L.t2)+DAM_LAG_KHARTOUM, i;
  var inside=[];
  for(i=0;i<D.series.length;i++){
    var dn=altiDayNum(D.series[i].t);
    if(dn>=a-7 && dn<=b+7) inside.push(D.series[i]);
  }
  if(inside.length<2) return { few:true, n:inside.length, t1:L.t1, t2:L.t2 };
  var dLev=inside[inside.length-1].v-inside[0].v;
  var expect=(L.dS>150)? "هبوط" : (L.dS<-150? "صعود" : "ثبات");
  var got=(dLev<-0.15)? "هبوط" : (dLev>0.15? "صعود" : "ثبات");
  return { n:inside.length, from:inside[0].t, to:inside[inside.length-1].t,
    dLev:dLev, dS:L.dS, expect:expect, got:got, agree:(expect===got),
    t1:L.t1, t2:L.t2 };
}

/* =====================================================================
   ١٧. الرأى الثانى — Google Flood Forecasting API
   نموذج مستقل تماماً عن GloFAS (شبكة عصبية من Google Research).
   العقد منقول حرفياً من مرجع RPC الرسمى (آخر تحديث ٤ يونيو ٢٠٢٦):
     gauges:searchGaugesByArea (POST: regionCode|loop, pageSize)
       ← gauges[] {gaugeId, location{latitude,longitude}, siteName, river,
                   source, countryCode, qualityVerified, hasModel}
     gaugeModels:batchGet (GET: names=gaugeModels/<id>)
       ← gaugeModels[] {gaugeId, gaugeValueUnit, qualityVerified,
                        thresholds{warningLevel,dangerLevel,extremeDangerLevel}}
     gauges:queryGaugeForecasts (GET: gaugeIds=<id>)
       ← forecasts{<gaugeId>: {forecasts[]{issuedTime, gaugeId,
                    forecastRanges[]{value, forecastStartTime, forecastEndTime}}}}
     floodStatus:queryLatestFloodStatusByGaugeIds (GET: gaugeIds=<id>)
       ← floodStatuses[] {gaugeId, severity, forecastTrend, issuedTime, source}
   المحلل يقبل camelCase (صيغة REST) وsnake_case (صيغة proto) معاً —
   نفس درس DAHITI: الوثائق قد تسبق الخادم أو تتأخر عنه.
   ===================================================================== */
var GFH_API = "https://floodforecasting.googleapis.com/v1";
var GFH_REGIONS = ["SD","EG"];
var GFH_MAXKM = 75;

function gfhF(o, camel, snake){
  if(!o) return undefined;
  if(o[camel]!==undefined && o[camel]!==null) return o[camel];
  return o[snake];
}
function gfhKey(){
  if(ST.gfh.key) return Promise.resolve({key:ST.gfh.key, src:ST.gfh.keySrc});
  try{ var k=localStorage.getItem("mwri_gfh_key");
    if(k){ ST.gfh.key=k; ST.gfh.keySrc="محلى"; return Promise.resolve({key:k, src:"محلى"}); }
  }catch(e){}
  return fetch(MwriDb.base+"/sh_config/gfh_key.json").then(function(r){ return r.json(); })
    .then(function(v){
      if(!v) return null;
      ST.gfh.key=b64decode(v); ST.gfh.keySrc="القاعدة";
      return {key:ST.gfh.key, src:"القاعدة"};
    }).catch(function(){ return null; });
}
function gfhReq(path, method, body, qs){
  return Promise.resolve(gfhKey()).then(function(K){
    if(!K||!K.key){ ST.gfh.keyOk=false; throw new Error("لم يُدخَل مفتاح Google بعد"); }
    var u=GFH_API+path+"?key="+encodeURIComponent(K.key)+(qs?("&"+qs):"");
    var opt={ method:method };
    if(body){ opt.headers={"Content-Type":"application/json"}; opt.body=JSON.stringify(body); }
    return fetch(u,opt).then(function(r){
      return r.text().then(function(tx){
        if(!r.ok){
          var msg=tx;
          try{ var j=JSON.parse(tx); if(j&&j.error&&j.error.message) msg=j.error.message; }catch(e){}
          throw new Error("HTTP "+r.status+" — "+String(msg).slice(0,220));
        }
        return tx? JSON.parse(tx) : {};
      });
    });
  });
}
function gfhNorm(g, rc){
  var loc=g.location||{};
  return { id: gfhF(g,"gaugeId","gauge_id")||"",
    lat: (loc.latitude!==undefined? loc.latitude : loc.lat),
    lon: (loc.longitude!==undefined? loc.longitude : loc.lng),
    site: g.siteName||g.site_name||"", river: g.river||"", src: g.source||"",
    cc: gfhF(g,"countryCode","country_code")||rc,
    qv: gfhF(g,"qualityVerified","quality_verified"),
    hasModel: gfhF(g,"hasModel","has_model") };
}
function gfhSearch(){
  ST.gfh.busy="search"; ST.gfh.err=""; render();
  var out=[], i=0;
  function step(){
    if(i>=GFH_REGIONS.length){
      ST.gfh.gauges=out; ST.gfh.busy=""; ST.gfh.keyOk=true;
      auditLog("بحث محطات جوجل", out.length+" محطة فى "+GFH_REGIONS.join("/"));
      render(); return out;
    }
    var rc=GFH_REGIONS[i++];
    return gfhReq("/gauges:searchGaugesByArea","POST",{regionCode:rc, pageSize:2000})
      .then(function(d){
        var g=d.gauges||[], j;
        for(j=0;j<g.length;j++) out.push(gfhNorm(g[j], rc));
        return step();
      });
  }
  return Promise.resolve(step()).catch(function(e){
    ST.gfh.busy=""; ST.gfh.err=e.message||String(e);
    netErr("تعذّر جلب محطات جوجل", e); render(); return null;
  });
}
/* المطابقة على الإحداثى الفعلى للمحطة لا على خلية النموذج — نفس قرار ٢٫٣٧ */
function gfhNear(id, n){
  var S=stn(id), G=ST.gfh.gauges||[], out=[], i;
  if(!S) return out;
  for(i=0;i<G.length;i++){
    if(G[i].lat===undefined||G[i].lat===null||isNaN(G[i].lat)) continue;
    var d=haversine(S.gLat, S.gLon, G[i].lat, G[i].lon);
    if(d<=GFH_MAXKM) out.push({ g:G[i], km:d });
  }
  out.sort(function(a,b){ return a.km-b.km; });
  return out.slice(0, n||5);
}
function gfhSel(id){
  var p=ST.gfh.pick[id], G=ST.gfh.gauges||[], i, S=stn(id);
  if(p&&S) for(i=0;i<G.length;i++) if(G[i].id===p)
    return { g:G[i], km:haversine(S.gLat,S.gLon,G[i].lat,G[i].lon) };
  var n=gfhNear(id,1);
  return n.length? n[0] : null;
}
function gfhDaily(set){
  var fs=(set&&set.forecasts)||[], i, best=null;
  for(i=0;i<fs.length;i++){
    var it=String(gfhF(fs[i],"issuedTime","issued_time")||"");
    if(!best || it>String(gfhF(best,"issuedTime","issued_time")||"")) best=fs[i];
  }
  if(!best) return null;
  var R=gfhF(best,"forecastRanges","forecast_ranges")||[], map={}, j;
  for(j=0;j<R.length;j++){
    var v=R[j].value, t=gfhF(R[j],"forecastStartTime","forecast_start_time");
    if(v===null||v===undefined||isNaN(v)||!t) continue;
    var d=String(t).slice(0,10);
    if(!map[d]) map[d]={s:0,n:0};
    map[d].s+=v; map[d].n++;
  }
  var ks=Object.keys(map).sort(), T=[], Q=[];
  for(j=0;j<ks.length;j++){ T.push(ks[j]); Q.push(map[ks[j]].s/map[ks[j]].n); }
  if(!T.length) return null;
  return { t:T, q:Q, issued:String(gfhF(best,"issuedTime","issued_time")||""), n:R.length };
}
function gfhLoad(){
  var ids=[], seen={};
  STATIONS.forEach(function(S){
    if(!S.key) return;
    var m=gfhSel(S.id);
    if(m && m.g.id && !seen[m.g.id]){ seen[m.g.id]=1; ids.push(m.g.id); }
  });
  if(!ids.length){
    netErr("لا محطات مطابقة", new Error("ابحث عن المحطات أولاً — أو لا توجد محطة جوجل داخل "+GFH_MAXKM+" كم"));
    return Promise.resolve(null);
  }
  ST.gfh.busy="load"; ST.gfh.err=""; render();
  var q1=ids.map(function(x){ return "names="+encodeURIComponent("gaugeModels/"+x); }).join("&");
  var q2=ids.map(function(x){ return "gaugeIds="+encodeURIComponent(x); }).join("&");
  return gfhReq("/gaugeModels:batchGet","GET",null,q1).then(function(d){
    var M=gfhF(d,"gaugeModels","gauge_models")||[], j;
    for(j=0;j<M.length;j++){
      var m=M[j], th=m.thresholds||{}, gid=gfhF(m,"gaugeId","gauge_id");
      ST.gfh.models[gid]={
        unit: gfhF(m,"gaugeValueUnit","gauge_value_unit")||"",
        qv:   gfhF(m,"qualityVerified","quality_verified"),
        warn: gfhF(th,"warningLevel","warning_level"),
        dang: gfhF(th,"dangerLevel","danger_level"),
        ext:  gfhF(th,"extremeDangerLevel","extreme_danger_level") };
    }
    return gfhReq("/gauges:queryGaugeForecasts","GET",null,q2);
  }).then(function(d){
    var F=d.forecasts||{}, k;
    for(k in F) if(Object.prototype.hasOwnProperty.call(F,k)) ST.gfh.fc[k]=gfhDaily(F[k]);
    return gfhReq("/floodStatus:queryLatestFloodStatusByGaugeIds","GET",null,q2);
  }).then(function(d){
    var A=gfhF(d,"floodStatuses","flood_statuses")||[], j;
    for(j=0;j<A.length;j++){
      var f=A[j], gid=gfhF(f,"gaugeId","gauge_id");
      ST.gfh.status[gid]={ sev:f.severity||"", trend:gfhF(f,"forecastTrend","forecast_trend")||"",
        at:gfhF(f,"issuedTime","issued_time")||"", src:f.source||"",
        qv:gfhF(f,"qualityVerified","quality_verified") };
    }
    ST.gfh.busy=""; ST.gfh.stamp=Date.now();
    auditLog("جلب تنبؤ جوجل", ids.length+" محطة");
    render(); return true;
  }).catch(function(e){
    ST.gfh.busy=""; ST.gfh.err=e.message||String(e);
    netErr("تعذّر جلب تنبؤ جوجل", e); render(); return null;
  });
}
var GFH_SEV = {
  EXTREME:{nm:"خطر أقصى", cls:"danger"}, SEVERE:{nm:"خطر", cls:"danger"},
  ABOVE_NORMAL:{nm:"أعلى من الطبيعى", cls:"sand"}, NO_FLOODING:{nm:"لا فيضان", cls:"green"},
  UNKNOWN:{nm:"غير محدد", cls:"info"}, SEVERITY_UNSPECIFIED:{nm:"غير محدد", cls:"info"}
};
var GFH_TREND = { RISE:"صاعد", FALL:"هابط", NO_CHANGE:"مستقر" };
function gfhSevObj(k){ return GFH_SEV[k] || {nm:(k||"—"), cls:"info"}; }
function gfhCompare(id){
  var m=gfhSel(id); if(!m) return null;
  var M=ST.gfh.models[m.g.id], D=ST.gfh.fc[m.g.id], mine=ST.q&&ST.q[id];
  if(!M||!D||!mine) return null;
  var cm=String(M.unit||"").indexOf("CUBIC")>=0;
  var res={ m:m, M:M, D:D, comparable:cm, n:0 };
  if(!cm) return res;
  var T=[], A=[], B=[], i, j;
  for(i=0;i<D.t.length;i++){
    for(j=0;j<mine.t.length;j++)
      if(mine.t[j]===D.t[i] && mine.q[j]!==null && !isNaN(mine.q[j])){
        T.push(D.t[i]); A.push(mine.q[j]); B.push(D.q[i]); break;
      }
  }
  res.t=T; res.mine=A; res.theirs=B; res.n=A.length;
  if(A.length<2) return res;
  var dp=[], sa=0;
  for(i=0;i<A.length;i++){ var e=A[i]? (B[i]-A[i])/A[i]*100 : 0; dp.push(e); sa+=Math.abs(e); }
  res.mad=sa/A.length; res.bias=FIT.mean(dp); res.r=FIT.corr(A,B);
  var pa=peakOf(A,T), pb=peakOf(B,T);
  res.pkMine=pa; res.pkTheirs=pb;
  res.dPeak = pa.v? (pb.v-pa.v)/pa.v*100 : null;
  res.dT = (pa.t&&pb.t)? altiDayNum(pb.t)-altiDayNum(pa.t) : null;
  return res;
}
function gfhAgree(mad){
  if(mad===null||mad===undefined) return {g:"—", cls:"info"};
  if(mad<10) return {g:"اتفاق مرتفع", cls:"green"};
  if(mad<20) return {g:"اتفاق جيد", cls:"green"};
  if(mad<35) return {g:"تباين ملحوظ", cls:"sand"};
  return {g:"تباين كبير — يستوجب المراجعة", cls:"danger"};
}

/* =====================================================================
   ١٨. المناسيب المرصودة على المجرى — أول متغيّر مرصود داخل التطبيق
   DAHITI لا يرصد البحيرات وحدها: داخل حوض النيل ٣٣٨ محطة افتراضية نهرية
   عامة. المعرّفات أدناه مستخرَجة من list-targets ومُتحقَّق منها حياً.
   حدّ جوهرى: هذا **منسوب لا تصرف** — يتحقق من الشكل والتوقيت،
   ولا يحلّ مسألة المقياس إلا بمنحنى تصريف معتمد (منسوب ↔ تصرف).
   ===================================================================== */
var RLV_FROM = "2016-01-01";
var RLV_TARGETS = [
  { id:"khartoum", dahiti:11757, nm:"النيل عند الخرطوم", stn:"khartoum", km:8.0 },
  { id:"dongola",  dahiti:48605, nm:"النيل عند دنقلا",   stn:"merowe",   km:2.2 },
  { id:"atbara",   dahiti:19746, nm:"نهر عطبرة",          stn:"atbara",   km:10.2 },
  { id:"halfa",    dahiti:11773, nm:"النيل قرب حلفا",     stn:"halfa",    km:19.9 },
  { id:"eldiem",   dahiti:1661,  nm:"الأزرق عند الديم",   stn:"eldiem",   km:1.2,
    warn:"الوادى ضيق هنا فالألتيمترى يتعثّر — الارتباط المقيس ضعيف ولا يُعوَّل عليه" }
];
function rlvT(id){ var i; for(i=0;i<RLV_TARGETS.length;i++) if(RLV_TARGETS[i].id===id) return RLV_TARGETS[i]; return RLV_TARGETS[0]; }
function rlvLoad(id){
  var T=rlvT(id);
  ST.rlv.loading=id; ST.rlv.err=""; render();
  return Promise.resolve(altiKey()).then(function(K){
    if(!K||!K.key){ ST.alti.keyOk=false; throw new Error("مفتاح DAHITI غير متاح — أدخله فى قسم الألتيمترى"); }
    return fetch(ALTI_API+"?api_key="+encodeURIComponent(K.key)+"&dahiti_id="+T.dahiti+"&format=json")
      .then(function(r){
        if(!r.ok) return r.text().then(function(tx){ throw new Error("HTTP "+r.status+" — "+String(tx).slice(0,160)); });
        return r.json();
      });
  }).then(function(d){
    var arr=(d&&d.data)?d.data:[], out=[], i, un;
    for(i=0;i<arr.length;i++){
      var w=arr[i];
      var lv=(w.water_level!==un&&w.water_level!==null)? w.water_level : w.wse;
      var tt=w.date||w.datetime;
      if(lv===un||lv===null||!tt) continue;
      out.push({ t:String(tt).slice(0,10), v:Number(lv) });
    }
    out.sort(function(a,b){ return a.t<b.t? -1 : (a.t>b.t?1:0); });
    ST.rlv.data[id]={ series:out, at:Date.now() };
    return rlvArch(id);
  }).then(function(){
    ST.rlv.loading=""; auditLog("جلب منسوب مجرى مرصود", rlvT(id).nm); render(); return true;
  }).catch(function(e){
    ST.rlv.loading=""; ST.rlv.err=e.message||String(e);
    netErr("تعذّر جلب المنسوب المرصود", e); render(); return null;
  });
}
/* أرشيف التصرف لنفس المحطة — النافذة الحية أقصر من أن تعطى ارتباطاً (درس Sentinel-1) */
function rlvArch(id){
  if(ST.rlv.arch[id]) return Promise.resolve(ST.rlv.arch[id]);
  var T=rlvT(id), S=stn(T.stn); if(!S) return Promise.resolve(null);
  var D=ST.rlv.data[id];
  var from=(D&&D.series.length)? (D.series[0].t>RLV_FROM? D.series[0].t : RLV_FROM) : RLV_FROM;
  var to=new Date(Date.now()-2*864e5).toISOString().slice(0,10);
  var url=FLOOD_API+"?latitude="+S.lat+"&longitude="+S.lon
    +"&daily=river_discharge&start_date="+from+"&end_date="+to;
  return getJSON(url,"تعذّر جلب أرشيف التصرف للمقارنة").then(function(a){
    var d=(a&&a.length!==undefined)?a[0]:a;
    if(d&&d.daily) ST.rlv.arch[id]={ t:d.daily.time, q:d.daily.river_discharge };
    return ST.rlv.arch[id];
  }).catch(function(){ return null; });

/* الاتفاق على ثلاثة مستويات — الخام والوسيط الشهرى والدورة الموسمية */
function rlvAgree(id){
  var D=ST.rlv.data[id], A=ST.rlv.arch[id];
  if(!D||!A||!D.series.length) return null;
  var qm={}, i;
  for(i=0;i<A.t.length;i++) if(A.q[i]!==null&&!isNaN(A.q[i])) qm[A.t[i]]=A.q[i];
  var X=[], Y=[], mh={}, mq={};
  for(i=0;i<D.series.length;i++){
    var p=D.series[i], q=qm[p.t];
    if(q===undefined) continue;
    X.push(q); Y.push(p.v);
    var k=p.t.slice(0,7);
    if(!mh[k]){ mh[k]=[]; mq[k]=[]; }
    mh[k].push(p.v); mq[k].push(q);
  }
  if(X.length<8) return { n:X.length, few:true };
  function med(a){ var b=a.slice().sort(function(x,y){ return x-y; }); return b[Math.floor(b.length/2)]; }
  var ks=Object.keys(mh).sort(), H=[], Q=[], cm={}, cq={}, j;
  for(j=0;j<ks.length;j++){
    var h=med(mh[ks[j]]), q2=med(mq[ks[j]]);
    H.push(h); Q.push(q2);
    var mo=ks[j].slice(5);
    if(!cm[mo]){ cm[mo]=[]; cq[mo]=[]; }
    cm[mo].push(h); cq[mo].push(q2);
  }
  var mos=Object.keys(cm).sort(), SA=[], SB=[];
  for(j=0;j<mos.length;j++){ SA.push(FIT.mean(cm[mos[j]])); SB.push(FIT.mean(cq[mos[j]])); }
  return { n:X.length, months:ks.length,
    rDaily:FIT.corr(X,Y), rMonthly:(H.length>2?FIT.corr(H,Q):null),
    rSeason:(SA.length>2?FIT.corr(SA,SB):null),
    last:D.series[D.series.length-1], first:D.series[0].t,
    range:(function(){ var mn=1e9,mx=-1e9,k2; for(k2=0;k2<D.series.length;k2++){ if(D.series[k2].v<mn) mn=D.series[k2].v; if(D.series[k2].v>mx) mx=D.series[k2].v; } return mx-mn; })() };
}
function rlvGrade(r){
  if(r===null||r===undefined||isNaN(r)) return {g:"—", cls:"info"};
  if(r>=0.80) return {g:"اتفاق مرتفع", cls:"green"};
  if(r>=0.60) return {g:"اتفاق مقبول", cls:"green"};
  if(r>=0.40) return {g:"ضعيف", cls:"sand"};
  return {g:"لا يُعوَّل عليه", cls:"danger"};
}

    pts:[[7.20,30.20],[7.60,30.60],[8.00,30.10],[8.40,30.70],[6.90,30.90],[8.80,30.30]] },
  /* بحيرة ناصر: توأمها مؤجَّل بقرارك لغياب منحنى التخزين الرسمى — والبخر

function waporProxy(){
  try{ var v=localStorage.getItem("mwri_wapor_proxy"); if(v!==null&&v!=="") return v; }catch(e){}
  return WAPOR_PROXY_DEF;
}
function waporGet(path){
  return fetch(waporProxy()+path).then(function(r){
    return r.text().then(function(tx){
      if(!r.ok) throw new Error("HTTP "+r.status+" — "+String(tx).slice(0,140));
      var j=null;
      try{ j=JSON.parse(tx); }catch(e){ throw new Error("رد غير JSON: "+String(tx).slice(0,120)); }
      if(j&&j.ok===false) throw new Error(String(j.error||"خطأ من الوسيط").slice(0,140));
      return j;
    });
  });
}
/* قائمة الملفات المتاحة — تعود غير مرتّبة وتحتاج size كبيراً (درس تطبيق الجيزة) */
function waporRasters(mapset){
  if(ST.wp.rasters&&ST.wp.rasters.ms===mapset) return Promise.resolve(ST.wp.rasters.list);
  return waporGet("/rasters?mapset="+encodeURIComponent(mapset)+"&size=2000").then(function(d){
    var arr=(d&&(d.rasters||d.items||d.data))||(d&&d.length!==undefined?d:[]), out=[], i;
    for(i=0;i<arr.length;i++){
      var r=arr[i];
      var nm=(typeof r==="string")? r : (r.code||r.rasterId||r.name||"");
      if(nm) out.push(nm);
    }
    out.sort();
    ST.wp.rasters={ ms:mapset, list:out };
    return out;
  });
}
function waporAt(la, lo, raster){
  /* الوسيط قد يفترض مجموعة افتراضية لا تطابق اسم الملف فيرد 404 —
     نرسل mapset صراحةً، وهو معامل غير ضارّ إن تجاهله */
  return waporGet("/at?lat="+la+"&lon="+lo+"&mapset="+encodeURIComponent(ST.wp.mapset)
                  +"&raster="+encodeURIComponent(raster)).then(function(d){
    var v=(d.value_mm!==undefined&&d.value_mm!==null)? d.value_mm : d.raw;
    if(v===undefined||v===null||isNaN(v)) return null;
    v=Number(v);
    if(v<=WP_NODATA+1) return null;
    return v;
  });
}
function wpKey(kind, raster, i){ return kind+"|"+raster+"|"+i; }
/* قائمة /rasters تُرجع صفحة أولى بحدّ ١٠٠ اسماً وغير مرتّبة زمنياً، فذيلها
   ليس أحدث العشريات. نبنى الأسماء من التواريخ مع تأخّر نشر، ثم نتقاطع مع
   القائمة إن توفّرت. و404 يعنى «عشرية غير منشورة» فتُتخطّى ولا تُحتسب إخفاقاً. */
var WP_LAG_DEK = 5;
function wpDekadName(ms, y, m, d){
  return "WAPOR-3."+ms+"."+y+"-"+("0"+m).slice(-2)+"-D"+d;
}
function wpRecentDekads(ms, n){
  var out=[], now=new Date(), y=now.getUTCFullYear(), m=now.getUTCMonth()+1;
  var day=now.getUTCDate(), d=(day<=10)?1:((day<=20)?2:3), i;
  for(i=0;i<WP_LAG_DEK+n;i++){
    if(i>=WP_LAG_DEK) out.push(wpDekadName(ms,y,m,d));
    d--; if(d<1){ d=3; m--; if(m<1){ m=12; y--; } }
  }
  return out;
}
/* قراءة تراكمية قابلة للاستئناف — كل ضغطة تملأ الناقص فقط */
function wpRun(){
  var kind=ST.wp.kind, T=WP_TARGETS[kind];
  ST.wp.busy=true; ST.wp.err=""; ST.wp.fails=0; render();
  return waporRasters(ST.wp.mapset).catch(function(){ return []; }).then(function(list){
    var dek=wpRecentDekads(ST.wp.mapset, ST.wp.nDek);
    if(list&&list.length){
      var hit={}, z;
      for(z=0;z<list.length;z++) hit[list[z]]=1;
      var inter=[];
      for(z=0;z<dek.length;z++) if(hit[dek[z]]) inter.push(dek[z]);
      /* القائمة مبتورة، فلا نستبعد إلا إذا بقى ما يكفى */
      if(inter.length>=Math.min(2, ST.wp.nDek)) dek=inter;
    }
    var jobs=[], di, pi;
    for(di=0;di<dek.length;di++)
      for(pi=0;pi<T.pts.length;pi++)
        if(ST.wp.got[wpKey(kind,dek[di],pi)]===undefined) jobs.push({r:dek[di], p:pi});
    var n=0;
    function step(){
      if(!jobs.length||ST.wp.fails>=5){
        ST.wp.busy=false;
        ST.wp.prog=n+" قراءة جديدة"+(ST.wp.fails>=5?" — توقّف بعد خمسة إخفاقات متتالية، اضغط للاستئناف":"");
        auditLog("قراءة WaPOR", kind+" · "+n+" قراءة");
        render(); return true;
      }
      var j=jobs.shift();
      return waporAt(T.pts[j.p][0], T.pts[j.p][1], j.r).then(function(v){
        ST.wp.got[wpKey(kind,j.r,j.p)]=(v===null?null:v);
        ST.wp.fails=0; n++;
        if(n%3===0){ ST.wp.prog="جارٍ… "+n+"/"+(n+jobs.length); render(); }
        return new Promise(function(res){ setTimeout(res, 250); });
      }).catch(function(e){
        var msg=e.message||String(e);
        if(msg.indexOf("404")>=0){
          /* عشرية غير منشورة — تُعلَّم وتُتخطّى بلا احتساب إخفاق */
          ST.wp.got[wpKey(kind,j.r,j.p)]=null;
          ST.wp.err="عشرية غير منشورة بعد: "+j.r;
          return new Promise(function(res){ setTimeout(res, 120); });
        }
        ST.wp.fails++; ST.wp.err=msg;
        return new Promise(function(res){ setTimeout(res, 900); });
      }).then(step);
    }
    return step();
  }).catch(function(e){
    ST.wp.busy=false; ST.wp.err=e.message||String(e);
    netErr("تعذّرت قراءة WaPOR", e); render(); return null;
  });
}
function wpStats(kind){
  var T=WP_TARGETS[kind], k, vals=[], per={}, dek={};
  for(k in ST.wp.got){
    if(!Object.prototype.hasOwnProperty.call(ST.wp.got,k)) continue;
    var p=k.split("|");
    if(p[0]!==kind) continue;
    var v=ST.wp.got[k];
    dek[p[1]]=1;
    if(v===null) continue;
    vals.push(v);
    if(!per[p[2]]) per[p[2]]=[];
    per[p[2]].push(v);
  }
  if(!vals.length) return null;
  var mean=FIT.mean(vals);
  return { n:vals.length, dekads:Object.keys(dek).length, mean:mean,
    mmDay:mean/10, mmYear:mean*36, per:per,
    min:Math.min.apply(null,vals), max:Math.max.apply(null,vals) };
}
/* الفاقد الضمنى فى معامل المعايرة للنيل الأبيض — للمقارنة مع المقيس */
function wpImpliedLoss(){
  var M=ST.cal.model, R=calRef();
  if(!M||!M.jaulia||!R.jaulia) return null;
  var d=M.jaulia.mean-R.jaulia;            /* م³/ث */
  if(!(d>0)) return null;
  return { qps:d, bcm:d*31.536/1000 };      /* م³/ث → مليار م³/سنة */
}

  if(kind==="evap"){

      +kpi("⚙", (ST.dam.evap===Math.round(S.mmDay*10)/10)?"green":"sand", "المستخدم فى حساب الإطلاق",
           nf(ST.dam.evap,1), "مم/يوم", (ST.dam.evapSrc==="wapor")?"مقيس من WaPOR":"افتراضى يدوى")

      +'<button class="btn" id="wp-reset">↺ رجوع للافتراضى ٥ مم/يوم</button></div>';
    if(!okRange)
      s+='<div class="banner danger"><span>⚠</span><div>القيمة خارج المدى المعقول (١–١٢ مم/يوم) — '

  } else {
    var ar=wpArea(kind);
    var imp=(kind==="sudd")? wpImpliedLoss() : null;

      +(kind==="nasser"
        ? kpi("≋","", "منسوب البحيرة المرصود",
              (function(){ var D=ST.alti.data.nasser; return (D&&D.series&&D.series.length)? nf(D.series[D.series.length-1].v,2):"—"; })(),
              "م", "من الألتيمترى — يُجلب من قسم الألتيمترى")
        : kpi("Δ", imp?"sand":"", "الفاقد الضمنى فى معاملنا", imp?nf(imp.bcm,1):"—", "مليار م³/سنة",
              imp?"من معامل النيل الأبيض ٠٫١٥٨":"شغّل المعايرة المرجعية أولاً"))
      +'</div>';
    if(kind==="nasser")
      s+='<div class="banner info"><span>ℹ</span><div>'

        +'والقيمة المنشورة لبخر البحيرة تُذكر عادةً بحدود عشرة مليارات م³ سنوياً — قارنها بما يخرج هنا.'

    if(imp){

              : 'والبخر المقيس يفوق الفاقد الضمنى — راجع مساحة السدود المفترضة أو المرجع المنشور للأبيض.')
        +'</div></div>';
    }
  }

  /* تفصيل النقاط — النقطة الشاذّة تُرى ولا تُخفى */
  var prows="", pi;
  for(pi=0;pi<T.pts.length;pi++){
    var a=S.per[String(pi)]||[];
    prows+='<tr><td class="num" style="direction:ltr">'+T.pts[pi][0]+', '+T.pts[pi][1]+'</td>'

      +'<td>'+(a.length? (FIT.mean(a)>S.mean*1.6||FIT.mean(a)<S.mean*0.4

  }
  s+=panel("تفصيل النقاط","القراءة الشاذّة تُعرض ولا تُخفى",
    '<div class="tb-wrap"><table class="tb"><thead><tr><th>الإحداثى</th><th>قراءات</th>'
    +'<th>المتوسط (مم/عشرة أيام)</th><th>الحالة</th></tr></thead><tbody>'+prows+'</tbody></table></div>',
    (ST.wp.nDek<36
      ? '<b>تنبيه موسمية:</b> المتوسط محسوب على '+ST.wp.nDek+' عشريات متجاورة ثم ضُرب فى ٣٦ ليصير سنوياً — '
        +'أى أنه يعمّم موسماً واحداً على السنة كلها. والبخر يبلغ ذروته صيفاً وينخفض شتاءً لأقل من نصفه، '
        +'<b>فالرقم السنوى مبالَغ فيه إن كانت العشريات صيفية</b> ومنقوص إن كانت شتوية. '
        +'اضغط «سنة كاملة (٣٦)» ليصير المتوسط سنوياً حقيقياً — الثمن '+(T.pts.length*36)+' قراءة وعدة ضغطات استئناف. '
      : '<b>التغطية سنوية كاملة</b> ('+ST.wp.nDek+' عشرية) فالمتوسط يمثّل دورة البخر بمواسمها. ')
    +'والنقاط <b>مختارة تقريبياً</b> داخل '+esc(T.nm)+' ولم تُحقَّق على حدود رسمية. '
    +'نقطة خارج المسطح أو تحت سحابة تعطى قيمة شاذّة — لذلك تُعرض كل نقطة على حدة '
    +'ليُرى الشاذّ بدل أن يذوب فى متوسط. المدى المقروء: '+nf(S.min,1)+' – '+nf(S.max,1)+' مم/عشرة أيام. '
    +'<b>وتحويل العشرة أيام إلى يوم بالقسمة على ١٠</b> تقريب — العشرة الثالثة من الشهر ٨ إلى ١١ يوماً.');
  return s;
}
/* ═════ النشرة التنفيذية اليومية — قوالب حتمية لا توليد حر ═════ */
function bulletinText(){
  var L=[], q=cur("halfa"), lvl=(q!==null&&ST.thr)?alertLevel(q):null;
  var ens=runEnsemble(), stB=(ens&&ST.thr)?ensembleThresholdStats(ens,ST.thr.b):null;
  L.push("مذكرة الموقف اليومى — منظومة مِرقاب النيل");
  L.push("التاريخ: "+todayISO()+"  ·  build "+BUILD);
  L.push("");
  L.push("أولاً — الموقف الحالى:");
  if(q!==null) L.push("الوارد المُنمذَج لبحيرة ناصر عند وادى حلفا "+nf(q,0)+" م³/ث، والحالة «"+(lvl?lvl.nm:"—")+"» وفق عتبات "+(ST.thrBasis==="recent"?"آخر خمس سنوات":"الأرشيف الكامل")+".");
  else L.push("سلاسل التصرف غير محمَّلة بعد.");
  var os=operationalSentence(); if(os) L.push(os);
  if(ST.cal.on && ST.cal.model && q!==null){
    var cq=calQ("halfa",q);
    if(cq!==null) L.push("القيمة المُعايرة حجمياً للوارد: "+nf(cq,0)
      +" م³/ث (ضبط مقياس بمتوسطات منشورة للنظام الطبيعى — ليست قياساً ميدانياً).");
  }
  L.push("");
  L.push("ثانياً — النظرة الاحتمالية:");
  if(stB) L.push("احتمال تجاوز عتبة التأهّب خلال نافذة التنبؤ "+nf(stB.prob,0)+"٪ من أعضاء المروحة المُتتبَّعة ("+NMEM+" عضواً).");
  else L.push("المروحة الاحتمالية غير متاحة حالياً.");
  var ri=rainIndex();
  if(ri) L.push("مؤشر مطر الأحواض الموزون: "+nf(ri.past7,1)+" مم (الأسبوع المنقضى) مقابل "+nf(ri.next7,1)+" مم (المتوقع) — "+(ri.next7>ri.past7*1.4?"تصاعد يستوجب المتابعة":(ri.next7<ri.past7*0.7?"انحسار":"استقرار نسبى"))+".");
  L.push("");
  L.push("ثالثاً — التأكيد المستقل من الفضاء:");
  var sg=null; try{ sg=(ST.sar&&ST.sar.data&&ST.sar.data.shendi)? sarAgreement("shendi") : null; }catch(e){}
  if(sg&&sg.r!==null&&!isNaN(sg.r)) L.push("رادار Sentinel-1 (سهل شندى الفيضى): ارتباط المسطح المائى بالتصرف r="+nf(sg.r,2)+" على "+sg.n+" نقطة — تأكيد "+sg.level.g+".");
  else L.push("طبقة الرادار غير محمَّلة فى هذه الجلسة.");
  var ad=ST.alti&&ST.alti.data&&ST.alti.data.gerd, as2=null;
  try{ as2=altiStats("gerd"); }catch(e){}
  if(ad&&ad.series&&ad.series.length){ var last=ad.series[ad.series.length-1];
    var tr=(as2&&as2.d30!==null&&as2.d30!==undefined)? (as2.d30>0.15?" (اتجاه صاعد ~"+nf(as2.d30,1)+" م/٣٠ يوماً)":(as2.d30<-0.15?" (اتجاه هابط ~"+nf(as2.d30,1)+" م/٣٠ يوماً)":" (شبه مستقر)")) : "";
    L.push("ألتيمترى DAHITI: منسوب بحيرة سد النهضة "+nf(last.v,2)+" م بتاريخ "+last.t+tr+".");
  } else L.push("طبقة الألتيمترى غير محمَّلة فى هذه الجلسة.");
  var IVb=null; try{ IVb=damIntervals("gerd"); }catch(e){}
  if(IVb&&IVb.length){
    var Lb=IVb[IVb.length-1], sb=damState(Lb.dS);
    L.push("تشغيل سد النهضة (تقدير غير رسمى من الألتيمترى): "+sb.nm+" بمعدل "+nf(Math.abs(Lb.dS),0)
      +" م³/ث خلال "+Lb.days+" يوماً حتى "+Lb.t2
      +(Lb.rel!==null? "، فالإطلاق المُقدَّر نحو "+nf(Lb.rel,0)+" م³/ث مقابل وارد طبيعى مُنمذَج "+nf(Lb.nat,0)+" م³/ث." : "."));
  } else L.push("طبقة تشغيل الخزانات غير محمَّلة فى هذه الجلسة.");
  var gc=null; try{ gc=gfhCompare("halfa"); }catch(e){}
  if(gc&&gc.comparable&&gc.n>=2)
    L.push("الرأى الثانى (نموذج Google المستقل عند حلفا): فرق مطلق متوسط "+nf(gc.mad,1)
      +"٪ على "+gc.n+" يوماً متداخلاً، والانحياز "+(gc.bias>0?"+":"")+nf(gc.bias,1)+"٪ — "+gfhAgree(gc.mad).g+".");
  else L.push("طبقة الرأى الثانى (تنبؤ جوجل) غير محمَّلة فى هذه الجلسة.");
  L.push("");
  L.push("رابعاً — التوصية:");
  var k=lvl?lvl.k:0;
  if(k>=2) L.push("تفعيل غرفة العمليات ورفع وتيرة الرصد إلى كل ست ساعات، ومراجعة جاهزية المفيضات والتشوين، وإخطار الإدارات المعنية بمسار الموجة وأزمنة الوصول.");
  else if(k===1) L.push("رفع وتيرة متابعة المناسيب إلى مرتين يومياً، ومراجعة جاهزية منشآت التحكم، مع متابعة مطر الحوض الأزرق يومياً.");
  else L.push("استمرار الرصد الدورى المعتاد؛ لا إجراءات استثنائية.");
  L.push("");
  L.push("تنويه: الأرقام أعلاه مخرجات نمذجة GloFAS وتنبؤ احتمالى وقياسات فضائية — وليست قياسات أرضية معتمدة، ولا تحل محل بيانات محطات الرصد الرسمية.");
  L.push("");
  L.push("الإدارة المركزية للموارد المائية والرى لمحافظتى القاهرة والجيزة — مِرقاب النيل");
  return L.join("\n");
}
function bulletinCopy(){
  var t=bulletinText();
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(function(){ auditLog("نسخ النشرة اليومية",""); }).catch(function(){});
  else{ var ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(e){} document.body.removeChild(ta); }
}
function bulletinShare(){
  var t=bulletinText();

  else bulletinCopy();
}

    MwriDb.patch("apps/"+APPID+"/data/obs/"+sid+"/"+dt, {q:q, by:ST.user||"غير محدد"})
      .then(function(){ render(); })
      .catch(function(e){ netErr("تعذّر حفظ القياس (حُفظ محلياً وسيُرفع تلقائياً)", e); render(); });
  };
  el=$("ob-st"); if(el) el.onchange=function(){ ST.obsStation=this.value; };

  el=$("obb-save"); if(el) el.onclick=function(){
    var sid=$("obb-st")?$("obb-st").value:"halfa";
    var txt=$("obb-txt")? String($("obb-txt").value||"") : "";
    var lines=txt.split(/\r?\n/), acc={}, ok=0, bad=0, why=[], i;
    for(i=0;i<lines.length;i++){
      var ln=lines[i].replace(/^\s+|\s+$/g,"");
      if(!ln) continue;
      var p=ln.split(/[,;\t ]+/);
      if(p.length<2){ bad++; if(why.length<3) why.push("سطر "+(i+1)); continue; }
      var dt=p[0], q=parseFloat(p[1]);
      if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(dt)){
        var z=dt.split("/");
        dt=z[2]+"-"+("0"+z[1]).slice(-2)+"-"+("0"+z[0]).slice(-2);
      }
      if(!/^\d{4}-\d{2}-\d{2}$/.test(dt) || isNaN(q) || q<0 || q>200000){
        bad++; if(why.length<3) why.push("سطر "+(i+1)); continue;
      }
      acc[dt]={q:q, at:Date.now(), by:ST.user||"غير محدد"};
      ok++;
    }
    ST.obsBulk={ok:ok, bad:bad, why:why.join(" · ")};
    if(!ok){ render(); return; }
    ST.obs[sid]=ST.obs[sid]||{};
    var kk; for(kk in acc) if(Object.prototype.hasOwnProperty.call(acc,kk)) ST.obs[sid][kk]=acc[kk];
    ST.obsStation=sid;
    auditLog("إدخال جماعى للقياسات", (stn(sid)?stn(sid).nm:sid)+" · "+ok+" قياساً");
    MwriDb.patch("apps/"+APPID+"/data/obs/"+sid, acc)
      .then(function(){ render(); })
      .catch(function(e){ netErr("تعذّر رفع الدفعة (حُفظت محلياً وستُرفع تلقائياً)", e); render(); });
  };

  el=$("al-new"); if(el) el.onclick=function(){
    var q=cur("halfa"), lvl=alertLevel(q), ens=runEnsemble();
    var stB=ens? ensembleThresholdStats(ens, ST.thr.b) : null;
    var id=String(Date.now());
    var A={ at:Date.now(), level:lvl.k, levelName:lvl.nm, q:q, thr:ST.thr.b,
      prob: stB? stB.prob : null, eta: stB? stB.firstMed : null,
      to: ($("al-to")?$("al-to").value:"") || "", action: ($("al-act")?$("al-act").value:"") || "",
      status:"مُصدَر" };
    A.by=ST.user||"غير محدد";
    ST.alerts[id]=A;
    auditLog("إصدار إنذار", A.levelName+" · "+nf(q,0)+" م³/ث · "+(A.to||"—"));
    MwriDb.patch("apps/"+APPID+"/data/alerts/"+id, A).catch(function(e){ netErr("تعذّر حفظ الإنذار", e); });
    render();
  };
  each("[data-ack]",function(b){ b.onclick=function(){
    var id=this.getAttribute("data-ack");
    ST.alerts[id].status="تم الاطلاع";
    auditLog("اطّلاع على إنذار", id);
    MwriDb.patch("apps/"+APPID+"/data/alerts/"+id, {status:"تم الاطلاع", ackBy:ST.user||"غير محدد"}).catch(function(){});
    render(); }; });
  each("[data-done]",function(b){ b.onclick=function(){
    var id=this.getAttribute("data-done");
    ST.alerts[id].status="نُفّذ";
    auditLog("تنفيذ إنذار", id);
    MwriDb.patch("apps/"+APPID+"/data/alerts/"+id, {status:"نُفّذ", doneBy:ST.user||"غير محدد"}).catch(function(){});
    render(); }; });

  el=$("log-save"); if(el) el.onclick=function(){
    var e=buildLogEntry(); if(!e) return;
    ST.log[e.date]=e;
    MwriDb.patch("apps/"+APPID+"/data/log/"+e.date, e).catch(function(er){ netErr("تعذّر حفظ السجل", er); });
    render();
  };
  el=$("log-reload"); if(el) el.onclick=function(){ loadDbState().then(render).catch(function(){ render(); }); };
}

function buildNav(){
  var nav=$("nav"), mob=$("mobnav");
  if(nav) nav.innerHTML=""; if(mob) mob.innerHTML="";
  SECTIONS.forEach(function(s,i){
    if(nav){
      var b=document.createElement("button");
      b.setAttribute("data-id",s.id);
      b.innerHTML='<span class="nav-icon">'+s.icon+'</span><span>'+esc(s.title)+'</span>'
        +'<span class="nav-num">'+("0"+(i+1)).slice(-2)+'</span>';
      b.onclick=function(){ selectSection(s.id); };
      nav.appendChild(b);
    }
    if(mob){
      var m=document.createElement("button");
      m.setAttribute("data-id",s.id);
      m.textContent=s.title;
      m.onclick=function(){ selectSection(s.id); };
      mob.appendChild(m);
    }
  });
}
function selectSection(id){
  if(ST.net.playing){ clearInterval(ST.net.playing); ST.net.playing=null; }
  if(ST.rw.playing){ clearInterval(ST.rw.playing); ST.rw.playing=null; }
  var sec=null,i;
  for(i=0;i<SECTIONS.length;i++) if(SECTIONS[i].id===id) sec=SECTIONS[i];
  if(!sec) return;
  ST.sec=id;
  var b=document.querySelectorAll("#nav button, #mobnav button");
  for(i=0;i<b.length;i++) b[i].classList.toggle("active", b[i].getAttribute("data-id")===id);
  $("tb-eyebrow").textContent=sec.eyebrow;
  $("tb-title").textContent=sec.title;
  render();
  window.scrollTo(0,0);
}
function setConn(ok,msg){
  var d=$("dot"), c=$("conn");
  if(d) d.style.background= ok? "var(--green)":"var(--danger)";
  if(c) c.textContent=msg;
}
function setSync(state, detail, queued){
  var e=$("syncbadge"); if(!e) return;
  var map={ok:["green","القاعدة متصلة"], connecting:["sand","جارٍ الاتصال بالقاعدة"],
    queued:["sand","مؤجَّل ("+queued+")"], error:["danger","خطأ قاعدة"], init:["lake","—"]};
  var m=map[state]||map.init;
  e.className="pill "+m[0];
  e.textContent=m[1]+(detail?(" — "+String(detail).slice(0,60)):"");
}

function loadDbState(){
  return Promise.all([
    MwriDb.get("apps/"+APPID+"/data/thresholds").catch(function(){ return null; }),
    MwriDb.get("apps/"+APPID+"/data/obs").catch(function(){ return null; }),
    MwriDb.get("apps/"+APPID+"/data/alerts").catch(function(){ return null; }),
    MwriDb.get("apps/"+APPID+"/data/log").catch(function(){ return null; }),
    MwriDb.get("apps/"+APPID+"/data/reaches").catch(function(){ return null; }),
    MwriDb.get("apps/"+APPID+"/data/audit").catch(function(){ return null; }),
    MwriDb.get("apps/"+APPID+"/data/calib").catch(function(){ return null; })
  ]).then(function(r){
    if(r[0]&&typeof r[0].a==="number"){ ST.thrManual={a:r[0].a,b:r[0].b,c:r[0].c}; ST.thr=ST.thrManual; ST.thrSrc="يدوية"; }
    ST.obs   = r[1]||{};
    ST.alerts= r[2]||{};
    ST.log   = r[3]||{};
    ST.audit = r[5]||{};
    if(r[6]){
      ST.cal.on = !!r[6].on;
      if(r[6].ref){ ST.cal.ref=r[6].ref; ST.cal.refSrc=r[6].refSrc||"معتمد يدوياً"; }
    }
    if(r[4] && r[4].r){
      try{
        var rr=JSON.parse(r[4].r);
        if(rr && rr.length===REACHES.length) ST.reaches=rr;   /* المعاملات المعتمدة تعود بعد إعادة الفتح */
      }catch(e){}
    }
    try{ ST.user = localStorage.getItem("mwri_user") || ""; }catch(e){}
    return true;
  });
}

function publish(){
  if(!ST.q) return;
  /* العتبات المؤقتة مشتقّة من نافذة قصيرة وتعطى مستوى إنذار مضخّماً.
     نشرها للقاعدة المشتركة ينشر إنذاراً كاذباً على كل لوحة تقرأ منها — لا يُنشر قبل وصول الأرشيف. */
  if(ST.thrSrc === "مؤقتة"){
    MwriDb.patch("apps/"+APPID+"/summary", { status:"جارٍ تحميل الأرشيف", pending:true }).catch(function(){});
    return;
  }
  var q=cur("halfa"), lvl=alertLevel(q), ens=runEnsemble();
  var stB=ens? ensembleThresholdStats(ens, ST.thr.b) : null;
  MwriDb.publishSummary({
    kpis:{ halfa:Math.round(q||0), eldiem:Math.round(cur("eldiem")||0),
      khartoum:Math.round(cur("khartoum")||0), atbara:Math.round(cur("atbara")||0),
      level:lvl.k, prob: stB? Math.round(stB.prob) : 0 },
    status: lvl.nm, note: operationalSentence()||"",
    /* PATCH يدمج ولا يحذف: بدون هذا السطر يظل pending:true عالقاً بعد نشر «جارٍ تحميل الأرشيف» */
    pending:false
  }).catch(function(){});
}

function boot(){
  $("buildtag").textContent="build "+BUILD;
  buildNav();
  selectSection("command");
  setConn(false,"جارٍ الاتصال…");
  clearErr();
  MwriDb.onStatus(setSync);
  MwriDb.init({ app:APPID, name:"مِرقاب الفيضان — التنبؤ بفيضان النيل", type:"forecast", version:BUILD });
  loadDbState().catch(function(){});

  Promise.all([
    loadDischarge().catch(function(){ return null; }),
    loadRain().catch(function(){ return null; })
  ]).then(function(){
    if(ST.q && !ST.thr){ ST.thr=fallbackThresholds(); ST.thrSrc="مؤقتة"; }
    if(ST.q){
      var h=ST.stamp;
      setConn(true,"متصل — "+("0"+h.getHours()).slice(-2)+":"+("0"+h.getMinutes()).slice(-2));
    } else setConn(false,"تعذّر الاتصال — راجع الشارة");
    render();
    publish();
    /* الأرشيف فى الخلفية — هو مصدر العتبات الافتراضية */
    if(ST.q) loadClimatology("halfa", true).then(function(){ publish(); }).catch(function(){});
  });
}

var bi=$("btn-install");
if(bi) bi.onclick=function(){ pwaInstall(); };

var br=$("btn-refresh");
if(br) br.onclick=function(){
  ST.q=null; ST.mem=null; ST.rain=null; ST.clim=null; ST.calib=null;
  if(!ST.thrManual){ ST.thr=null; ST.thrClim=null; }
  render(); boot();
};

/* التقاط حدث قابلية التثبيت — يجب أن يُسجَّل مبكراً قبل إطلاق المتصفح له */
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  ST.pwa.prompt = e;
  ST.pwa.evtFired = true;
  var b=$("btn-install"); if(b) b.style.display="inline-flex";
});
window.addEventListener("appinstalled", function(){
  ST.pwa.installed = true; ST.pwa.prompt = null;
  var b=$("btn-install"); if(b) b.style.display="none";
});

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(e){
      console.warn("SW registration failed", e && e.message);
    });
  });
}

boot();

</script>
