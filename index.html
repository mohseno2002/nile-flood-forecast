<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#155b75">
<meta name="description" content="لوحة التنبؤ بفيضان النيل من المنابع حتى أسوان">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مِرقاب الفيضان">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>مِرقاب الفيضان — مركز قيادة الموجة</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf8f2; --paper-2:#f3efe4; --sand:#e9dfc8;
  --lake:#247ba0; --lake-deep:#155b75; --green:#4d7c5a; --field:#dce8d7;
  --ink:#243238; --muted:#66736f; --clay:#b46f4b;
  --line:#ded6c5; --white:#ffffffd6; --white-solid:#ffffff;
  --amber:#c58a2f; --danger:#b8503f; --danger-bg:#f6e7e3;
  --shadow:0 10px 30px #4d432c14, 0 2px 4px #4d432c0d;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--paper);-webkit-text-size-adjust:100%;overflow-x:hidden}
body{color:var(--ink);background:var(--paper);
  font-family:"IBM Plex Sans Arabic","Cairo","Segoe UI",Tahoma,Arial,sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased}
button{cursor:pointer;color:inherit;font:inherit}
h1,h2,h3{letter-spacing:-.3px}
::selection{background:#247ba033}

.app-shell{
  background:
    radial-gradient(circle at 8% 0%, #247ba014, transparent 28%),
    linear-gradient(#ffffff70,#ffffff70),
    repeating-linear-gradient(120deg, transparent 0 72px, #b46f4b06 73px 74px),
    var(--paper);
  grid-template-columns:1fr 248px;min-height:100vh;display:grid}
@media(max-width:820px){.app-shell{grid-template-columns:1fr}.side-nav{display:none!important}}

.side-nav{border-left:1px solid var(--line);z-index:50;backdrop-filter:blur(18px);
  background:rgba(249,247,239,.94);flex-direction:column;grid-area:1/2;height:100vh;
  padding:22px 16px;display:flex;position:sticky;top:0}
.brand-mark{grid-template-rows:36px 20px;grid-template-columns:46px 1fr;align-items:center;
  height:78px;margin-bottom:16px;padding:8px 12px;display:grid}
.brand-mark>span{color:#fff;background:linear-gradient(145deg,var(--lake),var(--green));
  border-radius:13px 13px 13px 4px;grid-row:1/3;place-items:center;width:42px;height:42px;
  font-size:23px;font-weight:800;display:grid}
.brand-mark b{align-self:end;margin-right:10px;font-size:20px;color:var(--ink)}
.brand-mark small{letter-spacing:1.6px;color:var(--lake);align-self:start;margin-right:10px;font-size:8px}
.side-nav nav{flex-direction:column;gap:4px;display:flex;overflow-y:auto;margin:0 -6px;padding:0 6px}
.side-nav nav button{color:#59645f;text-align:right;background:none;border:0;border-radius:12px;
  align-items:center;gap:11px;width:100%;min-height:44px;padding:8px 12px;font-size:12.5px;
  font-weight:600;transition:.18s;display:flex}
.side-nav nav button:hover{background:#f0ece0;transform:translateX(-2px)}
.side-nav nav button.active{color:var(--lake-deep);box-shadow:inset -3px 0 var(--lake);background:#e6f0ed}
.nav-icon{opacity:.92;border:1px solid currentColor;border-radius:8px;place-items:center;
  width:26px;height:26px;font-size:14px;display:grid;flex:0 0 auto}
.nav-num{margin-right:auto;font-family:var(--mono);font-size:9px;opacity:.5}
.nav-foot{border-top:1px solid var(--line);color:var(--muted);grid-template-columns:10px 1fr;
  align-items:center;gap:4px 7px;margin-top:12px;padding:14px 8px 2px;font-size:11px;display:grid}

.main{grid-area:1/1;min-width:0;display:flex;flex-direction:column}
.topbar{border-bottom:1px solid var(--line);z-index:30;backdrop-filter:blur(16px);
  background:rgba(250,248,242,.8);justify-content:space-between;align-items:center;
  gap:10px;min-height:92px;padding:14px 30px;display:flex;position:sticky;top:0;flex-wrap:wrap}
.topbar .eyebrow{color:var(--lake);letter-spacing:.4px;margin-bottom:5px;font-size:9px;font-weight:800;display:block}
.topbar h1{font-size:19px;font-weight:700;color:var(--ink)}
.content{padding:22px 30px 60px;max-width:1180px;width:100%}
@media(max-width:820px){.topbar,.content{padding-inline:14px}.topbar h1{font-size:16px}}

.mob-nav{display:none;gap:6px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--line);
  background:rgba(250,248,242,.95);position:sticky;top:0;z-index:40}
.mob-nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:7px 13px;font-size:11px;font-weight:700;color:#59645f;flex:0 0 auto}
.mob-nav button.active{background:linear-gradient(135deg,var(--lake),var(--lake-deep));color:#fff;border-color:transparent}
@media(max-width:820px){.mob-nav{display:flex}}

.grid{display:grid;gap:15px}
.grid.g5{grid-template-columns:repeat(5,1fr)}
.grid.g4{grid-template-columns:repeat(4,1fr)}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.grid.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1000px){.grid.g5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.grid.g4,.grid.g5{grid-template-columns:repeat(2,1fr)}.grid.g3,.grid.g2{grid-template-columns:1fr}}
.kpi-card{background:var(--white);border:1px solid var(--line);box-shadow:var(--shadow);
  border-radius:14px;padding:14px;display:flex;gap:11px;align-items:flex-start}
.kpi-icon{width:41px;height:41px;color:var(--lake-deep);background:#e8f0f1;border:1px solid #c8d9d9;
  border-radius:13px;place-items:center;font-size:20px;display:grid;flex:0 0 auto}
.kpi-card.green .kpi-icon{color:var(--green);background:#edf4e8;border-color:#c8d9bd}
.kpi-card.sand .kpi-icon{color:var(--clay);background:#f5eee1;border-color:#e3d3bd}
.kpi-card.danger .kpi-icon{color:var(--danger);background:var(--danger-bg);border-color:#e6c3bb}
.kpi-body{min-width:0}
.kpi-body .lbl{font-size:10.5px;color:var(--muted);font-weight:600;margin-bottom:3px}
.kpi-body .big{font-size:24px;font-weight:700;font-family:var(--mono);color:var(--ink);line-height:1.1;
  font-variant-numeric:tabular-nums}
.kpi-body .big .unit{font-size:10.5px;font-weight:500;color:var(--muted);margin-right:3px;font-family:inherit}
.kpi-body .sub{font-size:9.5px;color:var(--muted);margin-top:4px}

.panel{background:var(--white);border:1px solid var(--line);box-shadow:var(--shadow);
  border-radius:16px;padding:18px;margin-top:15px}
.panel h2{font-size:15px;font-weight:700;margin-bottom:2px}
.panel p.note{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.7}
.eyebrow{color:var(--lake);letter-spacing:.4px;margin-bottom:5px;font-size:9px;font-weight:800;display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-size:11px;
  font-weight:600;color:#4c5854;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--lake);color:var(--lake-deep)}
.btn.solid{background:linear-gradient(135deg,var(--lake),var(--lake-deep));color:#fff;border:0;
  box-shadow:0 6px 14px #247ba026}
.btn.mini{padding:5px 10px;font-size:10px;border-radius:8px}
.btn[disabled]{opacity:.5;pointer-events:none}
.pill{font-size:9px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block}
.pill.green{background:#edf4e8;color:var(--green)}
.pill.sand{background:#f5eee1;color:var(--clay)}
.pill.lake{background:#e8f0f1;color:var(--lake-deep)}
.pill.danger{background:var(--danger-bg);color:var(--danger)}

table.tb{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:10px}
table.tb th{background:var(--paper-2);color:#4c5854;font-weight:700;font-size:10.5px;
  padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.tb td{padding:8px;border-bottom:1px solid #ece7db;font-variant-numeric:tabular-nums}
table.tb td.num{font-family:var(--mono);text-align:left;direction:ltr}
table.tb tr:last-child td{border-bottom:0}
table.tb tr.hi td{background:#f2f7f4}
.tb-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-top:12px}
.tb-wrap table.tb{margin-top:0}

.chart-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:12px;overflow-x:auto}
.chart-box svg{display:block;min-width:520px;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:10px;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-left:5px;vertical-align:-1px}

.banner{border-radius:12px;padding:12px 14px;font-size:12px;font-weight:600;margin-top:14px;
  display:flex;gap:10px;align-items:flex-start;line-height:1.7}
.banner.ok{background:#edf4e8;color:#33553f;border:1px solid #c8d9bd}
.banner.warn{background:#f8f1e2;color:#7d5a1c;border:1px solid #e6d5ae}
.banner.danger{background:var(--danger-bg);color:#8a3427;border:1px solid #e6c3bb}
.banner.info{background:#e9f1f3;color:var(--lake-deep);border:1px solid #c8d9d9}
.banner b{font-weight:800}

.netbar{position:fixed;inset-inline:10px;bottom:10px;z-index:200;display:none;flex-direction:column;gap:6px}
.netmsg{background:#fff;border:1px solid var(--danger);border-right:4px solid var(--danger);
  border-radius:10px;padding:9px 12px;font-size:10.5px;color:#7a3226;box-shadow:var(--shadow);
  word-break:break-word;font-family:var(--mono);direction:ltr;text-align:left}
.netmsg b{font-family:"IBM Plex Sans Arabic",sans-serif;direction:rtl;display:block;text-align:right;
  font-size:11px;color:var(--danger);margin-bottom:3px}

.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.ctrl label{font-size:10.5px;color:var(--muted);font-weight:700}
.ctrl select,.ctrl input{font-family:inherit;font-size:11.5px;border:1px solid var(--line);
  background:#fff;border-radius:9px;padding:7px 10px;color:var(--ink);min-width:0}
.ctrl input[type=number]{width:86px;font-family:var(--mono);direction:ltr;text-align:left}
.ctrl input[type=range]{accent-color:var(--lake);width:150px}

.skel{background:linear-gradient(90deg,#f0ece0,#f7f4ea,#f0ece0);background-size:200% 100%;
  animation:sk 1.3s linear infinite;border-radius:8px;height:13px;margin:7px 0}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.loading-note{font-size:11px;color:var(--muted);margin-top:8px}

.node-lbl{font-family:"IBM Plex Sans Arabic",sans-serif;font-size:9.5px;fill:#3b4a4f;font-weight:600}
.node-val{font-family:"IBM Plex Mono",monospace;font-size:9px;fill:var(--lake-deep);font-weight:600}
.axis-lbl{font-family:"IBM Plex Mono",monospace;font-size:8.5px;fill:#8a938f}
.axis-ttl{font-family:"IBM Plex Sans Arabic",sans-serif;font-size:9.5px;fill:var(--muted);font-weight:700}

@media print{
  .side-nav,.mob-nav,.topbar .actions,.netbar,.ctrl{display:none!important}
  .app-shell{grid-template-columns:1fr}
  .panel,.kpi-card{break-inside:avoid;box-shadow:none}
  body{background:#fff}
}

/* ── مخطط المجارى التفاعلى ── */
#net-wrap{touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab; border-radius:12px; overflow:hidden}
#net-wrap:active{cursor:grabbing}
.net-node{cursor:pointer}
.net-node circle{transition:r .25s ease, opacity .3s ease}
.net-link{transition:opacity .3s ease, stroke-width .25s ease}
.flow{stroke-dasharray:10 18; animation-name:netflow; animation-timing-function:linear; animation-iteration-count:infinite}
@keyframes netflow{ from{stroke-dashoffset:0} to{stroke-dashoffset:-28} }
.net-toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:10px}
.net-toolbar input[type=range]{flex:1; min-width:150px; direction:ltr; accent-color:#155b75}
.net-day{font-size:12.5px; color:#5a6a72; min-width:118px; text-align:center; background:#eef3f0; border-radius:8px; padding:5px 8px}
.net-day.fut{background:#fbf3e2; color:#8a6d1f}
.net-btn{border:1px solid #d8d2c2; background:#fff; border-radius:9px; padding:6px 12px; font-family:inherit; font-size:13px; color:#155b75; cursor:pointer}
.net-btn.on{background:#155b75; color:#fff; border-color:#155b75}
#net-detail .spark-fut{stroke-dasharray:4 4}
@media (prefers-reduced-motion: reduce){ .flow{animation:none !important} }
.rain-cell{cursor:pointer}
.inp{width:78px;border:1px solid #d8d2c2;border-radius:8px;padding:5px 8px;font-family:inherit;font-size:13px;direction:ltr;text-align:center}

/* ═══ سطح المكتب: مساحة أوسع وكثافة نصية أعلى ═══ */
.net-node{cursor:pointer}
@media(min-width:1200px){
  .content{max-width:1360px;padding:26px 40px 70px}
  .topbar h1{font-size:21px}
  .panel{padding:22px;border-radius:18px;margin-top:18px}
  .panel h2{font-size:16.5px}
  .panel p.note{font-size:12.5px;line-height:1.75}
  .grid{gap:17px}
  table.tb{font-size:12.5px}
  table.tb th{font-size:11.5px;padding:11px 10px}
  table.tb td{padding:10px}
  .kpi-card{padding:16px}
  .kpi-body .big{font-size:27px}
  .kpi-body .lbl{font-size:11.5px}
  .kpi-body .sub{font-size:10.5px}
  .banner{font-size:13px;line-height:1.8}
}
@media(min-width:1700px){
  .content{max-width:1560px}
  .grid.g5{grid-template-columns:repeat(5,1fr)}
}
</style>
</head>
<body>
<div class="app-shell">
  <aside class="side-nav">
    <div class="brand-mark">
      <span>≈</span>
      <b>مِرقاب الفيضان</b>
      <small>WAVE COMMAND · V2</small>
    </div>
    <nav id="nav"></nav>
    <div class="nav-foot">
      <span id="dot" style="width:8px;height:8px;border-radius:50%;background:var(--amber)"></span>
      <span id="conn">جارٍ الاتصال…</span>
      <small id="buildtag">build 2.50</small>
      <span></span><span id="syncbadge" class="pill lake" style="margin-top:6px">—</span>
    </div>
  </aside>

  <main class="main">
    <div class="mob-nav" id="mobnav"></div>
    <header class="topbar">
      <div>
        <span class="eyebrow" id="tb-eyebrow">مركز التنبؤ بالفيضان</span>
        <h1 id="tb-title">غرفة الفيضان</h1>
      </div>
      <div class="actions">
        <span id="syncbadge2" class="pill lake" style="display:none">—</span>
        <button class="btn solid" id="btn-install" style="display:none">⤓ تثبيت</button>
        <button class="btn" id="btn-refresh">↻ تحديث</button>
        <button class="btn solid" onclick="window.print()">⎙ طباعة / PDF</button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="netbar" id="netbar"></div>

<script>
/*!
 * MWRI Hydraulics Core - v1.0
 * النواة الحسابية الهيدروليكية الموحّدة لتطبيقات م. محسن
 * SI units only: m, m/s, m3/s, s.  g = 9.81 m/s2
 * قيد إلزامى: لا backticks ولا template literals فى هذا الملف إطلاقاً.
 * الاستخدام: <script src="hydraulics.js"><\/script> ثم MWRIHyd.normalDepth(...)
 */
(function (root) {
  "use strict";

  var G = 9.81;
  var EPS = 1e-9;

  function num(v, name) {
    if (typeof v !== "number" || !isFinite(v)) {
      throw new Error("MWRIHyd: قيمة غير صالحة للمتغير " + (name || "?"));
    }
    return v;
  }

  /* ==========================================================
   * 1) هندسة المقاطع
   * ========================================================== */

  /* مقطع شبه منحرف: b قاع، y عمق، z ميل الجوانب (أفقى:رأسى) */
  function trapArea(b, y, z) { return (b + z * y) * y; }
  function trapPerimeter(b, y, z) { return b + 2 * y * Math.sqrt(1 + z * z); }
  function trapTopWidth(b, y, z) { return b + 2 * z * y; }

  function trapSection(b, y, z) {
    num(b, "b"); num(y, "y"); num(z, "z");
    if (y <= 0) return { A: 0, P: b, T: b, R: 0, D: 0, y: y };
    var A = trapArea(b, y, z);
    var P = trapPerimeter(b, y, z);
    var T = trapTopWidth(b, y, z);
    return { A: A, P: P, T: T, R: A / P, D: A / T, y: y };
  }

  /* مقطع طبيعى غير منتظم من نقاط مرفوعة {x, z} — z منسوب القاع
     يرجع A و P و T عند منسوب سطح ماء wl */
  function irregularSection(points, wl) {
    if (!points || points.length < 2) throw new Error("MWRIHyd: نقاط المقطع أقل من نقطتين");
    var A = 0, P = 0, T = 0;
    for (var i = 0; i < points.length - 1; i++) {
      var x1 = points[i].x, z1 = points[i].z;
      var x2 = points[i + 1].x, z2 = points[i + 1].z;
      var d1 = wl - z1, d2 = wl - z2;
      if (d1 <= 0 && d2 <= 0) continue;
      var xa = x1, xb = x2, da = d1, db = d2;
      if (d1 < 0) { /* تقاطع سطح الماء على اليسار */
        xa = x1 + (x2 - x1) * (0 - d1) / (d2 - d1); da = 0;
      }
      if (d2 < 0) { /* تقاطع على اليمين */
        xb = x1 + (x2 - x1) * (0 - d1) / (d2 - d1); db = 0;
      }
      var w = xb - xa;
      if (w <= 0) continue;
      A += 0.5 * (da + db) * w;
      P += Math.sqrt(w * w + (da - db) * (da - db));
      T += w;
    }
    return { A: A, P: P, T: T, R: P > 0 ? A / P : 0, D: T > 0 ? A / T : 0, wl: wl };
  }

  /* ==========================================================
   * 2) مانينج والتصرف
   * ========================================================== */

  /* Q = (1/n) * A * R^(2/3) * S^(1/2)   — مانينج SI */
  function manningQ(n, A, R, S) {
    num(n, "n"); num(A, "A"); num(R, "R"); num(S, "S");
    if (n <= 0) throw new Error("MWRIHyd: معامل الخشونة n يجب أن يكون موجباً");
    if (S < 0) throw new Error("MWRIHyd: الميل S سالب — استخدم GVF للميول العكسية");
    return (1 / n) * A * Math.pow(R, 2 / 3) * Math.sqrt(S);
  }

  function manningV(n, R, S) {
    return (1 / n) * Math.pow(R, 2 / 3) * Math.sqrt(S);
  }

  /* الاستنتاج العكسى: معامل الخشونة من قياس حقلى */
  function manningN(Q, A, R, S) {
    if (Q <= 0) throw new Error("MWRIHyd: التصرف المقاس يجب أن يكون موجباً");
    return (A * Math.pow(R, 2 / 3) * Math.sqrt(S)) / Q;
  }

  /* التصرّفية K = (1/n) A R^(2/3) */
  function conveyance(n, A, R) { return (1 / n) * A * Math.pow(R, 2 / 3); }

  /* ==========================================================
   * 3) العمق الطبيعى والحرج (bisection — لا يفشل مثل نيوتن)
   * ========================================================== */

  function bisect(f, lo, hi, tol, maxIter) {
    tol = tol || 1e-7;
    maxIter = maxIter || 200;
    var flo = f(lo), fhi = f(hi);
    if (flo * fhi > 0) {
      /* توسيع المدى مرة واحدة قبل الاستسلام */
      var k = 0;
      while (flo * fhi > 0 && k < 40) { hi = hi * 2; fhi = f(hi); k++; }
      if (flo * fhi > 0) return NaN;
    }
    var mid = lo;
    for (var i = 0; i < maxIter; i++) {
      mid = 0.5 * (lo + hi);
      var fm = f(mid);
      if (Math.abs(fm) < EPS || (hi - lo) < tol) return mid;
      if (flo * fm < 0) { hi = mid; fhi = fm; } else { lo = mid; flo = fm; }
    }
    return mid;
  }

  /* العمق الطبيعى yn لمقطع شبه منحرف */
  function normalDepth(Q, b, z, n, S) {
    num(Q, "Q");
    if (S <= 0) throw new Error("MWRIHyd: العمق الطبيعى غير معرّف لميل صفر أو عكسى");
    var f = function (y) {
      var s = trapSection(b, y, z);
      return manningQ(n, s.A, s.R, S) - Q;
    };
    return bisect(f, 1e-6, Math.max(10, Q));
  }

  /* العمق الحرج yc: Q^2 * T / (g * A^3) = 1 */
  function criticalDepth(Q, b, z) {
    var f = function (y) {
      var s = trapSection(b, y, z);
      return (Q * Q * s.T) / (G * s.A * s.A * s.A) - 1;
    };
    return bisect(f, 1e-6, Math.max(10, Q));
  }

  function froude(Q, A, T) {
    if (A <= 0 || T <= 0) return 0;
    return Q / (A * Math.sqrt(G * (A / T)));
  }

  /* الطاقة النوعية E = y + V^2/2g */
  function specificEnergy(Q, A, y) {
    var V = Q / A;
    return y + (V * V) / (2 * G);
  }

  /* ==========================================================
   * 4) السريان المتغيّر التدريجى GVF بطريقة رونج-كوتا الرابعة
   * dy/dx = (S0 - Sf) / (1 - Fr^2)
   * الاتجاه: للسريان تحت الحرج نتكامل عكس اتجاه السريان (من المصب للمنبع)
   * ========================================================== */

  function gvfSlope(y, Q, b, z, n, S0) {
    var s = trapSection(b, y, z);
    if (s.A <= 0) return 0;
    var Sf = Math.pow((Q * n) / (s.A * Math.pow(s.R, 2 / 3)), 2);
    var Fr2 = (Q * Q * s.T) / (G * s.A * s.A * s.A);
    var den = 1 - Fr2;
    if (Math.abs(den) < 1e-6) den = den < 0 ? -1e-6 : 1e-6; /* حماية عند الحرج */
    return (S0 - Sf) / den;
  }

  /* opts: {Q, b, z, n, S0, yStart, length, dx, direction}
     direction: "upstream" (افتراضى، تحت حرج) أو "downstream" (فوق حرج)
     يرجع مصفوفة نقاط {x, y, wl, V, Fr, Sf} — x تتزايد باتجاه التكامل */
  function gvfProfile(opts) {
    var Q = num(opts.Q, "Q"), b = opts.b, z = opts.z, n = opts.n, S0 = opts.S0;
    var y = num(opts.yStart, "yStart");
    var L = num(opts.length, "length");
    var dx = opts.dx || Math.max(1, L / 200);
    var dir = opts.direction === "downstream" ? 1 : -1; /* -1 = نتحرك للمنبع */
    var zBed = typeof opts.bedLevelStart === "number" ? opts.bedLevelStart : 0;
    var out = [];
    var x = 0;
    var steps = Math.ceil(L / dx);
    for (var i = 0; i <= steps; i++) {
      var s = trapSection(b, y, z);
      var V = s.A > 0 ? Q / s.A : 0;
      var Sf = Math.pow((Q * n) / (s.A * Math.pow(s.R, 2 / 3)), 2);
      out.push({
        x: x,
        y: y,
        bed: 0,
        wl: 0,
        V: V,
        Fr: froude(Q, s.A, s.T),
        Sf: Sf
      });
      if (i === steps) break;
      /* RK4 على المسافة h = dir*dx */
      var h = dir * dx;
      var k1 = gvfSlope(y, Q, b, z, n, S0);
      var k2 = gvfSlope(Math.max(1e-4, y + 0.5 * h * k1), Q, b, z, n, S0);
      var k3 = gvfSlope(Math.max(1e-4, y + 0.5 * h * k2), Q, b, z, n, S0);
      var k4 = gvfSlope(Math.max(1e-4, y + h * k3), Q, b, z, n, S0);
      y = y + (h / 6) * (k1 + 2 * k2 + 2 * k3 + k4);
      if (!isFinite(y) || y <= 1e-4) { y = 1e-4; }
      x += dx;
    }
    /* تصحيح عمود bed: يُحسب صراحةً بدل التعبير المركّب أعلاه */
    for (var j = 0; j < out.length; j++) {
      out[j].bed = zBed + (dir === -1 ? S0 * out[j].x : -S0 * out[j].x);
      out[j].wl = out[j].bed + out[j].y;
    }
    return out;
  }

  /* تصنيف منحنى الارتداد: M1/M2/M3/S1/S2/S3/C/H/A */
  function backwaterClass(y, yn, yc, S0) {
    var slopeType;
    if (S0 <= 0) slopeType = S0 === 0 ? "H" : "A";
    else if (Math.abs(yn - yc) / Math.max(yc, 1e-6) < 0.01) slopeType = "C";
    else slopeType = yn > yc ? "M" : "S";
    var hi = Math.max(yn, yc), lo = Math.min(yn, yc);
    var zone = y > hi ? 1 : (y > lo ? 2 : 3);
    return slopeType + zone;
  }

  /* ==========================================================
   * 5) البوابات
   * a = فتحة البوابة، y1 = العمق أمام البوابة، y3 = العمق خلفها
   * Cc = معامل الانكماش (0.61 افتراضياً لبوابة رأسية حادة)
   * ========================================================== */

  function gateFlow(opts) {
    var b = num(opts.b, "b"), a = num(opts.a, "a"), y1 = num(opts.y1, "y1");
    var y3 = typeof opts.y3 === "number" ? opts.y3 : 0;
    var Cc = typeof opts.Cc === "number" ? opts.Cc : 0.61;
    if (a <= 0 || y1 <= a) return { Q: 0, mode: "مغلقة أو غارقة كلياً", Cd: 0 };
    var y2 = Cc * a; /* عمق vena contracta */
    /* حد الغمر: العمق المتعاقب لـ y2 */
    var submerged = y3 > y2 * 1.0 && y3 > 0;
    var Cd, Q, mode;
    if (!submerged) {
      /* سريان حر — صيغة الطاقة الدقيقة */
      Cd = Cc / Math.sqrt(1 + (Cc * a) / y1);
      Q = Cd * b * a * Math.sqrt(2 * G * y1);
      mode = "حر";
    } else {
      var dh = y1 - y3;
      if (dh <= 0) return { Q: 0, mode: "لا فرق منسوب", Cd: 0 };
      Cd = Cc / Math.sqrt(1 + (Cc * a) / y1);
      Q = Cd * b * a * Math.sqrt(2 * G * dh);
      mode = "مغمور";
    }
    return { Q: Q, Cd: Cd, y2: y2, mode: mode };
  }

  /* فتحة البوابة المطلوبة لتمرير تصرف مستهدف (سريان حر) */
  function gateOpeningFor(Qtarget, b, y1, Cc) {
    Cc = Cc || 0.61;
    var f = function (a) {
      return gateFlow({ b: b, a: a, y1: y1, Cc: Cc }).Q - Qtarget;
    };
    return bisect(f, 1e-4, Math.max(0.01, y1 * 0.99));
  }

  /* ==========================================================
   * 6) الهدارات
   * ========================================================== */

  /* هدار حاد الحافة مستطيل — ريبوك Rehbock: H الشحنة، P ارتفاع الهدار */
  function sharpCrestedWeir(b, H, P) {
    if (H <= 0) return 0;
    var Ce = 0.611 + 0.075 * (H / Math.max(P, 1e-6));
    var He = H + 0.0011;
    return (2 / 3) * Ce * b * Math.sqrt(2 * G) * Math.pow(He, 1.5);
  }

  /* هدار عريض القمة */
  function broadCrestedWeir(b, H, Cd) {
    if (H <= 0) return 0;
    Cd = typeof Cd === "number" ? Cd : 0.85;
    return Cd * b * Math.sqrt(G) * Math.pow((2 / 3) * H, 1.5);
  }

  /* هدار مثلث V-notch بزاوية theta بالدرجات (90 افتراضى) */
  function vNotchWeir(H, thetaDeg, Cd) {
    if (H <= 0) return 0;
    thetaDeg = thetaDeg || 90;
    Cd = typeof Cd === "number" ? Cd : 0.58;
    var t = (thetaDeg * Math.PI) / 180;
    return (8 / 15) * Cd * Math.sqrt(2 * G) * Math.tan(t / 2) * Math.pow(H, 2.5);
  }

  /* ==========================================================
   * 7) القفزة الهيدروليكية
   * ========================================================== */

  function hydraulicJump(y1, Q, b) {
    var A1 = b * y1;
    var V1 = Q / A1;
    var Fr1 = V1 / Math.sqrt(G * y1);
    if (Fr1 <= 1) return { Fr1: Fr1, y2: y1, dE: 0, note: "لا توجد قفزة (السريان تحت حرج)" };
    var y2 = 0.5 * y1 * (Math.sqrt(1 + 8 * Fr1 * Fr1) - 1);
    var dE = Math.pow(y2 - y1, 3) / (4 * y1 * y2);
    var type;
    if (Fr1 < 1.7) type = "متموجة";
    else if (Fr1 < 2.5) type = "ضعيفة";
    else if (Fr1 < 4.5) type = "متذبذبة";
    else if (Fr1 < 9) type = "ثابتة (مثالية للحوض)";
    else type = "قوية";
    return { Fr1: Fr1, y2: y2, dE: dE, Lj: 6 * y2, type: type };
  }

  /* ==========================================================
   * 8) منحنى التصريف Rating Curve:  Q = C (h - h0)^m
   * الملاءمة بالمربعات الصغرى على المقياس اللوغاريتمى مع بحث عن h0
   * data: [{h, Q}, ...]
   * ========================================================== */

  function fitRatingCurve(data, h0Range) {
    if (!data || data.length < 3) throw new Error("MWRIHyd: منحنى التصريف يحتاج 3 قياسات على الأقل");
    var hMin = Infinity;
    for (var i = 0; i < data.length; i++) { if (data[i].h < hMin) hMin = data[i].h; }
    var lo = h0Range ? h0Range[0] : hMin - 5;
    var hi = h0Range ? h0Range[1] : hMin - 0.001;
    var best = null;
    var steps = 400;
    for (var k = 0; k <= steps; k++) {
      var h0 = lo + ((hi - lo) * k) / steps;
      var sx = 0, sy = 0, sxx = 0, sxy = 0, nPts = 0;
      var ok = true;
      for (var j = 0; j < data.length; j++) {
        var dh = data[j].h - h0;
        if (dh <= 0 || data[j].Q <= 0) { ok = false; break; }
        var X = Math.log(dh), Y = Math.log(data[j].Q);
        sx += X; sy += Y; sxx += X * X; sxy += X * Y; nPts++;
      }
      if (!ok || nPts < 3) continue;
      var den = nPts * sxx - sx * sx;
      if (Math.abs(den) < EPS) continue;
      var m = (nPts * sxy - sx * sy) / den;
      var lnC = (sy - m * sx) / nPts;
      var C = Math.exp(lnC);
      /* R2 على القيم الحقيقية لا اللوغاريتمية */
      var ssRes = 0, ssTot = 0, mean = 0;
      for (var t = 0; t < data.length; t++) { mean += data[t].Q; }
      mean /= data.length;
      for (var t2 = 0; t2 < data.length; t2++) {
        var pred = C * Math.pow(data[t2].h - h0, m);
        ssRes += Math.pow(data[t2].Q - pred, 2);
        ssTot += Math.pow(data[t2].Q - mean, 2);
      }
      var R2 = ssTot > 0 ? 1 - ssRes / ssTot : 0;
      if (!best || R2 > best.R2) best = { C: C, m: m, h0: h0, R2: R2, rmse: Math.sqrt(ssRes / data.length) };
    }
    if (!best) throw new Error("MWRIHyd: تعذّرت ملاءمة منحنى التصريف — راجع البيانات");
    return best;
  }

  function ratingQ(fit, h) {
    if (h <= fit.h0) return 0;
    return fit.C * Math.pow(h - fit.h0, fit.m);
  }

  /* ==========================================================
   * 9) الاتزان المائى
   * inflows/outflows: مصفوفات {name, Q}
   * ========================================================== */

  function waterBalance(inflows, outflows, opts) {
    opts = opts || {};
    var sumIn = 0, sumOut = 0, i;
    for (i = 0; i < (inflows || []).length; i++) sumIn += inflows[i].Q || 0;
    for (i = 0; i < (outflows || []).length; i++) sumOut += outflows[i].Q || 0;
    var seepage = opts.seepage || 0;
    var evap = opts.evaporation || 0;
    var closure = sumIn - sumOut - seepage - evap;
    var pct = sumIn > 0 ? (closure / sumIn) * 100 : 0;
    var tol = typeof opts.tolerancePct === "number" ? opts.tolerancePct : 5;
    return {
      inflow: sumIn,
      outflow: sumOut,
      seepage: seepage,
      evaporation: evap,
      closure: closure,
      closurePct: pct,
      status: Math.abs(pct) <= tol ? "مقبول" : (closure > 0 ? "فاقد غير مفسّر" : "عجز — راجع القياسات"),
      tolerancePct: tol
    };
  }

  /* ==========================================================
   * 10) تتبّع الموجة — Muskingum
   * inflow: مصفوفة تصرفات، dt بالثوانى، K بالثوانى، x بين 0 و0.5
   * ========================================================== */

  function muskingum(inflow, K, x, dt, Q0) {
    var den = 2 * K * (1 - x) + dt;
    var C0 = (dt - 2 * K * x) / den;
    var C1 = (dt + 2 * K * x) / den;
    var C2 = (2 * K * (1 - x) - dt) / den;
    var out = [typeof Q0 === "number" ? Q0 : inflow[0]];
    for (var i = 1; i < inflow.length; i++) {
      out.push(C0 * inflow[i] + C1 * inflow[i - 1] + C2 * out[i - 1]);
    }
    return { outflow: out, C0: C0, C1: C1, C2: C2, stable: (dt >= 2 * K * x && dt <= 2 * K * (1 - x)) };
  }

  /* ==========================================================
   * 11) فحوص المعقولية — تُستدعى قبل عرض أى رقم للمستخدم
   * ========================================================== */

  function sanityCheck(res) {
    var flags = [];
    if (typeof res.V === "number") {
      if (res.V > 2.0) flags.push({ level: "خطر", msg: "سرعة " + res.V.toFixed(2) + " م/ث تتجاوز حد النحر لترعة ترابية (2.0)" });
      else if (res.V < 0.3 && res.V > 0) flags.push({ level: "تنبيه", msg: "سرعة " + res.V.toFixed(2) + " م/ث أقل من حد الترسيب (0.3)" });
    }
    if (typeof res.Fr === "number" && res.Fr > 0.9 && res.Fr < 1.1) {
      flags.push({ level: "تنبيه", msg: "السريان قرب الحرج (Fr=" + res.Fr.toFixed(2) + ") — النتائج غير مستقرة عددياً" });
    }
    if (typeof res.n === "number" && (res.n < 0.012 || res.n > 0.075)) {
      flags.push({ level: "خطر", msg: "معامل خشونة n=" + res.n.toFixed(3) + " خارج المدى الواقعى (0.012–0.075)" });
    }
    return flags;
  }

  /* جدول معاملات الخشونة المرجعية للترع المصرية */
  var N_TABLE = [
    { key: "مبطنة خرسانة ناعمة", n: 0.014 },
    { key: "مبطنة خرسانة عادية", n: 0.017 },
    { key: "ترابية نظيفة حديثة التطهير", n: 0.022 },
    { key: "ترابية بحشائش خفيفة", n: 0.030 },
    { key: "ترابية بحشائش متوسطة", n: 0.040 },
    { key: "ترابية بحشائش كثيفة", n: 0.060 },
    { key: "مجرى طبيعى غير منتظم", n: 0.035 }
  ];

  var API = {
    G: G,
    trapSection: trapSection,
    irregularSection: irregularSection,
    manningQ: manningQ,
    manningV: manningV,
    manningN: manningN,
    conveyance: conveyance,
    normalDepth: normalDepth,
    criticalDepth: criticalDepth,
    froude: froude,
    specificEnergy: specificEnergy,
    gvfProfile: gvfProfile,
    gvfSlope: gvfSlope,
    backwaterClass: backwaterClass,
    gateFlow: gateFlow,
    gateOpeningFor: gateOpeningFor,
    sharpCrestedWeir: sharpCrestedWeir,
    broadCrestedWeir: broadCrestedWeir,
    vNotchWeir: vNotchWeir,
    hydraulicJump: hydraulicJump,
    fitRatingCurve: fitRatingCurve,
    ratingQ: ratingQ,
    waterBalance: waterBalance,
    muskingum: muskingum,
    sanityCheck: sanityCheck,
    N_TABLE: N_TABLE,
    bisect: bisect,
    version: "1.0"
  };

  root.MWRIHyd = API;
  if (typeof module !== "undefined" && module.exports) { module.exports = API; }
})(typeof window !== "undefined" ? window : this);

</script>

/* ---------- أدوات ---------- */
function $(id){ return document.getElementById(id); }
function nf(v,d){
  if(v===null||v===undefined||isNaN(v)) return "—";
  d=(d===undefined)?0:d;
  return Number(v).toFixed(d).replace(/\B(?=(\d{3})+(?!\d))/g,",");
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function dmy(iso){ if(!iso) return "—"; var p=String(iso).split("-"); return p[2]+"/"+p[1]; }
function todayISO(){ var d=new Date();
  return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function quantile(sorted,p){
  if(!sorted.length) return null;
  var i=(sorted.length-1)*p, lo=Math.floor(i), hi=Math.ceil(i);
  if(lo===hi) return sorted[lo];
  return sorted[lo]+(sorted[hi]-sorted[lo])*(i-lo);
}
function haversine(a1,o1,a2,o2){
  var R=6371, r=Math.PI/180;
  var dA=(a2-a1)*r, dO=(o2-o1)*r;
  var s=Math.sin(dA/2)*Math.sin(dA/2)+Math.cos(a1*r)*Math.cos(a2*r)*Math.sin(dO/2)*Math.sin(dO/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));
}
function stn(id){ var i; for(i=0;i<STATIONS.length;i++) if(STATIONS[i].id===id) return STATIONS[i]; return null; }

/* إزاحة سلسلة زمنياً بعدد أيام (موجب = تأخير) مع استيفاء خطى للكسور */
function shift(a, days){
  var out=[],i,n=a.length;
  var w=Math.floor(days), f=days-w;
  for(i=0;i<n;i++){
    var j1=i-w, j2=i-w-1;
    var v1=(j1>=0&&j1<n)?a[j1]:null, v2=(j2>=0&&j2<n)?a[j2]:null;
    if(v1===null||v1===undefined||isNaN(v1)){ out.push(null); continue; }
    if(f<=0.0001 || v2===null||v2===undefined||isNaN(v2)) out.push(v1);
    else out.push(v1*(1-f)+v2*f);
  }
  return out;
}
function addS(a,b,f){
  var out=[],i; f=(f===undefined)?1:f;
  for(i=0;i<a.length;i++){
    var x=a[i], y=(b&&b[i]!==undefined&&b[i]!==null&&!isNaN(b[i]))?b[i]:0;
    out.push((x===null||x===undefined||isNaN(x))?null:(x+y*f));
  }
  return out;
}
function mulS(a,f){ var o=[],i; for(i=0;i<a.length;i++) o.push((a[i]===null||isNaN(a[i]))?null:a[i]*f); return o; }
function peakOf(v,t){
  var mi=-1,mv=-1e18,i;
  for(i=0;i<v.length;i++) if(v[i]!==null&&!isNaN(v[i])&&v[i]>mv){mv=v[i];mi=i;}
  return {i:mi, v:(mi<0?null:mv), t:(mi<0?null:t[mi])};
}
function volume(v, a, b){ /* مليون م³ */
  var s=0,i;
  for(i=Math.max(0,a);i<=Math.min(v.length-1,b);i++) if(v[i]!==null&&!isNaN(v[i])) s+=v[i]*86400;
  return s/1e6;
}

function netErr(title,e){
  var bar=$("netbar"); if(!bar) return;
  var raw=(e&&e.message)?e.message:String(e), hint="";
  if(/Failed to fetch|NetworkError|Load failed/i.test(raw)) hint=" ← الأرجح CORS أو انقطاع الشبكة";
  else if(/Permission denied/i.test(raw)) hint=" ← قواعد قاعدة البيانات";
  else if(/\b400\b/.test(raw)) hint=" ← صيغة الطلب";
  else if(/\b40[13]\b/.test(raw)) hint=" ← صلاحيات / حصّة";
  else if(/\b429\b/.test(raw)) hint=" ← تجاوز الحد، أعد المحاولة بعد دقائق";
  else if(/\b5\d\d\b/.test(raw)) hint=" ← عطل بالخادم";
  var d=document.createElement("div");
  d.className="netmsg";
  d.innerHTML="<b>"+esc(title)+esc(hint)+"</b>"+esc(raw).slice(0,240);
  bar.appendChild(d); bar.style.display="flex";
  setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d);
    if(!bar.children.length) bar.style.display="none"; },22000);
}
function clearErr(){ var b=$("netbar"); if(b){ b.innerHTML=""; b.style.display="none"; } }

function getJSON(url,label){
  return fetch(url).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status+" "+r.statusText+" @ "+url.split("?")[0]);
    return r.json();
  }).catch(function(e){ netErr(label,e); throw e; });
}

function loadDischarge(){
  var lats=[],lons=[],i;
  for(i=0;i<STATIONS.length;i++){ lats.push(STATIONS[i].lat); lons.push(STATIONS[i].lon); }
  var url=FLOOD_API+"?latitude="+lats.join(",")+"&longitude="+lons.join(",")
    +"&daily=river_discharge,river_discharge_mean,river_discharge_median"
    +",river_discharge_p25,river_discharge_p75,river_discharge_max,river_discharge_min"
    +"&past_days="+PAST+"&forecast_days="+FUT+"&ensemble=true";
  return getJSON(url,"تعذّر جلب تصرفات GloFAS").then(function(arr){
    var out={}, list=(arr&&arr.length!==undefined)?arr:[arr];
    for(i=0;i<STATIONS.length;i++){
      var d=list[i]; if(!d||!d.daily) continue;
      if(MEMBER_STATIONS.indexOf(STATIONS[i].id)>-1){
        var M=[],mj;
        for(mj=1;mj<=NMEM;mj++){
          var mk="river_discharge_member"+("0"+mj).slice(-2);
          if(d.daily[mk]) M.push(d.daily[mk]);
        }
        if(M.length){ ST.mem=ST.mem||{}; ST.mem[STATIONS[i].id]={t:d.daily.time, M:M}; }
      }
      out[STATIONS[i].id]={ t:d.daily.time, q:d.daily.river_discharge,
        mean:d.daily.river_discharge_mean, med:d.daily.river_discharge_median,
        p25:d.daily.river_discharge_p25, p75:d.daily.river_discharge_p75,
        mx:d.daily.river_discharge_max, mn:d.daily.river_discharge_min,
        lat:d.latitude, lon:d.longitude };
    }
    ST.q=out; ST.stamp=new Date();
    return out;
  });
}

function loadClimatology(stationId, silent){
  var s=stn(stationId); if(!s) return Promise.resolve(null);
  var now=new Date(), y1=now.getFullYear()-1;
  var md0=new Date(now.getTime()-PAST*864e5), md1=new Date(now.getTime()+FUT*864e5);
  var years=[],y; for(y=2006;y<=y1;y++) years.push(y);
  ST.climLoading=true;
  ST.clim={station:stationId, years:{}, done:0, total:years.length};
  if(!silent) render();
  function one(yy){
    var a=yy+"-"+("0"+(md0.getMonth()+1)).slice(-2)+"-"+("0"+md0.getDate()).slice(-2);
    var b=yy+"-"+("0"+(md1.getMonth()+1)).slice(-2)+"-"+("0"+md1.getDate()).slice(-2);
    var url=FLOOD_API+"?latitude="+s.lat+"&longitude="+s.lon
      +"&daily=river_discharge&start_date="+a+"&end_date="+b;
    return getJSON(url,"تعذّر جلب أرشيف "+yy).then(function(d){
      if(d&&d.daily) ST.clim.years[yy]=d.daily.river_discharge;
      ST.clim.done++;
      if(!silent && ST.sec==="clim") render();
    }).catch(function(){ ST.clim.done++; });
  }
  /* دفعات متوازية من ٤ لتقصير الزمن دون إغراق الخادم */
  var chain=Promise.resolve(), i;
  for(i=0;i<years.length;i+=4){
    (function(batch){
      chain=chain.then(function(){ return Promise.all(batch.map(one)); });
    })(years.slice(i,i+4));
  }
  return chain.then(function(){
    ST.climLoading=false;
    if(stationId==="halfa") applyClimThresholds();
    render();
    return ST.clim;
  });
}

/* العتبات من الأرشيف: توزيع نفس اليوم التقويمى ±3 أيام عبر كل السنوات */
function applyClimThresholds(){
  if(!ST.clim || ST.clim.station!=="halfa" || !ST.q) return;
  var k=nowIdx(), pool=[], ys=Object.keys(ST.clim.years).sort(), y,i;
  if(ST.thrBasis==="recent") ys=ys.slice(-5);
  for(y=0;y<ys.length;y++){
    var a=ST.clim.years[ys[y]]; if(!a) continue;
    for(i=Math.max(0,k-3);i<=Math.min(a.length-1,k+3);i++)
      if(a[i]!==null&&a[i]!==undefined&&!isNaN(a[i])) pool.push(a[i]);
  }
  if(pool.length<20) return;
  pool.sort(function(p,q){return p-q;});
  var t={ a:Math.round(quantile(pool,0.75)/100)*100,
          b:Math.round(quantile(pool,0.90)/100)*100,
          c:Math.round(quantile(pool,0.97)/100)*100, n:pool.length, ny:ys.length,
          basis:(ST.thrBasis==="recent"?"آخر ٥ سنوات":"الأرشيف كاملاً"),
          from:ys[0], to:ys[ys.length-1] };
  if(!ST.thrManual){ ST.thr=t; ST.thrSrc="تاريخية"; }
  ST.thrClim=t;
}

function nowIdx(){
  var d=ST.q&&ST.q.eldiem; if(!d) return 0;
  var t=todayISO(),i;
  for(i=0;i<d.t.length;i++) if(d.t[i]===t) return i;
  return Math.min(PAST,d.t.length-1);
}
function cur(id){
  var d=ST.q&&ST.q[id]; if(!d) return null;
  var v=d.q[nowIdx()];
  return (v===null||isNaN(v))?null:v;
}
function scenF(){ var i; for(i=0;i<SCENARIOS.length;i++) if(SCENARIOS[i].id===ST.scen) return SCENARIOS[i].f; return 1; }
function scenObj(){ var i; for(i=0;i<SCENARIOS.length;i++) if(SCENARIOS[i].id===ST.scen) return SCENARIOS[i]; return SCENARIOS[2]; }

function fallbackThresholds(){
  var d=ST.q&&ST.q.halfa;
  if(!d) return {a:8000,b:10000,c:12000};
  var v=[],i;
  for(i=0;i<=nowIdx();i++) if(d.q[i]!==null&&!isNaN(d.q[i])) v.push(d.q[i]);
  v.sort(function(p,q){return p-q;});
  return { a:Math.round(quantile(v,0.60)/100)*100,
           b:Math.round(quantile(v,0.85)/100)*100,
           c:Math.round(quantile(v,0.97)/100)*100 };
}
function alertLevel(v){
  var T=ST.thr; if(!T||v===null) return {k:0,nm:"غير محدد",cls:"info"};
  if(v>=T.c) return {k:3,nm:"إنذار أحمر",cls:"danger"};
  if(v>=T.b) return {k:2,nm:"تأهّب",cls:"warn"};
  if(v>=T.a) return {k:1,nm:"متابعة لصيقة",cls:"warn"};
  return {k:0,nm:"طبيعى",cls:"ok"};
}

/* =====================================================================
   MwriDb — طبقة الوصول لقاعدة م. محسن (Firebase RTDB عبر REST)
   مشروع ismailia-64500 · جذر /mwri · صفر backticks · بلا SDK
   ===================================================================== */
var MwriDb = (function(){
  var BASE = "https://ismailia-64500-default-rtdb.europe-west1.firebasedatabase.app";
  var cfg = { app:"app", name:"", type:"kpi", version:"1.0" };
  var statusCb = null, state = "init", detail = "", QKEY = "mwri_queue_";
  var hbTimer = null;

  function setStatus(s, d){
    state = s; detail = d || "";
    if(statusCb) statusCb(state, detail, queue().length);
  }
  function queue(){
    try { return JSON.parse(localStorage.getItem(QKEY+cfg.app) || "[]"); }
    catch(e){ return []; }
  }
  function setQueue(q){
    try { localStorage.setItem(QKEY+cfg.app, JSON.stringify(q.slice(-200))); } catch(e){}
  }
  function enqueue(item){ var q=queue(); q.push(item); setQueue(q); setStatus("queued","تعديلات مؤجلة"); }

  function url(path){
    var p = String(path).replace(/^\/+/,"");
    return BASE + "/mwri/" + p + ".json";
  }
  function stamp(obj){
    var o = {}, k;
    for(k in obj) if(Object.prototype.hasOwnProperty.call(obj,k)) o[k]=obj[k];
    o.updatedAt = Date.now();
    o.src = cfg.app;
    return o;
  }
  function send(method, path, body){
    return fetch(url(path), {
      method: method,
      headers: { "Content-Type":"application/json" },
      body: JSON.stringify(body)
    }).then(function(r){
      return r.text().then(function(txt){
        if(!r.ok) throw new Error("RTDB HTTP " + r.status + " " + (txt||r.statusText).slice(0,160));
        setStatus("ok","");
        return txt ? JSON.parse(txt) : null;
      });
    });
  }

  function patch(path, obj){
    var body = stamp(obj);
    return send("PATCH", path, body).catch(function(e){
      enqueue({ m:"PATCH", p:path, b:body, at:Date.now() });
      setStatus("error", e.message);
      throw e;
    });
  }
  function put(path, obj){
    var body = (obj && typeof obj === "object" && !(obj instanceof Array)) ? stamp(obj) : obj;
    return send("PUT", path, body).catch(function(e){
      enqueue({ m:"PUT", p:path, b:body, at:Date.now() });
      setStatus("error", e.message);
      throw e;
    });
  }
  function remove(path){
    return fetch(url(path), { method:"DELETE" }).then(function(r){
      if(!r.ok) throw new Error("RTDB HTTP " + r.status + " " + r.statusText);
      setStatus("ok",""); return true;
    }).catch(function(e){ setStatus("error", e.message); throw e; });
  }
  function get(path){
    return fetch(url(path)).then(function(r){
      if(!r.ok) throw new Error("RTDB HTTP " + r.status + " " + r.statusText);
      return r.json();
    }).then(function(j){ setStatus("ok",""); return j; })
      .catch(function(e){ setStatus("error", e.message); throw e; });
  }

  function flush(){
    var q = queue();
    if(!q.length) return Promise.resolve(0);
    var pending = q.slice(), done = 0;
    setQueue([]);
    var chain = Promise.resolve();
    pending.forEach(function(it){
      chain = chain.then(function(){
        return send(it.m, it.p, it.b).then(function(){ done++; })
          .catch(function(){ enqueue(it); });
      });
    });
    return chain.then(function(){ return done; });
  }

  function heartbeat(){
    patch("apps/" + cfg.app + "/meta", {
      name:cfg.name, type:cfg.type, version:cfg.version, online:true, lastSeen:Date.now()
    }).catch(function(){});
    patch("registry/" + cfg.app, {
      app:cfg.app, name:cfg.name, type:cfg.type, version:cfg.version, lastSeen:Date.now()
    }).catch(function(){});
  }

  function init(o){
    var k; for(k in (o||{})) cfg[k]=o[k];
    setStatus("connecting","");
    heartbeat();
    if(hbTimer) clearInterval(hbTimer);
    hbTimer = setInterval(heartbeat, 300000);
    flush();
    return cfg;
  }

  function publishSummary(obj){
    return patch("apps/" + cfg.app + "/summary", obj);
  }
  function onStatus(cb){ statusCb = cb; cb(state, detail, queue().length); }

  return {
    init:init, get:get, patch:patch, put:put, remove:remove,
    publishSummary:publishSummary, onStatus:onStatus, flush:flush,
    queued:function(){ return queue().length; },
    base:BASE, version:"1.0"
  };
})();

    target:"jaulia", tc:45.0, note:"مُخمَّد بشدة عبر منطقة السدّ — لا يصلح للإنذار",
    poly:[[7.6,29.6],[5.0,29.8],[3.0,30.5],[0.2,31.4],[-0.9,33.4],[0.6,34.6],[3.0,33.6],[6.0,32.0],[8.0,31.0]] }
];
var RAIN_PAST = 21, RAIN_FUT = 14;
var API_DECAY = 0.90;   /* معامل نضوب المطر المتراكم السابق */

function pointInPoly(la, lo, poly){
  var ins=false, n=poly.length, i, j=n-1;
  for(i=0;i<n;i++){
    var yi=poly[i][1], xi=poly[i][0], yj=poly[j][1], xj=poly[j][0];
    if(((yi>lo)!==(yj>lo)) && (la < (xj-xi)*(lo-yi)/(yj-yi)+xi)) ins=!ins;
    j=i;
  }
  return ins;
}

var RAIN_CELLS = (function(){
  var out=[], bi, la, lo;
  for(bi=0;bi<BASINS.length;bi++){
    var B=BASINS[bi], st=B.step, i;
    var laMin=1e9,laMax=-1e9,loMin=1e9,loMax=-1e9;
    for(i=0;i<B.poly.length;i++){
      if(B.poly[i][0]<laMin) laMin=B.poly[i][0];
      if(B.poly[i][0]>laMax) laMax=B.poly[i][0];
      if(B.poly[i][1]<loMin) loMin=B.poly[i][1];
      if(B.poly[i][1]>loMax) loMax=B.poly[i][1];
    }
    for(la=Math.floor(laMin/st)*st; la<=laMax+1e-9; la+=st){
      for(lo=Math.floor(loMin/st)*st; lo<=loMax+1e-9; lo+=st){
        var LA=Math.round(la*1000)/1000, LO=Math.round(lo*1000)/1000;
        if(pointInPoly(LA,LO,B.poly))
          out.push({ b:B.id, lat:LA, lon:LO, w:Math.cos(LA*Math.PI/180) });
      }
    }
  }
  return out;
})();

function basinCells(id){
  var o=[],i;
  for(i=0;i<RAIN_CELLS.length;i++) if(RAIN_CELLS[i].b===id) o.push(RAIN_CELLS[i]);
  return o;
}
function basinOf(id){ var i; for(i=0;i<BASINS.length;i++) if(BASINS[i].id===id) return BASINS[i]; return null; }

function loadRain(){
  var lats=[], lons=[], i;
  for(i=0;i<RAIN_CELLS.length;i++){ lats.push(RAIN_CELLS[i].lat); lons.push(RAIN_CELLS[i].lon); }
  var url = WX_API + "?latitude=" + lats.join(",") + "&longitude=" + lons.join(",")
    + "&daily=precipitation_sum&past_days=" + RAIN_PAST + "&forecast_days=" + RAIN_FUT + "&timezone=UTC";
  return getJSON(url, "تعذّر جلب أمطار الأحواض").then(function(arr){
    var list = (arr && arr.length!==undefined) ? arr : [arr];
    var t = null, P = [];
    for(i=0;i<RAIN_CELLS.length;i++){
      var d = list[i];
      if(!d || !d.daily){ P.push(null); continue; }
      t = d.daily.time;
      P.push(d.daily.precipitation_sum);
    }
    ST.rain = { t:t, P:P, n:RAIN_CELLS.length };
    return ST.rain;
  });
}

function rainNowIdx(){
  if(!ST.rain||!ST.rain.t) return RAIN_PAST;
  var t0=todayISO(), i;
  for(i=0;i<ST.rain.t.length;i++) if(ST.rain.t[i]===t0) return i;
  return Math.min(RAIN_PAST, ST.rain.t.length-1);
}

/* المتوسط المساحى الموزون لحوض بين مؤشرين (شامل الطرفين) */
function arealMean(bid, a, b){
  if(!ST.rain) return null;
  var cells=[], i, j, ws=0, acc=0;
  for(i=0;i<RAIN_CELLS.length;i++){
    if(RAIN_CELLS[i].b!==bid) continue;
    var p=ST.rain.P[i]; if(!p) continue;
    var s=0, any=false;
    for(j=Math.max(0,a); j<=Math.min(p.length-1,b); j++){
      if(p[j]!==null && !isNaN(p[j])){ s+=p[j]; any=true; }
    }
    if(!any) continue;
    acc += s*RAIN_CELLS[i].w; ws += RAIN_CELLS[i].w;
  }
  return ws>0? acc/ws : null;
}

/* نسبة مساحة الحوض التى تجاوز مطرها عتبة خلال نافذة */
function areaOver(bid, mm, a, b){
  if(!ST.rain) return null;
  var i,j, ws=0, over=0;
  for(i=0;i<RAIN_CELLS.length;i++){
    if(RAIN_CELLS[i].b!==bid) continue;
    var p=ST.rain.P[i]; if(!p) continue;
    var s=0;
    for(j=Math.max(0,a); j<=Math.min(p.length-1,b); j++) if(p[j]!==null&&!isNaN(p[j])) s+=p[j];
    ws += RAIN_CELLS[i].w;
    if(s>=mm) over += RAIN_CELLS[i].w;
  }
  return ws>0? over/ws*100 : null;
}

/* المطر المتراكم السابق API — مؤشر تشبّع الحوض */
function apiIndex(bid){
  if(!ST.rain) return null;
  var k=rainNowIdx(), i, j, ws=0, acc=0;
  for(i=0;i<RAIN_CELLS.length;i++){
    if(RAIN_CELLS[i].b!==bid) continue;
    var p=ST.rain.P[i]; if(!p) continue;
    var s=0;
    for(j=0;j<=k;j++){
      if(p[j]===null||isNaN(p[j])) continue;
      s += p[j]*Math.pow(API_DECAY, k-j);
    }
    acc += s*RAIN_CELLS[i].w; ws += RAIN_CELLS[i].w;
  }
  return ws>0? acc/ws : null;
}

/* مركز ثقل المطر واتجاه حركته */
function stormCentroid(bid, a, b){
  if(!ST.rain) return null;
  var i,j, sw=0, sla=0, slo=0, tot=0;
  for(i=0;i<RAIN_CELLS.length;i++){
    if(RAIN_CELLS[i].b!==bid) continue;
    var p=ST.rain.P[i]; if(!p) continue;
    var s=0;
    for(j=Math.max(0,a); j<=Math.min(p.length-1,b); j++) if(p[j]!==null&&!isNaN(p[j])) s+=p[j];
    var w=s*RAIN_CELLS[i].w;
    sla += RAIN_CELLS[i].lat*w; slo += RAIN_CELLS[i].lon*w; sw += w; tot += s;
  }
  if(sw<=0) return null;
  return { lat:sla/sw, lon:slo/sw, total:tot };
}
function stormMove(bid){
  var k=rainNowIdx();
  var now=stormCentroid(bid, k-2, k), prev=stormCentroid(bid, k-5, k-3);
  if(!now||!prev) return null;
  var dLa=now.lat-prev.lat, dLo=now.lon-prev.lon;
  var km=haversine(prev.lat,prev.lon,now.lat,now.lon);
  var dir="";
  if(km<15) dir="شبه ثابت";
  else {
    dir = (Math.abs(dLa)>Math.abs(dLo))? (dLa>0?"شمالاً":"جنوباً") : (dLo>0?"شرقاً":"غرباً");
  }
  return { km:km, dir:dir, lat:now.lat, lon:now.lon, dLa:dLa, dLo:dLo };
}

/* المؤشر الموزون لكل المنظومة (بأوزان مساهمة الأحواض فى الإيراد) */
function rainIndex(){
  if(!ST.rain) return null;
  var k=rainNowIdx(), i, past=0, next=0, ws=0;
  for(i=0;i<BASINS.length;i++){
    var pm=arealMean(BASINS[i].id, k-6, k), nm=arealMean(BASINS[i].id, k+1, k+7);
    if(pm===null||nm===null) continue;
    past += pm*BASINS[i].w; next += nm*BASINS[i].w; ws += BASINS[i].w;
  }
  return ws>0? { past7:past/ws, next7:next/ws } : null;
}

/* زمن وصول أثر مطر اليوم إلى المحطة الهدف ثم إلى وادى حلفا */
function basinLag(B){
  var R=ST.reaches, toHalfa=0;
  if(B.target==="eldiem")      toHalfa = R[0].K+R[1].K+R[2].K+R[3].K;
  else if(B.target==="jaulia") toHalfa = R[1].K+R[2].K+R[3].K;
  else if(B.target==="atbara") toHalfa = R[2].K+R[3].K;
  return { toTarget:B.tc, toHalfa:B.tc+toHalfa, routed:toHalfa };
}

/* =====================================================================
   مرصد الأقمار — Sentinel-1 SAR عبر Copernicus Data Space
   Statistical API: الحساب يتم على الخادم ويعود رقماً — لا تُنزَّل صور
   تحذير مُعايَر: عتبة VV المطلقة تعطى إيجابية كاذبة فوق الرمل الأملس،
   لذلك الرقم الحاكم هو **التغيّر النسبى** لا المساحة المطلقة.
   ===================================================================== */
var SH = {
  AUTH:"https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token",
  STATS:"https://sh.dataspace.copernicus.eu/api/v1/statistics",
  CATALOG:"https://sh.dataspace.copernicus.eu/api/v1/catalog/1.0.0/search",
  /* نفس مفاتيح تطبيق الإسماعيلية — الأصل واحد (github.io) فالاعتماد مشترك */
  LS_ID:"ism_sh_id", LS_SECRET:"ism_sh_secret",
  LS_TOKEN:"ism_sh_token", LS_TOKEN_EXP:"ism_sh_token_exp",
  FB_ID:"sh_config/client_id", FB_SECRET:"sh_config/client_secret"
};

/* نطاقات الرصد: اختيرت حيث إشارة المسطح المائى قوية فعلاً،
   لا على المجرى المحصور حيث العرض لا يتغيّر مع التصرف */
var SAR_AOIS = [
  { id:"nasser",  nm:"بحيرة ناصر — خط الشاطئ", la0:22.00, la1:22.30, lo0:31.20, lo1:31.55,
    orbit:"ASCENDING",  th:-18, ref:"halfa",    regulated:true,
    note:"مياه دائمة — العتبة −18 معايَرة على نسبة مياه معلومة" },
  { id:"shendi",  nm:"السهل الفيضى — شندى",    la0:16.50, la1:16.90, lo0:33.20, lo1:33.60,
    orbit:"DESCENDING", th:-20, ref:"shendi",   note:"سهل فيضى — أقوى إشارة موسمية فى المنظومة" },
  { id:"atbaraC", nm:"ملتقى عطبرة",            la0:17.50, la1:17.90, lo0:33.80, lo1:34.20,
    orbit:"DESCENDING", th:-20, ref:"merowe",   note:"صحراء حول المجرى — عرضة لإيجابية كاذبة عند عتبة −18" },
  { id:"khartoumC", nm:"ملتقى الخرطوم",        la0:15.40, la1:15.80, lo0:32.30, lo1:32.70,
    orbit:"DESCENDING", th:-20, ref:"khartoum", note:"مجرى مزدوج وحضر — الحضر يرفع الارتداد ويقلّل الكشف" }
];
var SAR_TH_ALT = 2;      /* فارق العتبة البديلة بالديسيبل لبناء نطاق عدم اليقين */
var SAR_INTERVAL = "P12D";

function sarAoi(id){ var i; for(i=0;i<SAR_AOIS.length;i++) if(SAR_AOIS[i].id===id) return SAR_AOIS[i]; return null; }
function sarAreaKm2(A){
  return (A.la1-A.la0)*111.32 * (A.lo1-A.lo0)*111.32 * Math.cos((A.la0+A.la1)/2*Math.PI/180);
}
function sarBox(A){
  return { type:"Polygon", coordinates:[[[A.lo0,A.la0],[A.lo1,A.la0],[A.lo1,A.la1],[A.lo0,A.la1],[A.lo0,A.la0]]] };
}
function sarEval(thDb){
  return "//VERSION=3\n"
    + "function setup(){return {input:[{bands:[\u0022VV\u0022,\u0022dataMask\u0022]}],"
    + "output:[{id:\u0022water\u0022,bands:1,sampleType:\u0022FLOAT32\u0022},"
    + "{id:\u0022dataMask\u0022,bands:1,sampleType:\u0022UINT8\u0022}]};}\n"
    + "function evaluatePixel(s){var d=10*Math.log10(Math.max(s.VV,1e-7));"
    + "return {water:[d<" + thDb + "?1.0:0.0], dataMask:[s.dataMask]};}";
}

function b64decode(x){
  try { return decodeURIComponent(escape(atob(x))); } catch(e){ return x; }
}

/* بيانات الاعتماد: التخزين المحلى أولاً ثم القاعدة (نفس ما يستخدمه تطبيق الإسماعيلية) */
function sarCreds(){
  var id=null, sec=null;
  try { id=localStorage.getItem(SH.LS_ID); sec=localStorage.getItem(SH.LS_SECRET); } catch(e){}
  if(id && sec) return Promise.resolve({id:id, secret:sec, src:"الجهاز"});
  /* المسار خارج جذر /mwri فلا يصلح MwriDb.get — قراءة مباشرة من جذر القاعدة */
  function raw(p){
    return fetch(MwriDb.base + "/" + p + ".json").then(function(r){
      if(!r.ok) throw new Error("RTDB HTTP " + r.status + " " + r.statusText);
      return r.json();
    });
  }
  return Promise.all([
    raw(SH.FB_ID).catch(function(){ return null; }),
    raw(SH.FB_SECRET).catch(function(){ return null; })
  ]).then(function(r){
    if(!r[0]||!r[1]) return null;
    var i2=b64decode(String(r[0])), s2=b64decode(String(r[1]));
    try { localStorage.setItem(SH.LS_ID,i2); localStorage.setItem(SH.LS_SECRET,s2); } catch(e){}
    return { id:i2, secret:s2, src:"قاعدة الإدارة" };
  });
}

function sarToken(){
  var cached=null, exp=0;
  try { cached=localStorage.getItem(SH.LS_TOKEN); exp=+(localStorage.getItem(SH.LS_TOKEN_EXP)||0); } catch(e){}
  if(cached && exp > Date.now()+60000) return Promise.resolve(cached);
  return sarCreds().then(function(c){
    if(!c) throw new Error("بيانات اعتماد Copernicus غير متوفرة — أدخلها من لوحة الإعداد");
    var body = "grant_type=client_credentials&client_id=" + encodeURIComponent(c.id)
             + "&client_secret=" + encodeURIComponent(c.secret);
    return fetch(SH.AUTH, { method:"POST",
      headers:{ "Content-Type":"application/x-www-form-urlencoded" }, body:body })
      .then(function(r){
        return r.text().then(function(t){
          if(!r.ok) throw new Error("Copernicus HTTP " + r.status + " " + t.slice(0,180));
          var d=JSON.parse(t);
          try {
            localStorage.setItem(SH.LS_TOKEN, d.access_token);
            localStorage.setItem(SH.LS_TOKEN_EXP, String(Date.now() + (d.expires_in||1800)*1000));
          } catch(e){}
          ST.sar.credSrc = c.src;
          return d.access_token;
        });
      });
  });
}

function sarPost(url, body, label, accept){
  return sarToken().then(function(tok){
    var h = { "Content-Type":"application/json", "Authorization":"Bearer " + tok };
    /* الفهرس يرفض application/json بـHTTP 406 — يقبل geo+json فقط */
    h.Accept = accept || "application/json";
    return fetch(url, { method:"POST", headers:h,
      body: JSON.stringify(body) })
      .then(function(r){
        return r.text().then(function(t){
          if(!r.ok){
            if(r.status===401){ try{ localStorage.removeItem(SH.LS_TOKEN); }catch(e){} }
            throw new Error("SentinelHub HTTP " + r.status + " " + t.slice(0,200));
          }
          return JSON.parse(t);
        });
      });
  }).catch(function(e){ netErr(label, e); throw e; });
}

/* سلسلة نسبة المياه لنطاق عند عتبة محددة */
function sarSeries(A, thDb, fromISO){
  var body = {
    input:{ bounds:{ geometry:sarBox(A),
              properties:{ crs:"http://www.opengis.net/def/crs/EPSG/0/4326" } },
            /* بلا كتلة processing إطلاقاً — orthorectify يسبب أخطاء تنفيذ متكررة */
            data:[{ type:"sentinel-1-grd", dataFilter:{ orbitDirection:A.orbit } }] },
    aggregation:{ timeRange:{ from:fromISO, to:new Date().toISOString() },
      aggregationInterval:{ of:SAR_INTERVAL }, resx:0.0006, resy:0.0006,
      evalscript:sarEval(thDb) },
    calculations:{ water:{ statistics:{ "default":{} } } }
  };
  return sarPost(SH.STATS, body, "تعذّر حساب مساحة المياه — " + A.nm).then(function(r){
    var out=[], i, d=r.data||[];
    for(i=0;i<d.length;i++){
      if(!d[i].outputs || !d[i].outputs.water) continue;
      var st=d[i].outputs.water.bands.B0.stats;
      out.push({ t:String(d[i].interval.from).slice(0,10), f:st.mean, n:st.sampleCount });
    }
    return out;
  });
}

function sarCatalog(A){
  var from=new Date(Date.now()-40*864e5).toISOString();
  var body={ bbox:[A.lo0,A.la0,A.lo1,A.la1], datetime:from + "/" + new Date().toISOString(),
             collections:["sentinel-1-grd"], limit:30 };
  return sarPost(SH.CATALOG, body, "تعذّر جلب فهرس المشاهد — " + A.nm, "application/geo+json").then(function(r){
    var f=r.features||[], out=[], i;
    for(i=0;i<f.length;i++){
      var p=f[i].properties||{};
      out.push({ t:String(p.datetime||"").slice(0,16).replace("T"," "),
                 orbit:p["sat:orbit_state"]||"—", mode:p["sar:instrument_mode"]||"—" });
    }
    out.sort(function(a,b){ return a.t<b.t?1:-1; });
    return out;
  });
}

/* سلسلة التصرف المرجعية على نفس نافذة الرادار — نافذة GloFAS الحية ٤٥ يوماً فقط
   وهى أقصر من أن تعطى ارتباطاً ذا معنى، فتُجلب من الأرشيف لنفس المدة */
function sarRefSeries(A, fromISO){
  var st=stn(A.ref); if(!st) return Promise.resolve(null);
  var a=String(fromISO).slice(0,10), b=todayISO();
  var url=FLOOD_API + "?latitude=" + st.lat + "&longitude=" + st.lon
        + "&daily=river_discharge&start_date=" + a + "&end_date=" + b;
  return getJSON(url, "تعذّر جلب أرشيف التصرف للمقارنة — " + A.nm)
    .then(function(d){ return (d&&d.daily)? {t:d.daily.time, q:d.daily.river_discharge} : null; })
    .catch(function(){ return null; });
}

function sarLoad(aoiId){
  var A=sarAoi(aoiId); if(!A) return Promise.resolve(null);
  var from=new Date(Date.now()-160*864e5).toISOString();
  ST.sar.loading=aoiId; render();
  return Promise.all([
    sarSeries(A, A.th, from),
    sarSeries(A, A.th - SAR_TH_ALT, from),
    sarCatalog(A).catch(function(){ return []; }),
    sarRefSeries(A, from)
  ]).then(function(r){
    ST.sar.data[aoiId] = { main:r[0], alt:r[1], scenes:r[2], ref:r[3], th:A.th,
                           thAlt:A.th-SAR_TH_ALT, area:sarAreaKm2(A), at:Date.now() };
    ST.sar.loading=null; render();
    return ST.sar.data[aoiId];
  }).catch(function(){ ST.sar.loading=null; render(); return null; });
}

/* درجة تأكيد القمر: ارتباط سلسلة المساحة بتصرف المحطة المرجعية */
function sarAgreement(aoiId){
  var A=sarAoi(aoiId), D=ST.sar.data[aoiId];
  if(!A || !D || D.main.length<4) return null;
  var q = D.ref || (ST.q? ST.q[A.ref] : null);
  if(!q) return null;
  var X=[], Y=[], i, j;
  function dayNum(iso){ var p=String(iso).split("-"); return Date.UTC(+p[0],+p[1]-1,+p[2])/864e5; }
  for(i=0;i<D.main.length;i++){
    /* مطابقة بأقرب يوم لا بتطابق حرفى — نافذة GloFAS أقصر من نافذة الرادار */
    var target=dayNum(D.main[i].t), best=-1, bestD=1e9;
    for(j=0;j<q.t.length;j++){
      var dd=Math.abs(dayNum(q.t[j])-target);
      if(dd<bestD && q.q[j]!==null && !isNaN(q.q[j])){ bestD=dd; best=j; }
    }
    if(best<0 || bestD>6) continue;
    X.push(D.main[i].f); Y.push(q.q[best]);
  }
  if(X.length<3) return null;
  var r=FIT.corr(X,Y);
  var lvl;
  if(A.regulated){
    /* المسطح هنا تحكمه قرارات التشغيل لا الوارد اللحظى — الارتباط ليس اختبار صحة */
    lvl = { g:"لا ينطبق — مجرى منظَّم", c:"lake" };
  } else {
    lvl = r>=0.75? {g:"مرتفع",c:"green"} : (r>=0.45? {g:"متوسط",c:"sand"} : {g:"ضعيف",c:"danger"});
    if(X.length<5) lvl = { g:lvl.g + " (نقاط قليلة)", c:"sand" };
  }
  return { r:r, n:X.length, level:lvl, ref:A.ref, weak:(X.length<5), regulated:!!A.regulated };
}

/* التغيّر النسبى مقابل أقدم فترة متاحة — الرقم الحاكم */
function sarChange(aoiId){
  var D=ST.sar.data[aoiId];
  if(!D || D.main.length<2) return null;
  function chg(arr){
    var a=arr[0].f, b=arr[arr.length-1].f;
    return (a>0)? (b-a)/a*100 : null;
  }
  var m=chg(D.main), a=chg(D.alt);
  var conflict = (m!==null && a!==null && ((m>0&&a<0)||(m<0&&a>0)));
  return { main:m, alt:a, conflict:conflict,
           from:D.main[0].t, to:D.main[D.main.length-1].t,
           kmNow:D.main[D.main.length-1].f*D.area, kmNowAlt:D.alt[D.alt.length-1].f*D.area,
           kmFirst:D.main[0].f*D.area };
}

/* =====================================================================
   تشخيص التثبيت (PWA) — يفحص كل شرط داخل الجهاز نفسه ويعرض النتيجة
   الغرض: لقطة شاشة واحدة تكفى لمعرفة السبب دون console
   ===================================================================== */
function pwaMode(){
  try {
    if(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return "مثبَّت (standalone)";
    if(window.navigator && window.navigator.standalone) return "مثبَّت (iOS)";
  } catch(e){}
  return "فى المتصفح";
}
function isIOS(){
  try { return /iPad|iPhone|iPod/.test(window.navigator.userAgent||""); } catch(e){ return false; }
}

function pwaDiag(){
  ST.pwa.running = true;
  var out = { at:Date.now(), items:[] };
  function add(k, ok, v, hint){ out.items.push({ k:k, ok:ok, v:String(v), hint:hint||"" }); }

  var loc = window.location || { protocol:"—", origin:"—", pathname:"—", hostname:"" };
  add("البروتوكول", loc.protocol === "https:", loc.protocol, "التثبيت يتطلب HTTPS");
  add("المصدر والمسار", true, (loc.origin||"—") + (loc.pathname||""));
  add("وضع التشغيل", true, pwaMode());
  add("حدث التثبيت beforeinstallprompt", ST.pwa.evtFired,
      ST.pwa.evtFired ? "أُطلق — الجهاز يعتبر التطبيق قابلاً للتثبيت" : "لم يُطلق",
      ST.pwa.evtFired ? "" : (isIOS() ? "سفارى لا يُطلقه أصلاً — استخدم مشاركة ← إضافة للشاشة الرئيسية"
        : "معناه أن أحد الشروط أدناه ساقط، أو أن التطبيق مثبَّت بالفعل"));

  function step(){
    /* ١) عامل الخدمة */
    var swP;
    if(!("serviceWorker" in window.navigator)){
      add("عامل الخدمة", false, "غير مدعوم فى هذا المتصفح");
      swP = Promise.resolve();
    } else {
      swP = window.navigator.serviceWorker.getRegistrations().then(function(regs){
        if(!regs || !regs.length){ add("تسجيل عامل الخدمة", false, "لا تسجيل", "sw.js لم يُرفع أو مساره خاطئ"); return; }
        var r = regs[0];
        var state = r.active ? "نشط" : (r.installing ? "قيد التثبيت" : (r.waiting ? "منتظر" : "غير معروف"));
        add("تسجيل عامل الخدمة", !!r.active, state + " · النطاق " + r.scope);
        add("يتحكم فى الصفحة", !!window.navigator.serviceWorker.controller,
            window.navigator.serviceWorker.controller ? "نعم" : "لا",
            window.navigator.serviceWorker.controller ? "" : "أعد تحميل الصفحة مرة واحدة");
      }).catch(function(e){ add("تسجيل عامل الخدمة", false, e.message); });
    }

    /* ٢) ملف البيان والأيقونات */
    return swP.then(function(){
      return fetch("manifest.json", { cache:"no-store" }).then(function(r){
        add("ملف manifest.json", r.ok, "HTTP " + r.status,
            r.ok ? "" : "الملف غير مرفوع أو فى مجلد فرعى");
        if(!r.ok) return null;
        return r.json();
      }).catch(function(e){ add("ملف manifest.json", false, e.message); return null; });
    }).then(function(mf){
      if(!mf) return null;
      add("اسم التطبيق", !!(mf.name && mf.short_name), (mf.short_name||"—"));
      add("نمط العرض", mf.display==="standalone"||mf.display==="fullscreen", mf.display||"—",
          "يجب أن يكون standalone");
      add("رابط البدء", !!mf.start_url, mf.start_url||"—");
      var ic = mf.icons || [];
      var has192 = false, has512 = false, i;
      for(i=0;i<ic.length;i++){
        if(String(ic[i].type)!=="image/png") continue;
        if(String(ic[i].sizes).indexOf("192")>-1) has192=true;
        if(String(ic[i].sizes).indexOf("512")>-1) has512=true;
      }
      add("أيقونة PNG ١٩٢", has192, has192?"معلنة":"غير معلنة");
      add("أيقونة PNG ٥١٢", has512, has512?"معلنة":"غير معلنة", "شرط إلزامى للتثبيت");
      /* تحقق فعلى من وصول كل ملف أيقونة */
      var chain = Promise.resolve();
      ic.forEach(function(icon){
        chain = chain.then(function(){
          return fetch(icon.src, { cache:"no-store" }).then(function(r){
            var ct = r.headers && r.headers.get ? (r.headers.get("content-type")||"") : "";
            var okType = ct.indexOf("image/png")>-1;
            add("ملف " + icon.src, r.ok && okType,
                "HTTP " + r.status + (ct? (" · " + ct) : ""),
                r.ok ? (okType?"":"نوع المحتوى ليس image/png") : "الملف غير مرفوع");
          }).catch(function(e){ add("ملف " + icon.src, false, e.message, "الملف غير مرفوع"); });
        });
      });
      return chain;
    }).then(function(){
      ST.pwa.diag = out;
      ST.pwa.running = false;
      render();
    }).catch(function(e){
      add("تعذّر إكمال الفحص", false, e.message);
      ST.pwa.diag = out; ST.pwa.running = false; render();
    });
  }
  render();
  return step();
}

/* إعادة ضبط كاملة: إلغاء عامل الخدمة ومسح الكاش — يحلّ النسخة القديمة العالقة */
function pwaHardReset(){
  var jobs = [];
  try {
    if("serviceWorker" in window.navigator){
      jobs.push(window.navigator.serviceWorker.getRegistrations().then(function(regs){
        return Promise.all((regs||[]).map(function(r){ return r.unregister(); }));
      }));
    }
  } catch(e){}
  try {
    if(window.caches && window.caches.keys){
      jobs.push(window.caches.keys().then(function(ks){
        return Promise.all(ks.map(function(k){ return window.caches.delete(k); }));
      }));
    }
  } catch(e){}
  return Promise.all(jobs).then(function(){ window.location.reload(); })
    .catch(function(e){ netErr("تعذّرت إعادة الضبط", e); });
}

function pwaInstall(){
  var p = ST.pwa.prompt;
  if(!p){
    netErr("التثبيت غير متاح الآن", new Error(
      isIOS() ? "على iOS: زر المشاركة ثم «إضافة إلى الشاشة الرئيسية»"
              : "المتصفح لم يُطلق حدث التثبيت — شغّل الفحص أدناه لمعرفة الشرط الساقط"));
    return;
  }
  p.prompt();
  p.userChoice.then(function(c){
    if(c && c.outcome === "accepted"){ ST.pwa.installed = true; }
    ST.pwa.prompt = null;
    render();
  }).catch(function(){});
}

/* ---------------------------------------------------------------
   6) محرّك الرسوم — SVG خالص بلا مكتبات
   --------------------------------------------------------------- */
function niceTicks(lo, hi, n){
  n = n||5;
  if(hi<=lo) hi = lo+1;
  var span = hi-lo, step = Math.pow(10, Math.floor(Math.log(span/n)/Math.LN10));
  var err = (span/n)/step;
  if(err>=7.5) step*=10; else if(err>=3.5) step*=5; else if(err>=1.5) step*=2;
  var s = Math.ceil(lo/step)*step, out=[], v=s, guard=0;
  while(v<=hi+step*0.001 && guard<40){ out.push(v); v+=step; guard++; }
  return out;
}

function plot(o){
  var w=o.w||780, h=o.h||300;
  var ml=(o.ml===undefined?56:o.ml), mr=(o.mr===undefined?12:o.mr),
      mt=(o.mt===undefined?12:o.mt), mb=(o.mb===undefined?38:o.mb);
  var iw=w-ml-mr, ih=h-mt-mb;
  var T=o.t||[], N=T.length, i, j;

  var lo=Infinity, hi=-Infinity;
  function scan(a){ if(!a) return; for(j=0;j<a.length;j++){ var v=a[j];
    if(v!==null&&v!==undefined&&!isNaN(v)){ if(v<lo)lo=v; if(v>hi)hi=v; } } }
  (o.series||[]).forEach(function(s){ scan(s.v); });
  (o.bands||[]).forEach(function(b){ scan(b.lo); scan(b.hi); });
  (o.hlines||[]).forEach(function(l){ if(l.v<lo)lo=l.v; if(l.v>hi)hi=l.v; });
  if(!isFinite(lo)||!isFinite(hi)){ lo=0; hi=1; }
  if(o.zero) lo=Math.min(lo,0);
  var pad=(hi-lo)*0.10 || 1; hi+=pad; lo=Math.max(0,lo-pad*0.5);

  function X(k){ return ml + (N<2?iw/2:(k/(N-1))*iw); }
  function Y(v){ return mt + ih - ((v-lo)/(hi-lo))*ih; }

  var s = '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet" role="img">';
  s += '<rect x="'+ml+'" y="'+mt+'" width="'+iw+'" height="'+ih+'" fill="#fdfcf8" stroke="#e8e2d4"/>';

  var yt = niceTicks(lo,hi,5);
  for(i=0;i<yt.length;i++){
    var yy=Y(yt[i]); if(yy<mt-1||yy>mt+ih+1) continue;
    s += '<line x1="'+ml+'" y1="'+yy.toFixed(1)+'" x2="'+(ml+iw)+'" y2="'+yy.toFixed(1)+'" stroke="#ece6d8" stroke-width="1"/>';
    s += '<text class="axis-lbl" x="'+(ml-7)+'" y="'+(yy+3).toFixed(1)+'" text-anchor="end">'+nf(yt[i],0)+'</text>';
  }
  var stepX = Math.max(1, Math.round(N/8));
  for(i=0;i<N;i+=stepX){
    var xx=X(i);
    s += '<line x1="'+xx.toFixed(1)+'" y1="'+mt+'" x2="'+xx.toFixed(1)+'" y2="'+(mt+ih)+'" stroke="#f2ece0" stroke-width="1"/>';
    s += '<text class="axis-lbl" x="'+xx.toFixed(1)+'" y="'+(mt+ih+14)+'" text-anchor="middle">'+dmy(T[i])+'</text>';
  }

  /* أشرطة الأعضاء (المروحة) */
  (o.bands||[]).forEach(function(b){
    var up="", dn="", started=false;
    for(i=0;i<N;i++){
      var a=b.hi[i], c=b.lo[i];
      if(a===null||c===null||isNaN(a)||isNaN(c)) continue;
      up += (started?" L":"M") + X(i).toFixed(1) + " " + Y(a).toFixed(1);
      started=true;
    }
    for(i=N-1;i>=0;i--){
      var c2=b.lo[i]; if(c2===null||isNaN(c2)) continue;
      dn += " L" + X(i).toFixed(1) + " " + Y(c2).toFixed(1);
    }
    if(started) s += '<path d="'+up+dn+' Z" fill="'+b.color+'" opacity="'+(b.op||0.28)+'"/>';
  });

  /* خطوط أفقية (عتبات) */
  (o.hlines||[]).forEach(function(l){
    var yy=Y(l.v);
    if(yy<mt||yy>mt+ih) return;
    s += '<line x1="'+ml+'" y1="'+yy.toFixed(1)+'" x2="'+(ml+iw)+'" y2="'+yy.toFixed(1)+'" stroke="'+l.color+'" stroke-width="1.4" stroke-dasharray="6 4" opacity=".85"/>';
    s += '<text class="axis-lbl" x="'+(ml+iw-4)+'" y="'+(yy-4).toFixed(1)+'" text-anchor="end" fill="'+l.color+'" style="font-weight:600">'+esc(l.nm)+'</text>';
  });

  /* خط "اليوم" */
  if(o.nowIdx!==undefined && o.nowIdx>=0 && o.nowIdx<N){
    var nx=X(o.nowIdx);
    s += '<line x1="'+nx.toFixed(1)+'" y1="'+mt+'" x2="'+nx.toFixed(1)+'" y2="'+(mt+ih)+'" stroke="#b46f4b" stroke-width="1.6" stroke-dasharray="3 3"/>';
    s += '<text class="axis-lbl" x="'+(nx+4).toFixed(1)+'" y="'+(mt+11)+'" fill="#b46f4b" style="font-weight:700">اليوم</text>';
  }

  /* السلاسل */
  (o.series||[]).forEach(function(sr){
    var d="", on=false;
    for(i=0;i<N;i++){
      var v=sr.v[i];
      if(v===null||v===undefined||isNaN(v)){ on=false; continue; }
      d += (on?" L":" M") + X(i).toFixed(1) + " " + Y(v).toFixed(1);
      on=true;
    }
    if(d) s += '<path d="'+d+'" fill="none" stroke="'+sr.color+'" stroke-width="'+(sr.wd||2)+'"'
             + (sr.dash?' stroke-dasharray="'+sr.dash+'"':'')
             + ' stroke-linejoin="round" stroke-linecap="round" opacity="'+(sr.op||1)+'"/>';
    if(sr.mark!==undefined && sr.mark>=0 && sr.v[sr.mark]!==null){
      s += '<circle cx="'+X(sr.mark).toFixed(1)+'" cy="'+Y(sr.v[sr.mark]).toFixed(1)+'" r="4" fill="'+sr.color+'" stroke="#fff" stroke-width="1.6"/>';
    }
  });

  if(o.yTitle){
    s += '<text class="axis-ttl" transform="translate(13,'+(mt+ih/2)+') rotate(-90)" text-anchor="middle">'+esc(o.yTitle)+'</text>';
  }
  s += '</svg>';
  return s;
}

function barPlot(o){

  var iw=w-ml-mr, ih=h-mt-mb, L=o.labels||[], V=o.values||[], i;

  }
  if(o.yTitle) s += '<text class="axis-ttl" transform="translate(12,'+(mt+ih/2)+') rotate(-90)" text-anchor="middle">'+esc(o.yTitle)+'</text>';
  s += '</svg>';
  return s;

};
var LINKS = [

];

function qAtIdx(id,k){
  var d=ST.q&&ST.q[id]; if(!d||k<0||k>=d.q.length) return null;
  var v=d.q[k]; return (v===null||isNaN(v))?null:v;
}
function netIdx(){ var d=ST.q&&ST.q.eldiem; if(!d) return 0;
  return (ST.net.day===null)? nowIdx() : Math.max(0, Math.min(d.t.length-1, ST.net.day)); }
function netUpstream(id){
  /* سلسلة الروافد المغذية للمحطة المختارة — BFS عكسى على LINKS */
  var set={}; set[id]=true; var grew=true, i;
  while(grew){ grew=false;
    for(i=0;i<LINKS.length;i++){ if(set[LINKS[i][1]] && !set[LINKS[i][0]]){ set[LINKS[i][0]]=true; grew=true; } }
  }
  return set;
}
function netSpark(id,k){
  var d=ST.q&&ST.q[id]; if(!d) return "";
  var a=Math.max(0,k-14), b=Math.min(d.q.length-1,k+14), n0=nowIdx();
  var vals=[], i; for(i=a;i<=b;i++) vals.push(d.q[i]);
  var lo=1e18, hi=-1e18; for(i=0;i<vals.length;i++){ if(vals[i]!==null&&!isNaN(vals[i])){ if(vals[i]<lo)lo=vals[i]; if(vals[i]>hi)hi=vals[i]; } }
  if(hi<=lo){ hi=lo+1; }
  var W=252,H=58,P=5;
  function X(i){ return P+(i-a)/(b-a||1)*(W-2*P); }
  function Y(v){ return H-P-(v-lo)/(hi-lo)*(H-2*P); }
  var past="", fut="";
  for(i=a;i<=b;i++){ var v=d.q[i]; if(v===null||isNaN(v)) continue;
    var pt=X(i).toFixed(1)+" "+Y(v).toFixed(1);
    if(i<=n0){ past+=(past?" L ":"M ")+pt; if(i===n0) fut="M "+pt; }
    else fut+=(fut?" L ":"M ")+pt;
  }
  var kx=X(k).toFixed(1), kv=d.q[k];
  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:280px;height:58px">'
   +'<path d="'+past+'" fill="none" stroke="#155b75" stroke-width="2"/>'
   +(fut?'<path class="spark-fut" d="'+fut+'" fill="none" stroke="#b46f4b" stroke-width="2"/>':"")
   +((kv!==null&&!isNaN(kv))?'<circle cx="'+kx+'" cy="'+Y(kv).toFixed(1)+'" r="4" fill="#c9a84c" stroke="#7a5f1d"/>':"")
   +'</svg>';
  return svg;
}

function netApply(){

    lab.className="net-day"+(k>n0?" fut":""); }

function netVB(){ return ST.net.vb || [0,0,680,540]; }
function netSetVB(vb){
  vb[2]=Math.max(170, Math.min(1360, vb[2])); vb[3]=vb[2]*540/680;
  vb[0]=Math.max(-340, Math.min(680, vb[0])); vb[1]=Math.max(-270, Math.min(540, vb[1]));
  ST.net.vb=vb; var e=$("net-svg");
  if(e) e.setAttribute("viewBox", vb[0].toFixed(1)+" "+vb[1].toFixed(1)+" "+vb[2].toFixed(1)+" "+vb[3].toFixed(1));
}
function netBind(){
  var wrap=$("net-wrap"); if(!wrap) return;
  var ptrs={}, panStart=null, pinch0=null;
  function pt(ev){ var r=wrap.getBoundingClientRect(), vb=netVB();
    return { x:vb[0]+(ev.clientX-r.left)/r.width*vb[2], y:vb[1]+(ev.clientY-r.top)/r.height*vb[3] }; }
  wrap.onpointerdown=function(ev){ ptrs[ev.pointerId]=ev; wrap.setPointerCapture(ev.pointerId);
    var ks=Object.keys(ptrs);
    if(ks.length===1){ panStart={cx:ev.clientX, cy:ev.clientY, vb:netVB().slice(),
                                 t:Date.now(), moved:false}; }
    else if(ks.length===2){ panStart=null;
      var a=ptrs[ks[0]], b=ptrs[ks[1]];
      pinch0={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY), vb:netVB().slice(),
              mx:(a.clientX+b.clientX)/2, my:(a.clientY+b.clientY)/2}; }
  };
  wrap.onpointermove=function(ev){ if(!ptrs[ev.pointerId]) return; ptrs[ev.pointerId]=ev;
    var ks=Object.keys(ptrs), r=wrap.getBoundingClientRect();
    if(ks.length===1 && panStart){ var vb=panStart.vb.slice();
      if(Math.abs(ev.clientX-panStart.cx)>6 || Math.abs(ev.clientY-panStart.cy)>6) panStart.moved=true;
      vb[0]-= (ev.clientX-panStart.cx)/r.width*vb[2];
      vb[1]-= (ev.clientY-panStart.cy)/r.height*vb[3];
      netSetVB(vb);
    } else if(ks.length===2 && pinch0){ var a=ptrs[ks[0]], b=ptrs[ks[1]];
      var d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
      if(d>10){ var f=pinch0.d/d, vb=pinch0.vb.slice();
        var fx=(pinch0.mx-r.left)/r.width, fy=(pinch0.my-r.top)/r.height;
        vb[0]+=fx*vb[2]*(1-f); vb[1]+=fy*vb[3]*(1-f); vb[2]*=f;
        netSetVB(vb); } }
  };
  /* النقرة على العقدة: التقاط المؤشر (اللازم للسحب) يحوّل حدث click إلى الحاوية
     فلا يصل إلى مجموعة المحطة إطلاقاً — وهو سبب عدم فتح البطاقة بالماوس.
     الحل: نميّز النقرة بأنفسنا (إزاحة < ٦ بكسل وزمن < ٦٠٠ م.ث) ثم نستدلّ على
     العنصر بموضعه بعد تحرير الالتقاط. */
  wrap.onpointerup=function(ev){
    var wasTap = panStart && !panStart.moved && (Date.now()-panStart.t)<600
                 && Object.keys(ptrs).length===1;
    delete ptrs[ev.pointerId];
    if(Object.keys(ptrs).length===0){ panStart=null; pinch0=null; }
    if(!wasTap) return;
    try{ wrap.releasePointerCapture(ev.pointerId); }catch(e){}
    var el=null, g=null;
    try{ el=document.elementFromPoint(ev.clientX, ev.clientY); }catch(e2){}
    if(el && el.closest) g=el.closest(".net-node");
    if(!g) return;
    var id=g.getAttribute("data-node");
    if(!id) return;
    ST.net.sel=(ST.net.sel===id)?null:id;
    render();
  };
  wrap.onpointercancel=function(ev){ delete ptrs[ev.pointerId];
    if(Object.keys(ptrs).length===0){ panStart=null; pinch0=null; } };
  wrap.ondblclick=function(){ netSetVB([0,0,680,540]); };
  wrap.onwheel=function(ev){ ev.preventDefault(); var vb=netVB().slice(), r=wrap.getBoundingClientRect();
    var f=(ev.deltaY>0)?1.18:0.85, fx=(ev.clientX-r.left)/r.width, fy=(ev.clientY-r.top)/r.height;
    vb[0]+=fx*vb[2]*(1-f); vb[1]+=fy*vb[3]*(1-f); vb[2]*=f; netSetVB(vb); };
}
