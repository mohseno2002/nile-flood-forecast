/* =====================================================================
   بصمة الفيضان الحية — مخطط مكانى/زمنى (Hovmöller)
   المحور الأفقى: المحطات على المحور من المنبع لوادى حلفا
   المحور الرأسى: الزمن (أعلى = الماضى، أسفل = التنبؤ)
   اللون: موقع التصرف من مدى المحطة نفسها (تطبيع ذاتى لكل محطة)
   ===================================================================== */
var AXIS_STATIONS = ["eldiem","roseires","sennar","bnkhart","khartoum","shendi","merowe","halfa"];

function sevColor(f){
  /* f من 0 إلى 1 — تدرّج من الأخضر الهادئ للطينى للأحمر */
  if(f===null||isNaN(f)) return "#eceadf";
  if(f<0.25){ return "#dce8d7"; }
  if(f<0.50){ return "#bcd6c4"; }
  if(f<0.70){ return "#e9dfc8"; }
  if(f<0.85){ return "#e0c08e"; }
  if(f<0.95){ return "#cf9a63"; }
  return "#b8503f";
}

function fingerprintSVG(){
  if(!ST.q) return "";
  var cols=AXIS_STATIONS.length, t=ST.q.eldiem.t, rows=t.length;
  var w=700, left=96, right=16, top=52, bottom=16;
  var cw=(w-left-right)/cols;
  var ch=Math.max(4.2, Math.min(8, 420/rows));
  var h=top+rows*ch+bottom;
  var k=nowIdx(), i, j;

  /* نطاق التطبيع لكل محطة على حدة */
  var rng={};
  AXIS_STATIONS.forEach(function(id){
    var d=ST.q[id], v=[], m;
    if(!d) return;
    for(m=0;m<d.q.length;m++) if(d.q[m]!==null&&!isNaN(d.q[m])) v.push(d.q[m]);
    v.sort(function(a,b){return a-b;});
    rng[id]={lo:quantile(v,0.02), hi:quantile(v,0.98)};
  });

  var s='<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet" role="img">';
  s+='<rect width="'+w+'" height="'+h+'" fill="#fdfcf8"/>';

  for(j=0;j<cols;j++){
    var S=stn(AXIS_STATIONS[j]);
    var cx=left+j*cw+cw/2;
    s+='<text class="node-lbl" x="'+cx.toFixed(1)+'" y="'+(top-30)+'" text-anchor="start" '
      +'transform="rotate(-52 '+cx.toFixed(1)+' '+(top-30)+')">'+esc(S.nm)+'</text>';
  }

  for(i=0;i<rows;i++){
    var y=top+i*ch;
    if(i%7===0){
      s+='<text class="axis-lbl" x="'+(left-8)+'" y="'+(y+ch*0.8).toFixed(1)+'" text-anchor="end">'+dmy(t[i])+'</text>';
    }
    for(j=0;j<cols;j++){
      var id=AXIS_STATIONS[j], d=ST.q[id];
      if(!d){ continue; }
      var v=d.q[i], r=rng[id], f=null;
      if(v!==null&&!isNaN(v)&&r&&r.hi>r.lo) f=Math.max(0,Math.min(1,(v-r.lo)/(r.hi-r.lo)));
      s+='<rect x="'+(left+j*cw).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(cw-1).toFixed(1)
        +'" height="'+(ch-0.6).toFixed(1)+'" fill="'+sevColor(f)+'"/>';
    }
  }
  /* خط اليوم */
  var yNow=top+k*ch;
  s+='<line x1="'+(left-4)+'" y1="'+yNow.toFixed(1)+'" x2="'+(w-right)+'" y2="'+yNow.toFixed(1)
    +'" stroke="#b46f4b" stroke-width="1.8"/>';
  s+='<text class="axis-lbl" x="'+(left-8)+'" y="'+(yNow-3).toFixed(1)+'" text-anchor="end" fill="#b46f4b" style="font-weight:700">اليوم</text>';

  /* أثر انتقال الموجة: قمة كل محطة */
  var trace="", ok=false;
  for(j=0;j<cols;j++){
    var dd=ST.q[AXIS_STATIONS[j]]; if(!dd) continue;
    var pi=-1, pv=-1e18;
    for(i=k;i<rows;i++) if(dd.q[i]!==null&&!isNaN(dd.q[i])&&dd.q[i]>pv){ pv=dd.q[i]; pi=i; }
    if(pi<0) continue;
    trace += (ok?" L":"M")+(left+j*cw+cw/2).toFixed(1)+" "+(top+pi*ch+ch/2).toFixed(1);
    ok=true;
  }
  if(ok) s+='<path d="'+trace+'" fill="none" stroke="#155b75" stroke-width="2" stroke-dasharray="4 3" opacity=".8"/>';

  /* الحد الفاصل للتنبؤ */
  s+='<rect x="'+left+'" y="'+top+'" width="'+(cols*cw-1)+'" height="'+(rows*ch)+'" fill="none" stroke="#ded6c5"/>';
  s+='</svg>';
  return s;
}

  for(i=0;i<yt.length;i++){

    s+='<line x1="'+ml+'" y1="'+yy.toFixed(1)+'" x2="'+(ml+iw)+'" y2="'+yy.toFixed(1)+'" stroke="#ece6d8"/>';
    s+='<text class="axis-lbl" x="'+(ml-6)+'" y="'+(yy+3).toFixed(1)+'" text-anchor="end">'+nf(yt[i],0)+'</text>';
  }
  for(i=0;i<values.length;i++){
    var bh=(values[i]/hi)*ih, bx=ml+i*bw+bw*0.15, by=mt+ih-bh;
    s+='<rect x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+(bw*0.7).toFixed(1)+'" height="'+Math.max(0,bh).toFixed(1)+'" fill="'+(color||"#247ba0")+'" rx="2"/>';
    if(i%Math.max(1,Math.round(values.length/8))===0)
      s+='<text class="axis-lbl" x="'+(bx+bw*0.35).toFixed(1)+'" y="'+(mt+ih+13)+'" text-anchor="middle">'+esc(labels[i])+'</text>';
  }
  s+='</svg>';
  return s;
}

/* =====================================================================
   خريطة خلايا الأمطار — مربعات ملوّنة بشدة المطر + حدود الأحواض
   ===================================================================== */
function rainColor(mm){
  if(mm===null||isNaN(mm)) return "#f1eee6";
  if(mm<5)   return "#eef2ea";
  if(mm<20)  return "#cfe0d2";
  if(mm<50)  return "#9ec7ae";
  if(mm<100) return "#5fa3c4";
  if(mm<200) return "#247ba0";
  return "#155b75";
}

function rainMapSVG(a, b){
  if(!ST.rain) return "";
  var w=700, h=460, i, j;
  var laMin=1e9, laMax=-1e9, loMin=1e9, loMax=-1e9;
  for(i=0;i<RAIN_CELLS.length;i++){
    var c=RAIN_CELLS[i];
    if(c.lat<laMin) laMin=c.lat; if(c.lat>laMax) laMax=c.lat;
    if(c.lon<loMin) loMin=c.lon; if(c.lon>loMax) loMax=c.lon;
  }
  var padLa=(laMax-laMin)*0.06, padLo=(loMax-loMin)*0.06;
  laMin-=padLa; laMax+=padLa; loMin-=padLo; loMax+=padLo;
  var m=34;
  function X(lo){ return m + (lo-loMin)/(loMax-loMin)*(w-2*m); }
  function Y(la){ return (h-m) - (la-laMin)/(laMax-laMin)*(h-2*m); }

  var s='<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet" role="img">';
  s+='<rect width="'+w+'" height="'+h+'" fill="#fdfcf8"/>';

  /* حدود الأحواض */
  for(i=0;i<BASINS.length;i++){

    d += " Z";
    s+='<path d="'+d+'" fill="'+B.col+'" fill-opacity=".05" stroke="'+B.col+'" stroke-width="1.4" stroke-dasharray="5 3"/>';
  }

  /* الخلايا */
  for(i=0;i<RAIN_CELLS.length;i++){
    var c2=RAIN_CELLS[i], p=ST.rain.P[i], sum=null;
    if(p){
      sum=0;
      for(j=Math.max(0,a); j<=Math.min(p.length-1,b); j++)
        if(p[j]!==null && !isNaN(p[j])) sum+=p[j];
    }
    var B2=basinOf(c2.b), st=B2? B2.step : 0.6;
    var x1=X(c2.lon-st/2), x2=X(c2.lon+st/2), y1=Y(c2.lat+st/2), y2=Y(c2.lat-st/2);
    var selc=(ST.rw.sel===i);
    s+='<rect id="rc-'+i+'" class="rain-cell" data-cell="'+i+'" x="'+x1.toFixed(1)+'" y="'+y1.toFixed(1)+'" width="'+Math.abs(x2-x1).toFixed(1)
      +'" height="'+Math.abs(y2-y1).toFixed(1)+'" fill="'+rainColor(sum)+'" stroke="'+(selc?'#b8503f':'#ffffff')+'" stroke-width="'+(selc?'2.2':'.6')+'"/>';
  }

  /* مراكز ثقل المطر */
  for(i=0;i<BASINS.length;i++){
    var cg=stormCentroid(BASINS[i].id, a, b);
    if(!cg) continue;
    s+='<circle cx="'+X(cg.lon).toFixed(1)+'" cy="'+Y(cg.lat).toFixed(1)+'" r="5" fill="none" stroke="#b8503f" stroke-width="2"/>';
    s+='<circle cx="'+X(cg.lon).toFixed(1)+'" cy="'+Y(cg.lat).toFixed(1)+'" r="1.6" fill="#b8503f"/>';
  }

  /* أسماء الأحواض */
  for(i=0;i<BASINS.length;i++){
    var B3=BASINS[i], cells=basinCells(B3.id);
    if(!cells.length) continue;
    var sla=0, slo=0;
    for(j=0;j<cells.length;j++){ sla+=cells[j].lat; slo+=cells[j].lon; }
    s+='<text class="node-lbl" x="'+X(slo/cells.length).toFixed(1)+'" y="'+Y(sla/cells.length).toFixed(1)
      +'" text-anchor="middle" style="font-weight:700;fill:'+B3.col+'">'+esc(B3.nm)+'</text>';
  }

  /* محطات المرجع */
  ["eldiem","atbara","jaulia","malakal"].forEach(function(id){
    var S=stn(id); if(!S) return;

    s+='<circle cx="'+X(S.gLon).toFixed(1)+'" cy="'+Y(S.gLat).toFixed(1)+'" r="3.6" fill="#243238"/>';
    s+='<text class="node-val" x="'+(X(S.gLon)+6).toFixed(1)+'" y="'+(Y(S.gLat)+3).toFixed(1)+'">'+esc(S.nm)+'</text>';
  });

  s+='<text class="axis-lbl" x="'+(w-8)+'" y="'+(h-8)+'" text-anchor="end">'
    + esc(ST.rain.t[Math.max(0,a)]) + ' ← ' + esc(ST.rain.t[Math.min(ST.rain.t.length-1,b)]) + '</text>';
  s+='</svg>';
  return s;
}

/* =====================================================================
   FIT — إحصاءات جودة المطابقة (إحصاء لا هيدروليكا؛ المعادلات الهيدروليكية
   تبقى حصراً فى MWRIHyd)
   ===================================================================== */
var FIT = (function(){
  function pair(obs, sim, a, b){
    var O=[],S=[],i;
    for(i=Math.max(0,a); i<=Math.min(Math.min(obs.length,sim.length)-1, b); i++){
      var o=obs[i], s=sim[i];
      if(o===null||o===undefined||isNaN(o)) continue;
      if(s===null||s===undefined||isNaN(s)) continue;
      O.push(o); S.push(s);
    }
    return {O:O, S:S};
  }
  function mean(a){ var s=0,i; for(i=0;i<a.length;i++) s+=a[i]; return a.length? s/a.length : 0; }
  function sd(a){
    var m=mean(a), s=0, i;
    for(i=0;i<a.length;i++) s+=(a[i]-m)*(a[i]-m);
    return a.length>1? Math.sqrt(s/(a.length-1)) : 0;
  }
  function corr(x,y){
    var mx=mean(x), my=mean(y), n=0, dx=0, dy=0, i;
    for(i=0;i<x.length;i++){ n+=(x[i]-mx)*(y[i]-my); dx+=(x[i]-mx)*(x[i]-mx); dy+=(y[i]-my)*(y[i]-my); }
    return (dx>0&&dy>0)? n/Math.sqrt(dx*dy) : 0;
  }
  function metrics(obs, sim, a, b){
    var p=pair(obs,sim,a,b), O=p.O, S=p.S, i;
    if(O.length<3) return null;
    var mo=mean(O), num=0, den=0, se=0;
    for(i=0;i<O.length;i++){ num+=(O[i]-S[i])*(O[i]-S[i]); den+=(O[i]-mo)*(O[i]-mo); se+=(S[i]-O[i]); }
    var nse = den>0? 1-num/den : null;
    var rmse = Math.sqrt(num/O.length);
    var pbias = mo!==0? (se/ (mo*O.length))*100 : 0;
    var r = corr(O,S);
    var alpha = sd(O)>0? sd(S)/sd(O) : 0;
    var beta  = mo!==0? mean(S)/mo : 0;
    var kge = 1 - Math.sqrt((r-1)*(r-1) + (alpha-1)*(alpha-1) + (beta-1)*(beta-1));
    return { n:O.length, NSE:nse, KGE:kge, RMSE:rmse, PBIAS:pbias, r:r, alpha:alpha, beta:beta };
  }
  function peakErr(obs, sim, t, a, b){
    var po=null, ps=null, i;
    for(i=Math.max(0,a); i<=Math.min(obs.length-1,b); i++){
      if(obs[i]!==null&&!isNaN(obs[i])&&(po===null||obs[i]>obs[po])) po=i;
      if(sim[i]!==null&&!isNaN(sim[i])&&(ps===null||sim[i]>sim[ps])) ps=i;
    }
    if(po===null||ps===null) return null;
    return { dtDays: ps-po, dQpct: obs[po]!==0? (sim[ps]-obs[po])/obs[po]*100 : 0,
             tObs:t[po], tSim:t[ps] };
  }
  function grade(kge){
    if(kge===null||kge===undefined) return {g:"—", cls:"info"};
    if(kge>=0.90) return {g:"ممتاز", cls:"green"};
    if(kge>=0.75) return {g:"جيد", cls:"green"};
    if(kge>=0.50) return {g:"مقبول", cls:"sand"};
    return {g:"ضعيف", cls:"danger"};
  }
  function linfit(x,y){
    /* انحدار خطى y = a·x + b — إحصاء لا هيدروليكا */
    var n=Math.min(x.length,y.length), sx=0,sy=0,sxx=0,sxy=0,i,c=0;
    for(i=0;i<n;i++){
      if(x[i]===null||y[i]===null||isNaN(x[i])||isNaN(y[i])) continue;
      sx+=x[i]; sy+=y[i]; sxx+=x[i]*x[i]; sxy+=x[i]*y[i]; c++;
    }
    if(c<2) return null;
    var den=c*sxx-sx*sx;
    if(Math.abs(den)<1e-12) return null;
    var a=(c*sxy-sx*sy)/den, b=(sy-a*sx)/c;
    return {a:a, b:b, n:c};
  }
  return { metrics:metrics, peakErr:peakErr, grade:grade, mean:mean, sd:sd,
           corr:corr, linfit:linfit };
})();

/* =====================================================================
   التتبّع — ماسكينجم متتالٍ عبر MWRIHyd حصراً
   ===================================================================== */
function routeCascade(inflow, K, x, n, dt){
  var q=inflow.slice(), Ks=K/n, ok=true, res, i, j;
  /* S = K[x·I + (1-x)·O] لكل مقطع فرعى — تخزين ماسكينجم بوحدة (م³/ث)·يوم */
  var S=[]; for(j=0;j<inflow.length;j++) S.push(0);
  for(i=0;i<n;i++){
    res = MWRIHyd.muskingum(q, Ks, x, dt, q[0]);
    if(!res.stable) ok=false;
    for(j=0;j<q.length;j++){
      var I=q[j], O=res.outflow[j];
      if(I!==null&&O!==null&&!isNaN(I)&&!isNaN(O)) S[j] += Ks*(x*I + (1-x)*O);
    }
    q = res.outflow;
  }
  return { out:q, stable:ok, Ks:Ks, lo:2*Ks*x, hi:2*Ks*(1-x), S:S };
}

/* المنظومة الكاملة لسلسلة مدخلات واحدة (تُستدعى للسيناريو ولكل عضو) */
function routeSystem(qEldiem, qJaulia, qAtbara, R){
  var dt=1, j;
  var r1 = routeCascade(qEldiem, R[0].K, R[0].x, R[0].n, dt);
  var blueKh = r1.out;
  var mainKh = addS(blueKh, qJaulia, 1);
  var r2 = routeCascade(mainKh, R[1].K, R[1].x, R[1].n, dt);   /* الخرطوم ← شندى */
  var atConf = r2.out;
  var inR3 = addS(atConf, qAtbara, 1);                          /* عطبرة تدخل هنا لا قبله */
  var r3 = routeCascade(inR3, R[2].K, R[2].x, R[2].n, dt);      /* الملتقى ← دنقلا */
  var r4 = routeCascade(r3.out, R[3].K, R[3].x, R[3].n, dt);    /* دنقلا ← حلفا */
  var Stot=[];
  for(j=0;j<qEldiem.length;j++) Stot.push(r1.S[j]+r2.S[j]+r3.S[j]+r4.S[j]);
  return { blueKh:blueKh, mainKh:mainKh, atConf:atConf, dongola:r3.out, halfa:r4.out,
           r1:r1, r2:r2, r3:r3, r4:r4, S:Stot };
}

/* =====================================================================
   تصحيح الحالة عند حلفا — الحلقة التى تفصل نظام تنبؤ تشغيلياً عن نموذج مفتوح
   التتبّع يبدأ من الديم فيتراكم انحرافه حتى حلفا. الممارسة التشغيلية المعتادة
   أن يُصحَّح الفارق عند آخر قيمة معروفة، بوزن يتلاشى مع الأفق لأن التصحيح
   لا معنى له بعيداً حيث تحكم الأمطار لا الحالة الابتدائية.
   المرساة: القياس الميدانى المصحَّح إن توفّر، وإلا قيمة GloFAS عند حلفا.
   ===================================================================== */
var NUDGE_L = 10;
function nudgeAnchor(){
  if(!ST.q||!ST.q.halfa) return null;
  var k=nowIdx(), v=ST.q.halfa.q[k];
  if(v===null||v===undefined||isNaN(v)) return null;
  var bm=null; try{ bm=biasModel("halfa"); }catch(e){}
  if(bm&&bm.valid){
    var c=correctedQ("halfa", v);
    if(c!==null&&!isNaN(c)) return { v:c, src:"corr" };
  }
  return { v:v, src:"model" };
}
function nudgeApply(arr){
  if(!ST.nudge||!arr) return arr;
  var A=nudgeAnchor(); if(!A) return arr;
  var k=nowIdx();
  if(k>=arr.length||arr[k]===null||arr[k]===undefined||isNaN(arr[k])) return arr;
  var off=A.v-arr[k], out=arr.slice(), i;
  for(i=k;i<out.length;i++){
    if(out[i]===null||out[i]===undefined||isNaN(out[i])) continue;
    var w=1-(i-k)/NUDGE_L; if(w<0) w=0;
    out[i]=out[i]+off*w;
  }
  return out;
}
function runRouting(){
  if(!ST.q||!ST.q.eldiem) return null;
  var t=ST.q.eldiem.t, f=scenF(), R=ST.reaches;
  var inflow = mulS(ST.q.eldiem.q, f);
  var white  = ST.q.jaulia? ST.q.jaulia.q : inflow.map(function(){return 0;});
  var atb    = ST.q.atbara? mulS(ST.q.atbara.q, f) : inflow.map(function(){return 0;});
  var sys = routeSystem(inflow, white, atb, R);

  /* تصحيح الحالة: يُطبَّق على المخرج عند حلفا فقط — لا على المقاطع الوسيطة
     حتى يبقى الاتزان الحجمى وحفظ الكتلة محسوبين على الأرقام الخام */
  var ndg=null;
  if(ST.nudge){
    var A0=nudgeAnchor(), k0=nowIdx();
    if(A0 && sys.halfa[k0]!==null && sys.halfa[k0]!==undefined && !isNaN(sys.halfa[k0])){
      ndg={ off:A0.v-sys.halfa[k0], anchor:A0.v, raw:sys.halfa[k0], src:A0.src, L:NUDGE_L };
      sys.halfa=nudgeApply(sys.halfa);
    }
  }

  /* التراكب الكمى — ماسكينجم خطى فالتفكيك مطابق تماماً */
  var zero = inflow.map(function(){ return 0; });
  var cBlue  = routeSystem(inflow, zero, zero, R).halfa;
  var cWhite = routeSystem(zero, white, zero, R).halfa;
  var cAtb   = routeSystem(zero, zero, atb, R).halfa;

  /* الوارد المُزاح لزمن وصول كل رافد إلى وادى حلفا */
  var L1 = R[0].K + R[1].K + R[2].K + R[3].K;   /* الديم */
  var L2 = R[1].K + R[2].K + R[3].K;            /* الأبيض (يدخل عند الخرطوم) */
  var L3 = R[2].K + R[3].K;                     /* عطبرة (تدخل عند الملتقى) */
  var alignedIn = addS(addS(shift(inflow,L1), shift(white,L2), 1), shift(atb,L3), 1);

  var pkIn = peakOf(alignedIn, t), pkOut = peakOf(sys.halfa, t);
  var last = t.length-1;
  var rising = (pkIn.i>=last-1 || pkOut.i>=last-1);
  /* الاستنفاد لا معنى له قبل بلوغ الذروة — الذروتان حينئذ طرف النافذة لا قمة */
  var att = (!rising && pkIn.v && pkOut.v)? (1 - pkOut.v/pkIn.v)*100 : null;

  var k = nowIdx();
  var volIn  = volume(alignedIn, k, t.length-1);
  var volOut = volume(sys.halfa, k, t.length-1);
  /* تغيّر التخزين داخل المقاطع خلال النافذة (مليون م³) — من صيغة ماسكينجم نفسها */
  var last=t.length-1;
  var dS = (sys.S[last]!==undefined && sys.S[k]!==undefined)? (sys.S[last]-sys.S[k])*86400/1e6 : null;
  /* اتزان صحيح: V_in − V_out − ΔS ≈ 0 */
  var volIn2  = volume(addS(addS(inflow, white,1), atb,1), k, last);
  var volResid = (dS!==null)? (volIn2 - volOut - dS) : null;

  return { t:t, inflow:inflow, white:white, atb:atb,
    blueAtKh:sys.blueKh, mainKh:sys.mainKh, atDongola:sys.dongola, atHalfa:sys.halfa,
    r1:sys.r1, r2:sys.r2, r3:sys.r3, r4:sys.r4, atConf:sys.atConf,
    comp:{ blue:cBlue, white:cWhite, atbara:cAtb },
    alignedIn:alignedIn, lag:L1, lagWhite:L2, lagAtbara:L3,
    dS:dS, volInRaw:volIn2, volResid:volResid,
    pkIn:pkIn, pkOut:pkOut, att:att, rising:rising, volIn:volIn, volOut:volOut,
    ndg:ndg,
    obsHalfa: ST.q.halfa? ST.q.halfa.q : null };
}

/* =====================================================================
   تتبّع أعضاء المروحة (٥٠ مضطرباً + عضو تشغيلى)
   ===================================================================== */
function runEnsemble(){
  if(!ST.mem || !ST.mem.eldiem || !ST.q) return null;
  var R=ST.reaches, f=scenF(), t=ST.q.eldiem.t, i, m;
  var Me=ST.mem.eldiem.M, Mw=ST.mem.jaulia?ST.mem.jaulia.M:null, Ma=ST.mem.atbara?ST.mem.atbara.M:null;
  var nM=Me.length;
  if(!nM) return null;
  var routed=[], peaks=[], pkDates=[], zero=t.map(function(){return 0;});
  for(m=0;m<nM;m++){
    var e = mulS(Me[m], f);
    var w = (Mw&&Mw[m])? Mw[m] : (ST.q.jaulia?ST.q.jaulia.q:zero);
    var a = (Ma&&Ma[m])? mulS(Ma[m], f) : (ST.q.atbara?mulS(ST.q.atbara.q,f):zero);
    var h = nudgeApply(routeSystem(e, w, a, R).halfa);
    routed.push(h);
    var p = peakOf(h, t);
    peaks.push(p.v); pkDates.push(p.i);
  }
  /* الرتب اليومية */
  var p10=[],p25=[],p50=[],p75=[],p90=[],mn=[],mx=[];
  for(i=0;i<t.length;i++){
    var col=[];
    for(m=0;m<nM;m++){ var v=routed[m][i]; if(v!==null&&!isNaN(v)) col.push(v); }
    col.sort(function(x,y){return x-y;});
    p10.push(quantile(col,0.10)); p25.push(quantile(col,0.25)); p50.push(quantile(col,0.50));
    p75.push(quantile(col,0.75)); p90.push(quantile(col,0.90));
    mn.push(col.length?col[0]:null); mx.push(col.length?col[col.length-1]:null);
  }
  return { t:t, n:nM, routed:routed, p10:p10, p25:p25, p50:p50, p75:p75, p90:p90, mn:mn, mx:mx,
           peaks:peaks, pkDates:pkDates };
}

/* إحصاءات العتبة من الأعضاء المُتتبَّعة */
function ensembleThresholdStats(ens, L){
  if(!ens) return null;
  var k=nowIdx(), m, i;
  var nOver=0, vols=[], durs=[], firstDays=[];
  for(m=0;m<ens.n;m++){
    var r=ens.routed[m], vol=0, dur=0, first=null;
    for(i=k;i<r.length;i++){
      if(r[i]!==null&&!isNaN(r[i])&&r[i]>L){
        vol += (r[i]-L)*86400; dur++;
        if(first===null) first=i-k;
      }
    }
    if(dur>0){ nOver++; vols.push(vol/1e6); durs.push(dur); firstDays.push(first); }
  }
  vols.sort(function(a,b){return a-b;}); durs.sort(function(a,b){return a-b;}); firstDays.sort(function(a,b){return a-b;});
  return {
    prob: ens.n? nOver/ens.n*100 : 0,
    volMed: vols.length? quantile(vols,0.5) : 0,
    volMax: vols.length? vols[vols.length-1] : 0,
    durMed: durs.length? quantile(durs,0.5) : 0,
    durMax: durs.length? durs[durs.length-1] : 0,
    firstMed: firstDays.length? quantile(firstDays,0.5) : null,
    firstMin: firstDays.length? firstDays[0] : null,
    firstMax: firstDays.length? firstDays[firstDays.length-1] : null,
    nOver:nOver
  };
}
function exceedProbEns(ens, j, L){
  if(!ens) return null;
  var c=0, n=0, m;
  for(m=0;m<ens.n;m++){
    var v=ens.routed[m][j];
    if(v===null||isNaN(v)) continue;
    n++; if(v>=L) c++;
  }
  return n? c/n*100 : null;
}

/* =====================================================================
   المعايرة الآلية — بحث شبكى على الفترة الماضية فقط
   ===================================================================== */
/* البحث الشبكى المشترك على K/x/n بمعيار KGE — تستدعيه المعايرة الجارية والموسمية معاً
   (استُخلص من calibrateReach حتى لا تتكرر شبكة القيم فى موضعين وتتباعد مستقبلاً) */
function muskGrid(inflow, obs, a, b){
  var Ks=[1,1.5,2,2.5,3,3.5,4,5,6,7,8,9,10];
  var Xs=[0.05,0.10,0.15,0.20,0.25,0.30,0.35,0.40];
  var Ns=[1,2,3,4,5,6,8];
  var best=null, i,j,z;
  for(i=0;i<Ks.length;i++) for(j=0;j<Xs.length;j++) for(z=0;z<Ns.length;z++){
    var K=Ks[i], x=Xs[j], n=Ns[z], Ksub=K/n;
    if(!(1 >= 2*Ksub*x && 1 <= 2*Ksub*(1-x))) continue; /* شرط الاستقرار عند Δt=1 */
    var r=routeCascade(inflow,K,x,n,1);
    var mt=FIT.metrics(obs, r.out, a, b);
    if(!mt||mt.KGE===null||isNaN(mt.KGE)) continue;
    if(!best || mt.KGE>best.m.KGE) best={K:K,x:x,n:n,m:mt,out:r.out};
  }
  return best;
}
function calibrateReach(idx){
  if(!ST.q) return null;
  var k=nowIdx(), a=Math.max(2,k-42), b=k;
  var t=ST.q.eldiem.t, inflow, obs;
  /* المرجع لكل مقطع = محطة مصبّه، والمدخل نفس ما تستخدمه routeSystem بالضبط */
  if(idx===0){ inflow=ST.q.eldiem.q;   obs=ST.q.bnkhart.q; }
  else if(idx===1){ inflow=ST.q.khartoum.q; obs=ST.q.shendi.q; }
  else if(idx===2){ inflow=addS(ST.q.shendi.q, ST.q.atbara.q, 1); obs=ST.q.merowe.q; }
  else { inflow=ST.q.merowe.q; obs=ST.q.halfa.q; }
  if(!inflow||!obs) return null;

  var best=muskGrid(inflow, obs, a, b);
  /* قابلية التعريف: K وx لا يُعرَّفان من ساق صاعدة ملساء بلا ذروة */
  var wv=[], wi;
  for(wi=a; wi<=b; wi++) if(inflow[wi]!==null&&!isNaN(inflow[wi])) wv.push(inflow[wi]);
  var wmin=Math.min.apply(null,wv), wmax=Math.max.apply(null,wv), wmean=FIT.mean(wv);
  var ident = wmean>0? (wmax-wmin)/wmean : 0;
  var hasPeak=false, wj;
  for(wj=a+2; wj<=b-2; wj++)
    if(inflow[wj]!==null && inflow[wj]>=wmax*0.995) hasPeak=true;

  var R=ST.reaches[idx];
  var cur=routeCascade(inflow,R.K,R.x,R.n,1);
  var curM=FIT.metrics(obs, cur.out, a, b);
  var pe = best? FIT.peakErr(obs, best.out, t, a, b) : null;
  return { idx:idx, cur:{K:R.K,x:R.x,n:R.n,m:curM}, best:best, peak:pe,
           ident:ident, hasPeak:hasPeak,
           reliable:(ident>=0.5 && hasPeak),
           window:{from:t[a], to:t[b], n:b-a+1} };
}
function calibrateAll(){
  var out=[],i;
  for(i=0;i<ST.reaches.length;i++) out.push(calibrateReach(i));
  return out;
}

/* =====================================================================
   الاتزان الحجمى المزاح زمنياً
   ===================================================================== */
function balanceNode(node){
  if(!ST.q) return null;
  var k=nowIdx(), a=Math.max(0,k-29), b=k, ins=[], outQ, lagMap, nm;
  if(node==="khartoum"){
    lagMap=LAGS.khartoum; outQ=ST.q.khartoum.q; nm="ملتقى الخرطوم";
    ins=[{id:"bnkhart",nm:"الأزرق"},{id:"jaulia",nm:"الأبيض"}];
  } else {
    lagMap=LAGS.merowe; outQ=ST.q.merowe.q; nm="ملتقى عطبرة ← دنقلا";
    ins=[{id:"shendi",nm:"شندى"},{id:"atbara",nm:"عطبرة"}];
  }
  var comp=[], sumV=0, sumQ=0;
  ins.forEach(function(o){
    var raw=ST.q[o.id].q, lag=lagMap[o.id]||0, s=shift(raw,lag);
    var V=volume(s,a,b), Q=s[k];
    comp.push({nm:o.nm, lag:lag, V:V, Q:Q});
    sumV+=V; sumQ+=(Q||0);
  });
  var Vout=volume(outQ,a,b), Qout=outQ[k];
  var wb = MWRIHyd.waterBalance(
    comp.map(function(c){ return {Q:c.Q||0}; }),
    [{Q:Qout||0}], {tolerancePct:(node==="khartoum"?5:8)});
  return { nm:nm, comp:comp, sumV:sumV, Vout:Vout,
    closureV: sumV-Vout, closureVpct: sumV>0? (sumV-Vout)/sumV*100 : 0,
    sumQ:sumQ, Qout:Qout, wb:wb, window:{from:ST.q.eldiem.t[a], to:ST.q.eldiem.t[b], days:b-a+1} };
}

function operationalSentence(){

/* =====================================================================
   سجل أداء التنبؤ — يُقيَّم لاحقاً بالمقارنة بما حدث

function buildLogEntry(){
  if(!ST.q) return null;
  var k=nowIdx(), d=ST.q.halfa, ens=runEnsemble();
  var pk = ens? peakOf(ens.p50, d.t) : peakOf(d.q.slice(k), d.t.slice(k));
  return {
    date: todayISO(),
    issued: Date.now(),
    q0: d.q[k],
    f3:  d.q[Math.min(d.q.length-1,k+3)],
    f7:  d.q[Math.min(d.q.length-1,k+7)],
    f14: d.q[Math.min(d.q.length-1,k+14)],
    peak: pk.v, peakDate: pk.t,
    thrB: ST.thr? ST.thr.b : null,
    scen: ST.scen, build: BUILD
  };
}
function evaluateLog(){
  if(!ST.q) return [];
  var d=ST.q.halfa, out=[], keys=Object.keys(ST.log||{}).sort(), i;
  var O=(ST.obs&&ST.obs.halfa)?ST.obs.halfa:{};
  function dnum(iso){ var p=String(iso).split("-"); return Math.floor(Date.UTC(+p[0],+p[1]-1,+p[2])/864e5); }
  function idxOf(iso){ var j; for(j=0;j<d.t.length;j++) if(d.t[j]===iso) return j; return -1; }
  /* الحقيقة: القياس الميدانى إن وُجد لنفس اليوم، وإلا قيمة المنظومة اللاحقة */
  function truthOn(iso){
    var r=O[iso];
    if(r&&typeof r.q==="number") return {v:r.q, src:"obs"};
    var j=idxOf(iso);
    if(j>=0&&d.q[j]!==null&&!isNaN(d.q[j])) return {v:d.q[j], src:"model"};
    return null;
  }
  function addDays(iso,n){
    var p=iso.split("-"), dt=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
    dt=new Date(dt.getTime()+n*864e5);
    return dt.toISOString().slice(0,10);
  }
  for(i=0;i<keys.length;i++){
    var e=ST.log[keys[i]];
    if(!e||!e.date) continue;
    var row={date:e.date, q0:e.q0, peakFc:e.peak, peakDateFc:e.peakDate};
    [[3,"f3"],[7,"f7"],[14,"f14"]].forEach(function(pr){
      var T=truthOn(addDays(e.date,pr[0])), fc=e[pr[1]];
      row["a"+pr[0]]=T?T.v:null;
      row["s"+pr[0]]=T?T.src:null;
      row["f"+pr[0]]=(fc===undefined||fc===null||isNaN(fc))?null:fc;
      row["e"+pr[0]]=(T&&T.v&&row["f"+pr[0]]!==null)? (row["f"+pr[0]]-T.v)/T.v*100 : null;
    });
    /* خطأ الذروة وتوقيتها — لا يُقيَّم إلا بعد اكتمال ثلاثين يوماً داخل السلسلة المتاحة */
    row.pk=null;
    var i0=idxOf(e.date), k=nowIdx(), j2, bi=-1;
    if(i0>=0 && e.peak && e.peakDate && (k-i0)>=30){
      for(j2=i0;j2<=Math.min(i0+30,k);j2++)
        if(d.q[j2]!==null&&!isNaN(d.q[j2])&&(bi<0||d.q[j2]>d.q[bi])) bi=j2;
      if(bi>=0) row.pk={ vAct:d.q[bi], tAct:d.t[bi], vFc:e.peak, tFc:e.peakDate,
        dQ: d.q[bi]? (e.peak-d.q[bi])/d.q[bi]*100 : null,
        dT: dnum(e.peakDate)-dnum(d.t[bi]) };
    }
    out.push(row);
  }
  return out;
}
/* مقاييس الدقة لكل أفق — NSE/KGE/RMSE/PBIAS عبر FIT (إحصاء لا هيدروليكا) */
function logSkill(){
  var rows=evaluateLog(), HS=[3,7,14], out=[], k, i;
  for(k=0;k<HS.length;k++){
    var h=HS[k], A=[], F=[], sgn=[], nObs=0;
    for(i=0;i<rows.length;i++){
      var a=rows[i]["a"+h], f=rows[i]["f"+h];
      if(a===null||a===undefined||f===null||f===undefined||isNaN(a)||isNaN(f)||!a) continue;
      A.push(a); F.push(f); sgn.push((f-a)/a*100);
      if(rows[i]["s"+h]==="obs") nObs++;
    }
    var m=(A.length>=3)? FIT.metrics(A,F,0,A.length-1) : null;
    var ab=0; for(i=0;i<sgn.length;i++) ab+=Math.abs(sgn[i]);
    out.push({ h:h, n:A.length, nObs:nObs, m:m,
      mae: sgn.length? ab/sgn.length : null,
      bias: sgn.length? FIT.mean(sgn) : null,
      grade: m? FIT.grade(m.KGE) : null });
  }
  return out;
}

/* =====================================================================
   موثوقية الخلية — مؤشر متعدد المعايير (لا مسافة وحدها)
   ===================================================================== */
/* الرافد المقابل عند كل ملتقى: الرافد الصغير يُقارن بـ«باقى المصبّ»
   بعد طرح شقيقه، وإلا عوقب ظلماً — الأبيض شبه ثابت ومصبّه يرتفع بالأزرق */
var SIBLING = { jaulia:"bnkhart", bnkhart:"jaulia", atbara:"shendi", shendi:"atbara" };

var DOWNSTREAM = {
  tana:"eldiem", eldiem:"roseires", roseires:"sennar", sennar:"bnkhart",
  bnkhart:"khartoum", sobat:"malakal", malakal:"jaulia", jaulia:"khartoum",
  khartoum:"shendi", shendi:"merowe", atbara:"merowe", merowe:"halfa", halfa:"aswan"
};

function cellReliability(id){
  var S=stn(id); if(!S) return null;
  var k=nowIdx(), a=Math.max(0,k-42), b=k, i;
  var d=haversine(S.gLat,S.gLon,S.lat,S.lon);
  /* ١) القرب المكانى */
  var sD = d<=5? 100 : (d>=30? 0 : Math.round(100*(30-d)/25));
  /* ٢) تطابق المسار: أعلى ارتباط مع المحطة التالية بعد الإزاحة الزمنية
        الموجة تصل المحطة التالية بعد أيام، فالارتباط عند إزاحة صفر يقلّل الدرجة ظلماً */
  var dn=DOWNSTREAM[id], r=null, sR=0, bestLag=null, L, refMode="—";
  if(dn && ST.q && ST.q[id] && ST.q[dn]){
    var sib = SIBLING[id];
    var useResidual = !!(sib && ST.q[sib]);
    for(L=0; L<=7; L++){
      var X=[],Y=[];
      for(i=a;i<=b;i++){
        var j=i+L;
        if(j>=ST.q[dn].q.length) break;
        var u=ST.q[id].q[i], v=ST.q[dn].q[j];
        if(useResidual){
          var w2=ST.q[sib].q[j];
          if(w2===null||isNaN(w2)) continue;
          v = v - w2;                     /* باقى المصبّ بعد طرح الرافد المقابل */
        }
        if(u===null||v===null||isNaN(u)||isNaN(v)) continue;
        X.push(u); Y.push(v);
      }
      if(X.length<=10) continue;
      var rr=FIT.corr(X,Y);
      if(r===null || rr>r){ r=rr; bestLag=L; }
    }
    if(r!==null) sR=Math.max(0, Math.round(r*100));
    refMode = useResidual? "باقى المصبّ" : "المصبّ";
  }
  /* ٣) معقولية الحجم مقابل المحطة التالية */
  var ratio=null, sP=50;
  if(dn && ST.q && ST.q[id] && ST.q[dn]){
    var qu=ST.q[id].q[k], qd=ST.q[dn].q[k];
    if(qu&&qd){
      ratio=qu/qd;
      sP = (ratio>=0.10 && ratio<=1.30)? 100 : (ratio>=0.03 && ratio<=2.0? 55 : 10);
    }
  }
  var score = Math.round(0.40*sD + 0.40*sR + 0.20*sP);
  var g = score>=80?"A":(score>=65?"B":(score>=45?"C":"D"));
  /* القياس الميدانى الموثّق يرفع الدرجة إلى A مباشرة */
  var bm = biasModel(id);
  if(bm && bm.valid){ g="A"; score=Math.max(score,85); }
  return { km:d, sD:sD, r:r, sR:sR, lag:bestLag, refMode:refMode, ratio:ratio, sP:sP, score:score, grade:g,
           downstream:dn, calibrated:!!(bm&&bm.valid) };
}

/* =====================================================================
   تصحيح الانحياز — بضوابط لا بمعامل من نقطة واحدة
   الشروط: ٣ قياسات فأكثر · خلال ٣٦٥ يوماً · تغطى مدى تصرفات · بعد رفض الشواذّ
   ===================================================================== */
var OBS_MIN_N = 3, OBS_MAX_AGE_D = 365, OBS_MIN_SPAN = 1.30;

function obsPairs(id){
  var o = ST.obs && ST.obs[id]; if(!o) return [];
  var d = ST.q && ST.q[id]; if(!d) return [];
  var out=[], keys=Object.keys(o), i, j;
  var nowMs = Date.now();
  for(i=0;i<keys.length;i++){
    var rec=o[keys[i]];
    if(!rec || typeof rec.q!=="number") continue;
    var mv=null;
    for(j=0;j<d.t.length;j++) if(d.t[j]===keys[i]) mv=d.q[j];
    if(mv===null||!mv) continue;                      /* لا نموذج لنفس اليوم */
    var p=keys[i].split("-");
    var ageD=(nowMs - Date.UTC(+p[0],+p[1]-1,+p[2]))/864e5;
    if(ageD>OBS_MAX_AGE_D) continue;                  /* منتهى الصلاحية */
    out.push({ date:keys[i], obs:rec.q, mod:mv, ratio:rec.q/mv, age:ageD,
               by:rec.by||"—", out:false });
  }
  out.sort(function(x,y){ return x.mod-y.mod; });
  return out;
}

function biasModel(id){
  var P=obsPairs(id);
  if(!P.length) return { valid:false, n:0, reason:"لا قياسات" };
  /* رفض الشواذّ على النسبة (|z| > 2) */
  var rs=P.map(function(p){ return p.ratio; });
  var m=FIT.mean(rs), sd=FIT.sd(rs), i;
  var kept=[];
  for(i=0;i<P.length;i++){
    if(sd>0 && Math.abs((P[i].ratio-m)/sd)>2){ P[i].out=true; }
    else kept.push(P[i]);
  }
  var n=kept.length;
  if(n<OBS_MIN_N)
    return { valid:false, n:n, pairs:P, reason:"القياسات الصالحة "+n+" والحدّ الأدنى "+OBS_MIN_N };
  var mods=kept.map(function(p){ return p.mod; });
  var span = Math.min.apply(null,mods)>0? Math.max.apply(null,mods)/Math.min.apply(null,mods) : 1;
  if(span<OBS_MIN_SPAN)
    return { valid:false, n:n, pairs:P, span:span,
             reason:"القياسات متجمّعة على تصرف واحد (المدى "+span.toFixed(2)+"×) — لا تصلح لمنحنى تصحيح" };
  var fit = FIT.linfit(mods, kept.map(function(p){ return p.obs; }));
  if(!fit) return { valid:false, n:n, pairs:P, reason:"تعذّر حساب منحنى التصحيح" };
  var meanRatio = FIT.mean(kept.map(function(p){ return p.ratio; }));
  return { valid:true, n:n, pairs:P, span:span, fit:fit, meanRatio:meanRatio,
           newest: Math.min.apply(null, kept.map(function(p){ return p.age; })),
           reason:"صالح" };
}
function correctedQ(id, q){
  var bm=biasModel(id);
  if(!bm||!bm.valid||q===null||isNaN(q)) return null;
  return bm.fit.a*q + bm.fit.b;
}

function secCommand(){
  if(!ST.q) return panel("مركز قيادة الموجة","جارٍ تحميل البيانات الحية", skel(6));
  var k=nowIdx(), rt=runRouting(), ens=runEnsemble();
  var qH=cur("halfa"), lvl=alertLevel(qH), ri=rainIndex();
  var stB = ens? ensembleThresholdStats(ens, ST.thr.b) : null;

  var s='<div class="banner '+(lvl.cls==="ok"?"ok":(lvl.cls==="danger"?"danger":"warn"))+'">'
    +'<span>'+(lvl.k>=2?"⚠":"✓")+'</span><div>'+esc(operationalSentence()||"")+'</div></div>';

  s+='<div class="grid g5">'
    +kpi("≋","","الديم — وارد الهضبة", nf(cur("eldiem"),0),"م³/ث","النيل الأزرق عند الحدود")
    +kpi("⑂","","الرئيسى — الخرطوم", nf(cur("khartoum"),0),"م³/ث","بعد الملتقى")
    +kpi("◔","sand","نهر عطبرة", nf(cur("atbara"),0),"م³/ث","الرافد الموسمى")
    +kpi("▣", lvl.k>=2?"danger":"green","الوارد لبحيرة ناصر", nf(qH,0),"م³/ث","وادى حلفا")
    +kpi("☂","green","أمطار المنابع — قادم ٧ي", ri?nf(ri.next7,0):"—","مم", ri?("ماضٍ "+nf(ri.past7,0)+" مم"):"—")
    +'</div>';

  if(ST.cal.on && ST.cal.model){
    var cH=calQ("halfa",qH), cD=calQ("eldiem",cur("eldiem")), fH=calFactor("halfa");
    if(cH!==null)
      s+='<div class="banner info"><span>⚖</span><div>'
        +'<b>القيمة المُعايرة حجمياً:</b> الوارد لبحيرة ناصر '+nf(cH,0)+' م³/ث '
        +'(الخام '+nf(qH,0)+' × معامل '+nf(fH,3)+')، والديم '+(cD!==null?nf(cD,0):"—")+' م³/ث. '
        +stampPill("vol")+' — ضبط مقياس بمتوسطات منشورة لا قياس ميدانى، '
        +'ومستوى الإنذار محسوب على الأرقام الخام وعتباتها ولا يتأثر.</div></div>';
  }

  if(stB){
    s+=scenarioNote();
    s+='<div class="grid g4" style="margin-top:15px">'
      +kpi("%", stB.prob>=50?"danger":(stB.prob>=20?"sand":"green"),"احتمال تجاوز التأهّب", nf(stB.prob,0),"%", ens.n+" عضواً مُتتبَّعاً")
      +kpi("⏱","","زمن الوصول المتوقع", stB.firstMed!==null?nf(stB.firstMed,0):"—","يوم",
          stB.firstMin!==null?("المدى "+nf(stB.firstMin,0)+"–"+nf(stB.firstMax,0)+" يوم"):"لا تجاوز متوقع")
      +kpi("∑","sand","حجم المياه فوق العتبة", nf(stB.volMed,0),"مليون م³","الوسيط · الأقصى "+nf(stB.volMax,0))
      +kpi("◷","","مدة البقاء فوق العتبة", nf(stB.durMed,0),"يوم","الأقصى "+nf(stB.durMax,0)+" يوم")
      +'</div>';
  }

  var bands=[], series=[];
  if(ens){
    bands.push({lo:ens.mn,hi:ens.mx,color:"#247ba0",op:0.10});
    bands.push({lo:ens.p10,hi:ens.p90,color:"#247ba0",op:0.18});
    bands.push({lo:ens.p25,hi:ens.p75,color:"#247ba0",op:0.26});
    series.push({v:ens.p50,color:"#155b75",wd:2.4,mark:k});
  } else {
    series.push({v:ST.q.halfa.q,color:"#155b75",wd:2.4,mark:k});
  }
  series.push({v:ST.q.halfa.q,color:"#4d7c5a",wd:1.5,dash:"5 4"});
  if(rt) series.push({v:rt.atHalfa,color:"#b46f4b",wd:1.8});

  s+=panel("الهيدروجراف المركّب","الوارد لبحيرة ناصر — "+PAST+" يوماً مضت + "+FUT+" تنبؤاً",
    '<div class="chart-box">'+plot({
      t:ST.q.halfa.t, series:series, bands:bands, nowIdx:k, yTitle:"التصرف (م³/ث)",
      hlines:[{v:ST.thr.a,nm:"متابعة",color:"#c58a2f"},{v:ST.thr.b,nm:"تأهّب",color:"#b46f4b"},{v:ST.thr.c,nm:"إنذار",color:"#b8503f"}]
    })+'</div>'
    +'<div class="legend">'
    +'<span><i style="background:#155b75"></i>وسيط الأعضاء المُتتبَّعة</span>'
    +'<span><i style="background:#4d7c5a"></i>GloFAS مباشرة عند حلفا</span>'
    +'<span><i style="background:#b46f4b"></i>سيناريو '+esc(scenObj().nm)+'</span>'
    +'<span><i style="background:#247ba0;opacity:.4"></i>٢٥–٧٥٪</span>'
    +'<span><i style="background:#247ba0;opacity:.25"></i>١٠–٩٠٪</span>'
    +'</div>');

  var rows="";
  STATIONS.forEach(function(S){
    if(!S.key) return;
    var d=ST.q[S.id]; if(!d) return;
    var v=d.q[k], v7=d.q[Math.min(d.q.length-1,k+7)];
    var dl=(v&&v7)?((v7-v)/v*100):0, cg=cellReliability(S.id);
    rows+='<tr><td><b>'+esc(S.nm)+'</b><div style="font-size:9.5px;color:var(--muted)">'+esc(S.sub)+'</div></td>'
      +'<td class="num">'+nf(v,0)+'</td><td class="num">'+nf(v7,0)+'</td>'
      +'<td class="num" style="color:'+(dl>3?"#b8503f":(dl<-3?"#4d7c5a":"#66736f"))+'">'+(dl>0?"+":"")+nf(dl,1)+'%</td>'
      +'<td>'+conf(cg.grade)+' <span style="font-size:9.5px;color:var(--muted)">'+nf(cg.score,0)+'/100</span></td>'
      +'<td>'+(cg.calibrated? stampPill("corr") : stampPill("model"))+'</td></tr>';
  });
  s+=panel("المحطات المفتاحية","التصرف ومسار الأسبوع ودرجة ثقة الخلية",
    '<div class="tb-wrap"><table class="tb"><thead><tr><th>المحطة</th><th>اليوم</th><th>+٧ أيام</th>'
    +'<th>الاتجاه</th><th>ثقة الخلية</th><th>مصدر الرقم</th></tr></thead><tbody>'+rows+'</tbody></table></div>',
    'موثوقية الخلية مؤشر مركّب لا مسافة وحدها: القرب المكانى ٤٠٪ + الارتباط مع المحطة التالية على المجرى ٤٠٪ (يكشف الخلية على فرع خاطئ) + معقولية الحجم ٢٠٪. التفصيل فى قسم «القياس والثقة».');
  return s;
}


/* ---- 2. بصمة الفيضان ---- */
function secFinger(){
  if(!ST.q) return panel("بصمة الفيضان","جارٍ التحميل", skel(5));
  var k=nowIdx();
  if(ST.fingerDay===null||ST.fingerDay===undefined) ST.fingerDay=k;
  var s=panel("بصمة الفيضان الحية","التصرف عند كل محطة وكل يوم — اللون منسوب لمدى المحطة نفسها",
    '<div class="chart-box">'+fingerprintSVG()+'</div>'+fingerLegend(),
    'كل عمود محطة وكل صف يوم. التطبيع ذاتى لكل محطة حتى لا يطغى المجرى الرئيسى على الروافد؛ الخط المتقطّع الأزرق يصل ذروات المحطات فيُظهر <b>انحدار انتقال الموجة</b> — كلما مال الخط زاد زمن العبور.');

  s+=panel("مقطع النهر عند تاريخ محدد","السمك = التصرف · الهالة = مدى عدم اليقين",
    '<div class="ctrl"><label>التاريخ:</label>'
    +'<input type="range" min="0" max="'+(ST.q.eldiem.t.length-1)+'" value="'+ST.fingerDay+'" id="fday">'
    +'<span class="pill lake" style="direction:ltr">'+esc(ST.q.eldiem.t[ST.fingerDay])+'</span>'
    +'<button class="btn mini" id="fday-now">اليوم</button></div>'
    +'<div class="chart-box">'+riverAtDaySVG(ST.fingerDay)+'</div>');

  var rows="", arr=[];
  AXIS_STATIONS.forEach(function(id){
    var d=ST.q[id]; if(!d) return;
    var pi=-1,pv=-1e18,i;
    for(i=k;i<d.q.length;i++) if(d.q[i]!==null&&!isNaN(d.q[i])&&d.q[i]>pv){pv=d.q[i];pi=i;}
    arr.push({id:id, pi:pi, pv:pv, t:pi>=0?d.t[pi]:null});
  });
  arr.forEach(function(a,i){
    var lag = (i>0 && arr[i-1].pi>=0 && a.pi>=0)? (a.pi-arr[i-1].pi) : null;
    rows+='<tr><td><b>'+esc(stn(a.id).nm)+'</b></td><td class="num">'+nf(a.pv,0)+'</td>'
      +'<td class="num" style="direction:ltr">'+esc(a.t||"—")+'</td>'
      +'<td class="num">'+(a.pi>=0?nf(a.pi-k,0):"—")+'</td>'
      +'<td class="num">'+(lag===null?"—":nf(lag,0))+'</td></tr>';
  });
  s+=panel("موعد وصول الذروة لكل محطة","من الأقصى داخل نافذة التنبؤ",
    '<div class="tb-wrap"><table class="tb"><thead><tr><th>المحطة</th><th>الأقصى (م³/ث)</th>'
    +'<th>تاريخه</th><th>بعد كم يوم</th><th>الإزاحة عن السابقة</th></tr></thead><tbody>'+rows+'</tbody></table></div>',
    'إذا وقع الأقصى على آخر يوم فى النافذة فالموجة ما زالت صاعدة ولم تبلغ ذروتها بعد — الرقم حينئذ حدّ أدنى لا ذروة.');
  return s;
}

/* ---- 3. المروحة الاحتمالية ---- */
function secEnsemble(){
  if(!ST.q) return panel("المروحة","جارٍ التحميل", skel(5));
  if(!ST.mem) return panel("المروحة الاحتمالية","أعضاء التنبؤ غير محمّلة",
    '<div class="actions"><button class="btn solid" id="mem-load">⟳ تحميل الـ'+NMEM+' عضواً</button></div>',
    'كل عضو يُمرَّر عبر ماسكينجم من الديم حتى وادى حلفا، فتخرج المروحة من التتبّع نفسه لا من GloFAS الخام.');
  var ens=runEnsemble();
  if(!ens) return panel("المروحة","تعذّر الحساب","");
  var k=nowIdx(), t=ens.t;

  var s=scenBar()+scenarioNote();
  s+=panel("المروحة عند وادى حلفا", ens.n+" عضواً مُمرَّراً عبر ماسكينجم",
    '<div class="chart-box">'+plot({
      t:t, nowIdx:k, yTitle:"التصرف (م³/ث)",
      bands:[{lo:ens.mn,hi:ens.mx,color:"#247ba0",op:0.10},
             {lo:ens.p10,hi:ens.p90,color:"#247ba0",op:0.18},
             {lo:ens.p25,hi:ens.p75,color:"#247ba0",op:0.26}],
      series:[{v:ens.p50,color:"#155b75",wd:2.4},{v:ST.q.halfa.q,color:"#4d7c5a",wd:1.5,dash:"5 4"}],
      hlines:[{v:ST.thr.b,nm:"تأهّب",color:"#b46f4b"},{v:ST.thr.c,nm:"إنذار",color:"#b8503f"}]
    })+'</div>'
    +'<div class="legend"><span><i style="background:#155b75"></i>الوسيط المُتتبَّع</span>'
    +'<span><i style="background:#4d7c5a"></i>GloFAS عند حلفا (مرجع)</span>'
    +'<span><i style="background:#247ba0;opacity:.4"></i>٢٥–٧٥٪</span>'
    +'<span><i style="background:#247ba0;opacity:.25"></i>١٠–٩٠٪</span>'
    +'<span><i style="background:#247ba0;opacity:.15"></i>أدنى–أقصى</span></div>');

  /* توزيع الذروة */
  var pk=ens.peaks.slice().sort(function(a,b){return a-b;});
  var bestI=0,worstI=0,i;
  for(i=0;i<ens.n;i++){ if(ens.peaks[i]<ens.peaks[bestI]) bestI=i; if(ens.peaks[i]>ens.peaks[worstI]) worstI=i; }
  s+='<div class="grid g4" style="margin-top:15px">'
    +kpi("▼","green","أفضل سيناريو (أدنى عضو)", nf(pk[0],0),"م³/ث","العضو "+(bestI+1))
    +kpi("≡","","الوسيط", nf(quantile(pk,0.5),0),"م³/ث","الذروة المتوقعة")
    +kpi("▲","sand","المئين ٩٠", nf(quantile(pk,0.90),0),"م³/ث","عُشر الأعضاء أعلى منه")
    +kpi("⚠","danger","أسوأ سيناريو (أقصى عضو)", nf(pk[pk.length-1],0),"م³/ث","العضو "+(worstI+1))
    +'</div>';

  /* مدرّج تاريخ الذروة */
  var lab=[],val=[],map={};
  ens.pkDates.forEach(function(d){ map[d]=(map[d]||0)+1; });
  var keys=Object.keys(map).map(Number).sort(function(a,b){return a-b;});
  keys.forEach(function(d){ lab.push(dmy(t[d])); val.push(map[d]); });
  s+=panel("توزيع تاريخ الذروة","كم عضواً يضع الذروة فى كل يوم",
    '<div class="chart-box">'+histSVG(val,lab,"#b46f4b")+'</div>',
    'تركّز الأعمدة يعنى اتفاق الأعضاء على توقيت الذروة؛ تشتّتها يعنى أن توقيت الوصول نفسه غير مؤكد وليس الحجم فقط.');

  /* جدول العتبات */
  var rows="";
  [["a","متابعة"],["b","تأهّب"],["c","إنذار"]].forEach(function(p){
    var stt=ensembleThresholdStats(ens, ST.thr[p[0]]);
    var c=stt.prob>=60?"#b8503f":(stt.prob>=25?"#c58a2f":"#4d7c5a");
    rows+='<tr><td><b>'+p[1]+'</b> — '+nf(ST.thr[p[0]],0)+'</td>'
      +'<td class="num" style="color:'+c+';font-weight:700">'+nf(stt.prob,0)+'%</td>'
      +'<td class="num">'+(stt.firstMed!==null?nf(stt.firstMed,0):"—")+'</td>'
      +'<td class="num">'+(stt.firstMin!==null?(nf(stt.firstMin,0)+"–"+nf(stt.firstMax,0)):"—")+'</td>'
      +'<td class="num">'+nf(stt.volMed,0)+'</td><td class="num">'+nf(stt.durMed,0)+'</td></tr>';
  });
  s+=panel("ما وراء الاحتمال","حجم المياه فوق العتبة ومدة البقاء فوقها",
    '<div class="tb-wrap"><table class="tb"><thead><tr><th>العتبة (م³/ث)</th><th>احتمال التجاوز</th>'
    +'<th>زمن الوصول (يوم)</th><th>مداه</th><th>الحجم فوقها (مليون م³)</th><th>المدة (يوم)</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div>',
    'الاحتمال وحده لا يكفى للقرار: تجاوز بيوم واحد و٢٠ مليون م³ غير تجاوز بعشرة أيام و٦٠٠ مليون م³، وإن تساوى الاحتمالان.');
  return s;
}

/* ---- 4. التراكب الكمى ---- */
function secCompose(){
  if(!ST.q) return panel("التراكب","جارٍ التحميل", skel(4));
  var rt=runRouting(); if(!rt) return panel("التراكب","تعذّر الحساب","");
  var k=nowIdx();
  var b=rt.comp.blue[k], w=rt.comp.white[k], a=rt.comp.atbara[k];
  var modelTot=rt.atHalfa[k], obs=rt.obsHalfa? rt.obsHalfa[k] : null;
  var rawAligned=rt.alignedIn[k];
  var storage = (rawAligned!==null && modelTot!==null)? (rawAligned-modelTot) : null;
  var gap = (obs!==null && modelTot!==null)? (obs-modelTot) : null;

  function trend(series){
    var v=series[k], v7=series[Math.min(series.length-1,k+7)];
    if(!v||!v7) return "—";
    var r=(v7-v)/v*100;
    return r>10?"صاعد حادّ":(r>3?"صاعد":(r<-10?"هابط حادّ":(r<-3?"هابط":"مستقر")));
  }
  var items=[
    {nm:"النيل الأزرق", v:b||0, c:"#247ba0"},
    {nm:"النيل الأبيض", v:w||0, c:"#4d7c5a"},
    {nm:"عطبرة",       v:a||0, c:"#b46f4b"}
  ];
  var tot=(b||0)+(w||0)+(a||0);

  var s=scenBar();
  s+=panel("تركيب الوارد لبحيرة ناصر اليوم","تفكيك مطابق — ماسكينجم خطى فتنطبق قاعدة التراكب",
    '<div class="chart-box" style="padding:4px">'+stackBarSVG(items, tot)+'</div>');

  var rows=
    '<tr><td><b>النيل الأزرق</b> (عبر ٤ مقاطع)</td><td class="num">'+nf(b,0)+'</td><td class="num">'+nf(tot>0?b/tot*100:0,1)+'%</td><td>'+esc(trend(rt.comp.blue))+'</td></tr>'
   +'<tr><td><b>النيل الأبيض</b> (عبر ٣ مقاطع)</td><td class="num">'+nf(w,0)+'</td><td class="num">'+nf(tot>0?w/tot*100:0,1)+'%</td><td>'+esc(trend(rt.comp.white))+'</td></tr>'
   +'<tr><td><b>نهر عطبرة</b> (عبر مقطعين — من الملتقى)</td><td class="num">'+nf(a,0)+'</td><td class="num">'+nf(tot>0?a/tot*100:0,1)+'%</td><td>'+esc(trend(rt.comp.atbara))+'</td></tr>'
   +'<tr class="hi"><td><b>مجموع النموذج عند حلفا</b></td><td class="num">'+nf(modelTot,0)+'</td><td class="num">100%</td><td>'+esc(trend(rt.atHalfa))+'</td></tr>'
   +'<tr><td>أثر التخزين بالمجرى (استنفاد)</td><td class="num">'+(storage!==null?("−"+nf(Math.abs(storage),0)):"—")+'</td>'
     +'<td class="num">'+(storage!==null&&rawAligned?nf(-Math.abs(storage)/rawAligned*100,1)+"%":"—")+'</td><td>مقابل الوارد المُزاح زمنياً</td></tr>'
   +'<tr><td>عدم انغلاق النموذج (مقابل GloFAS)</td><td class="num">'+(gap!==null?((gap>0?"+":"")+nf(gap,0)):"—")+'</td>'
     +'<td class="num">'+(gap!==null&&obs?((gap>0?"+":"")+nf(gap/obs*100,1)+"%"):"—")+'</td><td>مؤشر جودة لا مصدر مياه</td></tr>';

  s+=panel("لماذا تغيّر الوارد؟","المساهمة الكمية لكل مكوّن",
    '<div class="tb-wrap"><table class="tb"><thead><tr><th>المكوّن</th><th>التصرف (م³/ث)</th>'
    +'<th>المساهمة</th><th>الاتجاه</th></tr></thead><tbody>'+rows+'</tbody></table></div>',
    'التفكيك مطابق رياضياً لأن ماسكينجم عامل خطى: تتبّع (أ+ب) = تتبّع(أ) + تتبّع(ب). لذلك مجموع المكوّنات الثلاثة يساوى ناتج النموذج بالضبط دون بواقٍ.');

  var residPct = rt.volInRaw? (rt.volResid/rt.volInRaw*100) : null;
  s+=panel("الاتزان الحجمى للنافذة","V_in − V_out = ΔS + الفواقد",
    '<div class="grid g4">'
    +kpi("∑","","حجم الوارد الخام", nf(rt.volInRaw,0),"مليون م³","الديم + الأبيض + عطبرة")
    +kpi("∑","green","حجم الخارج عند حلفا", nf(rt.volOut,0),"مليون م³","بعد التتبّع")
    +kpi("◱","sand","تغيّر التخزين ΔS", rt.dS!==null?((rt.dS>0?"+":"")+nf(rt.dS,0)):"—","مليون م³","داخل المقاطع الأربعة")
    +kpi("Δ", (residPct!==null&&Math.abs(residPct)>2)?"danger":"green","الباقى بعد ΔS",
        residPct!==null?nf(residPct,3):"—","%","يقارب الصفر بالبناء")
    +'</div>',
    'الاتزان الصحيح خلال نافذة محدودة ليس V_in − V_out بل <b>V_in − V_out − ΔS</b>: جزء من الموجة يظل مخزّناً داخل المقاطع عند نهاية النافذة. '
    + 'وΔS محسوب من صيغة ماسكينجم نفسها S = K·[x·I + (1−x)·O] مجموعةً على كل المقاطع الفرعية. '
    + 'الباقى بعد خصم ΔS هو مقياس حفظ الكتلة الحقيقى، وأى انحراف فيه خلل عددى لا فقد مادى.');
  return s;
}

/* ---- 5. الشبكة والاتزان ---- */
function secNetwork(){
  if(!ST.q) return panel("الشبكة","جارٍ التحميل", skel(5));
  var _k=netIdx(), _n0=nowIdx(), _len=(ST.q&&ST.q.eldiem? ST.q.eldiem.t.length-1 : 0);
  var toolbar='<div class="net-toolbar">'

/* ═════ صندوق «ماذا لو» — حقن اضطراب افتراضى وتتبّعه بماسكينجم المعايَر ═════ */
function wiModified(){
  var E=ST.q.eldiem.q.slice(), J=ST.q.jaulia.q.slice(), A=ST.q.atbara.q.slice();
  var tgt = (ST.wi.src==="jaulia")? J : (ST.wi.src==="atbara")? A : E;
  var n0=nowIdx(), st=Math.max(0, n0+(+ST.wi.start||0)), i, L=tgt.length;
  if(ST.wi.mode==="pulse"){
    var en=Math.min(L, st+Math.max(1,+ST.wi.dur||1));
    for(i=st;i<en;i++) if(tgt[i]!==null&&!isNaN(tgt[i])) tgt[i]+= (+ST.wi.dq||0);
  } else {
    var f=1+((+ST.wi.pct||0)/100);
    for(i=st;i<L;i++) if(tgt[i]!==null&&!isNaN(tgt[i])) tgt[i]*=f;
  }
  return {E:E,J:J,A:A,startIdx:st};
}
function wiCompute(){
  if(!ST.q) return null;
  var base=routeSystem(ST.q.eldiem.q, ST.q.jaulia.q, ST.q.atbara.q, ST.reaches);
  var M=wiModified();
  var scn=routeSystem(M.E, M.J, M.A, ST.reaches);
  var t=ST.q.eldiem.t, n0=nowIdx(), i;
  function pk(arr){ var bi=-1,bv=-1e18; for(i=n0;i<arr.length;i++){ var v=arr[i];
    if(v!==null&&!isNaN(v)&&v>bv){bv=v;bi=i;} } return {v:bv,i:bi}; }
  function firstX(arr,thr){ if(thr===null||thr===undefined) return null;
    for(i=n0;i<arr.length;i++){ var v=arr[i]; if(v!==null&&!isNaN(v)&&v>=thr) return i; } return null; }
  var pb=pk(base.halfa), ps=pk(scn.halfa);
  var dmax=-1e18, di=-1;
  for(i=n0;i<base.halfa.length;i++){ var d=(scn.halfa[i]||0)-(base.halfa[i]||0);
    if(d>dmax){dmax=d;di=i;} }
  var thrB=ST.thr?ST.thr.b:null, thrC=ST.thr?ST.thr.c:null;
  return { t:t, n0:n0, base:base, scn:scn,
    pkB:pb, pkS:ps, dPk:ps.v-pb.v, dPkPct:(pb.v>0?(ps.v-pb.v)/pb.v*100:null),
    arrIdx:di, arrGain:dmax,
    xbB:firstX(base.halfa,thrB), xbS:firstX(scn.halfa,thrB),
    xcB:firstX(base.halfa,thrC), xcS:firstX(scn.halfa,thrC),
    dAt:{ atbara: pk(scn.atConf).v-pk(base.atConf).v,
          dongola: pk(scn.dongola).v-pk(base.dongola).v } };
}
function wiPlot(R){
  var w=680,h=300,mL=58,mR=14,mT=16,mB=34;
  var a=Math.max(0,R.n0-7), b=R.t.length-1, i;
  var lo=1e18,hi=-1e18;
  function scan(arr){ for(i=a;i<=b;i++){ var v=arr[i]; if(v!==null&&!isNaN(v)){ if(v<lo)lo=v; if(v>hi)hi=v; } } }
  scan(R.base.halfa); scan(R.scn.halfa);
  if(ST.thr){ if(ST.thr.b<lo)lo=ST.thr.b; if(ST.thr.c>hi)hi=ST.thr.c; }
  var pad=(hi-lo)*0.08||1; lo=Math.max(0,lo-pad); hi+=pad;
  function X(k){ return mL+(k-a)/(b-a||1)*(w-mL-mR); }
  function Y(v){ return mT+(1-(v-lo)/(hi-lo))*(h-mT-mB); }
  function path(arr){ var d="",on=false;
    for(i=a;i<=b;i++){ var v=arr[i];
      if(v===null||isNaN(v)){on=false;continue;}
      d+=(on?" L ":"M ")+X(i).toFixed(1)+" "+Y(v).toFixed(1); on=true; } return d; }
  var sv='<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet">'
    +'<rect width="'+w+'" height="'+h+'" fill="#fdfcf8"/>';
  var g; for(g=0;g<=4;g++){ var vv=lo+(hi-lo)*g/4, yy=Y(vv);
    sv+='<line x1="'+mL+'" y1="'+yy.toFixed(1)+'" x2="'+(w-mR)+'" y2="'+yy.toFixed(1)+'" stroke="#eee8da"/>'
      +'<text class="axis-num" x="'+(mL-6)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end">'+nf(vv,0)+'</text>'; }
  if(ST.thr){
    sv+='<line x1="'+mL+'" x2="'+(w-mR)+'" y1="'+Y(ST.thr.b).toFixed(1)+'" y2="'+Y(ST.thr.b).toFixed(1)+'" stroke="#b46f4b" stroke-dasharray="6 4"/>'
      +'<line x1="'+mL+'" x2="'+(w-mR)+'" y1="'+Y(ST.thr.c).toFixed(1)+'" y2="'+Y(ST.thr.c).toFixed(1)+'" stroke="#b8503f" stroke-dasharray="6 4"/>';
  }
  sv+='<line x1="'+X(R.n0).toFixed(1)+'" x2="'+X(R.n0).toFixed(1)+'" y1="'+mT+'" y2="'+(h-mB)+'" stroke="#c9a84c" stroke-width="1.5"/>'
    +'<text class="axis-num" x="'+X(R.n0).toFixed(1)+'" y="'+(h-mB+16)+'" text-anchor="middle">اليوم</text>';
  sv+='<path d="'+path(R.base.halfa)+'" fill="none" stroke="#155b75" stroke-width="2.4"/>'
    +'<path d="'+path(R.scn.halfa)+'" fill="none" stroke="#b8503f" stroke-width="2.4" stroke-dasharray="8 4"/>';
  sv+='</svg>';
  return sv;
}

function rwIdx(){ if(!ST.rain) return RAIN_PAST;
  /* الافتراضى: نهاية الأسبوع القادم — يطابق العرض القديم */
  var k=(ST.rw.day===null)? rainNowIdx()+7 : ST.rw.day;
  return Math.max(0, Math.min(ST.rain.t.length-1, k)); }
function rwWin(){ var k=rwIdx();
  return (ST.rw.mode===1)? {a:k,b:k} : {a:Math.max(0,k-6),b:k}; }
function rwApply(){
  if(!ST.rain) return;
  var W=rwWin(), i, j;
  for(i=0;i<RAIN_CELLS.length;i++){
    var e=$("rc-"+i); if(!e) continue;
    var p=ST.rain.P[i], sum=null;
    if(p){ sum=0; for(j=Math.max(0,W.a); j<=Math.min(p.length-1,W.b); j++)
      if(p[j]!==null&&!isNaN(p[j])) sum+=p[j]; }
    e.setAttribute("fill", rainColor(sum));
  }
  var lab=$("rw-daylab");
  if(lab){ var k=rwIdx(), n0=rainNowIdx();
    lab.textContent=(k===n0?"اليوم · ":"")+dmy(ST.rain.t[k])+(k>n0?" · تنبؤ +"+(k-n0)+"ي":(k<n0?" · قبل "+(n0-k)+"ي":""));
    lab.className="net-day"+(k>n0?" fut":""); }
}
function rwSpark(ci){
  var p=ST.rain.P[ci]; if(!p) return "";
  var n0=rainNowIdx(), W=252,H=54,P2=5, i, hi=1;
  for(i=0;i<p.length;i++) if(p[i]!==null&&!isNaN(p[i])&&p[i]>hi) hi=p[i];
  function X(i2){ return P2+i2/(p.length-1||1)*(W-2*P2); }
  function Y(v){ return H-P2-(v/hi)*(H-2*P2); }
  var bars="";
  for(i=0;i<p.length;i++){ var v=p[i]; if(v===null||isNaN(v)) continue;
    bars+='<rect x="'+(X(i)-2.4).toFixed(1)+'" y="'+Y(v).toFixed(1)+'" width="4.8" height="'+(H-P2-Y(v)).toFixed(1)
      +'" fill="'+(i>n0?"#b46f4b":"#247ba0")+'" opacity="'+(i===rwIdx()?"1":".55")+'"/>';
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:280px;height:54px">'+bars+'</svg>';
}

/* =====================================================================
   نموذج المطر ← تصرف (إحصائى) — يمدّ الأفق ويعطى إنذاراً مبكراً كمياً
   الفكرة: مؤشر المطر المتراكم بنضوب (API) على حوض النيل الأزرق يسبق تصرف
   الديم بأيام. نُعاير انحداراً خطياً Q(t+L) = a·Q(t) + b·API(t) + c
   على أرشيف حقيقى، ونختبره على **سنوات محجوبة لم تدخل المعايرة**،
   ونقارنه بمرجعين: الاستمرار (Q اليوم كما هو) والمناخيات (متوسط اليوم التقويمى).
   ولا يُعرض تنبؤ لأفق لم يتفوّق على المرجعين — لا رقم بلا مهارة مُثبَتة.
   ===================================================================== */
var ARCHIVE_API = "https://archive-api.open-meteo.com/v1/archive";
var RR_FROM = "2016-01-01", RR_DECAY = 0.90, RR_HOR = [7,14,21,30,45], RR_TEST_YEARS = 2;

function rrApiIndex(daily){
  var a=[], sacc=0, i;
  for(i=0;i<daily.length;i++){
    var v=(daily[i]===null||daily[i]===undefined||isNaN(daily[i]))?0:daily[i];
    sacc=sacc*RR_DECAY+v; a.push(sacc);
  }
  return a;
}
/* حلّ نظام ٣×٣ بالحذف الجاوسى — انحدار بمتغيّرين وثابت */
function rrSolve3(A, b){
  var i,j,k,n=3, M=[];
  for(i=0;i<n;i++){ M.push(A[i].slice()); M[i].push(b[i]); }
  for(i=0;i<n;i++){
    var p=i;
    for(j=i+1;j<n;j++) if(Math.abs(M[j][i])>Math.abs(M[p][i])) p=j;
    if(Math.abs(M[p][i])<1e-12) return null;
    var tmp=M[i]; M[i]=M[p]; M[p]=tmp;
    for(j=i+1;j<n;j++){
      var f=M[j][i]/M[i][i];
      for(k=i;k<=n;k++) M[j][k]-=f*M[i][k];
    }
  }
  var x=[0,0,0];
  for(i=n-1;i>=0;i--){
    var sm=M[i][n];
    for(j=i+1;j<n;j++) sm-=M[i][j]*x[j];
    x[i]=sm/M[i][i];
  }
  return x;
}
function rrRegress(rows){
  /* rows: [{q,a,y}] → معاملات [a,b,c] */
  var S=[[0,0,0],[0,0,0],[0,0,0]], B=[0,0,0], i;
  for(i=0;i<rows.length;i++){
    var v=[rows[i].q, rows[i].a, 1], j, k;
    for(j=0;j<3;j++){
      for(k=0;k<3;k++) S[j][k]+=v[j]*v[k];
      B[j]+=v[j]*rows[i].y;
    }
  }
  return rrSolve3(S,B);
}
function rrRmse(pred, obs){
  var s=0,n=0,i;
  for(i=0;i<obs.length;i++){ var d=pred[i]-obs[i]; s+=d*d; n++; }
  return n? Math.sqrt(s/n) : null;
}
function rrFit(){
  var cells=basinCells("blue");
  if(!cells.length){ netErr("لا خلايا مطر", new Error("حوض الأزرق فارغ")); return Promise.resolve(null); }
  var lats=[], lons=[], i;
  for(i=0;i<cells.length;i++){ lats.push(cells[i].lat); lons.push(cells[i].lon); }
  var to=new Date(Date.now()-3*864e5).toISOString().slice(0,10);
  ST.rr.busy=true; ST.rr.err=""; render();
  var uR=ARCHIVE_API+"?latitude="+lats.join(",")+"&longitude="+lons.join(",")
    +"&daily=precipitation_sum&start_date="+RR_FROM+"&end_date="+to+"&timezone=UTC";
  var st=stn("eldiem");
  var uQ=FLOOD_API+"?latitude="+st.lat+"&longitude="+st.lon
    +"&daily=river_discharge&start_date="+RR_FROM+"&end_date="+to;
  var RA=null;
  return getJSON(uR,"تعذّر جلب أرشيف المطر").then(function(a){
    var list=(a&&a.length!==undefined)?a:[a], j, n=null, T=null, acc=null, ws=0;
    for(j=0;j<list.length;j++){
      var d=list[j]; if(!d||!d.daily) continue;
      if(!T){ T=d.daily.time; n=T.length; acc=[]; for(i=0;i<n;i++) acc.push(0); }
      var p=d.daily.precipitation_sum, w=cells[j]?cells[j].w:1;
      for(i=0;i<n;i++){ var v=p[i]; if(v===null||v===undefined||isNaN(v)) v=0; acc[i]+=v*w; }
      ws+=w;
    }
    if(!T||!ws) throw new Error("أرشيف المطر فارغ");
    for(i=0;i<acc.length;i++) acc[i]/=ws;
    RA={ t:T, r:acc };
    return getJSON(uQ,"تعذّر جلب أرشيف تصرف الديم");
  }).then(function(a){
    var d=(a&&a.length!==undefined)?a[0]:a;
    if(!d||!d.daily) throw new Error("أرشيف التصرف فارغ");
    var qm={}, i2;
    for(i2=0;i2<d.daily.time.length;i2++){
      var q=d.daily.river_discharge[i2];
      if(q!==null&&!isNaN(q)) qm[d.daily.time[i2]]=q;
    }
    var A=rrApiIndex(RA.r), T=RA.t;
    /* إسقاط أول ٦٠ يوماً — تسخين مؤشر النضوب */
    var yrs={}, k;
    for(k=0;k<T.length;k++) yrs[T[k].slice(0,4)]=1;
    var years=Object.keys(yrs).sort();
    var cut=years[Math.max(0, years.length-RR_TEST_YEARS)];
    var res=[], hi;
    for(hi=0;hi<RR_HOR.length;hi++){
      var L=RR_HOR[hi], tr=[], teQ=[], teA=[], teY=[], teD=[], climAcc={}, climN={};
      for(k=60;k+L<T.length;k++){
        var q0=qm[T[k]], y=qm[T[k+L]];
        if(q0===undefined||y===undefined) continue;
        var row={ q:q0, a:A[k], y:y };
        var doy=T[k+L].slice(5);
        if(T[k]<cut+"-01-01"){
          tr.push(row);
          climAcc[doy]=(climAcc[doy]||0)+y; climN[doy]=(climN[doy]||0)+1;
        } else { teQ.push(q0); teA.push(A[k]); teY.push(y); teD.push(doy); }
      }
      if(tr.length<300||teY.length<60){ res.push({L:L, ok:false, reason:"عيّنة غير كافية"}); continue; }
      var co=rrRegress(tr);
      if(!co){ res.push({L:L, ok:false, reason:"تعذّر الحلّ"}); continue; }
      /* الاستمرار: انحدار على Q وحده من نفس بيانات التدريب */
      var sq=0,sy=0,sqq=0,sqy=0,i3;
      for(i3=0;i3<tr.length;i3++){ sq+=tr[i3].q; sy+=tr[i3].y; sqq+=tr[i3].q*tr[i3].q; sqy+=tr[i3].q*tr[i3].y; }
      var den=tr.length*sqq-sq*sq;
      var pa=den?((tr.length*sqy-sq*sy)/den):0, pb=(sy-pa*sq)/tr.length;
      var gm=sy/tr.length;
      var pM=[], pP=[], pC=[];
      for(i3=0;i3<teY.length;i3++){
        pM.push(co[0]*teQ[i3]+co[1]*teA[i3]+co[2]);
        pP.push(pa*teQ[i3]+pb);
        pC.push(climN[teD[i3]]? climAcc[teD[i3]]/climN[teD[i3]] : gm);
      }
      var rM=rrRmse(pM,teY), rP=rrRmse(pP,teY), rC=rrRmse(pC,teY);
      res.push({ L:L, ok:true, co:co, rmse:rM, rmsePers:rP, rmseClim:rC,
        gainPers:(rP-rM)/rP*100, gainClim:(rC-rM)/rC*100,
        nTrain:tr.length, nTest:teY.length,
        skill:(rM<rP && rM<rC) });
    }
    ST.rr.fit={ at:Date.now(), from:RR_FROM, to:to, cells:cells.length,
      testFrom:cut+"-01-01", res:res };
    ST.rr.busy=false;
    auditLog("معايرة نموذج المطر←تصرف", cells.length+" خلية · اختبار من "+cut);
    render(); return ST.rr.fit;
  }).catch(function(e){
    ST.rr.busy=false; ST.rr.err=e.message||String(e);
    netErr("تعذّرت معايرة نموذج المطر", e); render(); return null;
  });
}
/* مؤشر المطر الحى لحوض الأزرق — يشمل أيام التنبؤ */
function rrLiveIndex(){
  if(!ST.rain||!ST.rain.t) return null;
  var d=[], i;
  for(i=0;i<ST.rain.t.length;i++){
    var m=arealMean("blue", i, i);
    d.push(m===null?0:m);
  }
  return { t:ST.rain.t, a:rrApiIndex(d) };
}
function rrPredict(){
  var F=ST.rr.fit; if(!F||!ST.q||!ST.q.eldiem) return null;
  var LI=rrLiveIndex(); if(!LI) return null;
  var k=rainNowIdx(), q0=cur("eldiem");
  if(q0===null||k>=LI.a.length) return null;
  var out=[], i;
  for(i=0;i<F.res.length;i++){
    var r=F.res[i];
    if(!r.ok||!r.skill){ out.push({L:r.L, ok:false, reason:r.ok?"لا مهارة مُثبَتة":r.reason}); continue; }
    var v=r.co[0]*q0+r.co[1]*LI.a[k]+r.co[2];
    var dt=new Date(Date.now()+r.L*864e5).toISOString().slice(0,10);
    out.push({ L:r.L, ok:true, v:(v<0?0:v), date:dt, rmse:r.rmse, gain:r.gainClim });
  }
  return { q0:q0, api:LI.a[k], rows:out };
}

  if(!F) return head+panel("لم يُعاير بعد","اضغط الزر أعلاه",

  var rows="", i;
  for(i=0;i<F.res.length;i++){
    var r=F.res[i];
    if(!r.ok){ rows+='<tr><td><b>+'+r.L+' يوماً</b></td><td colspan="6" style="color:var(--muted)">'+esc(r.reason)+'</td></tr>'; continue; }
    rows+='<tr><td><b>+'+r.L+' يوماً</b></td>'
      +'<td class="num">'+nf(r.rmseClim,0)+'</td>'
      +'<td class="num">'+nf(r.rmsePers,0)+'</td>'
      +'<td class="num"><b>'+nf(r.rmse,0)+'</b></td>'
      +'<td class="num" style="color:'+(r.gainPers>0?"#4d7c5a":"#b8503f")+'">'+(r.gainPers>0?"+":"")+nf(r.gainPers,0)+'٪</td>'

  if(!D) return s+panel("لم يُحسب بعد","اضغط زر الحساب أعلاه",

    +' لكل فترة خلال آخر ~١٦٠ يوماً، عند عتبتين لبناء نطاق عدم اليقين. قد يستغرق نصف دقيقة.</p>');

  var C=sarChange(sel), AG=sarAgreement(sel);
  s+='<div class="grid g4">'
    + kpi("◎","","المساحة المائية الآن", nf(C.kmNow,0),"كم²","بالعتبة "+D.th+" dB — تقديرى")
    + kpi("~","sand","بالعتبة البديلة", nf(C.kmNowAlt,0),"كم²","بالعتبة "+D.thAlt+" dB — مدى عدم اليقين")
    + kpi("Δ", (C.main>5?"danger":(C.main<-5?"sand":"green")),"التغيّر منذ "+esc(C.from),
        (C.main>0?"+":"")+nf(C.main,1),"%","بالعتبة البديلة "+(C.alt>0?"+":"")+nf(C.alt,1)+"%")
    + kpi("✓", AG? AG.level.c : "", "درجة تأكيد القمر", AG? AG.level.g : "—","",
        AG? ("ارتباط "+nf(AG.r,3)+" مع "+(stn(AG.ref)?stn(AG.ref).nm:AG.ref)+" · "+AG.n+" نقطة") : "لا نقاط متطابقة كافية")
    + '</div>';

  if(C.conflict){
    s+='<div class="banner danger"><span>⚠</span><div><b>العتبتان تختلفان فى إشارة التغيّر</b> ('
      +(C.main>0?"+":"")+nf(C.main,1)+'٪ مقابل '+(C.alt>0?"+":"")+nf(C.alt,1)+'٪). '
      +'فى هذه الحالة <b>لا يُعتدّ بالتغيّر إطلاقاً</b> — الإشارة داخل ضوضاء العتبة، '
      +'والسبب غالباً رياح خشّنت سطح الماء أو رطوبة تربة غيّرت ارتداد اليابسة. أعد الحساب بعد المرور التالى.</div></div>';
  }

  if(C.conflict){
    s+='<div class="banner danger"><span>⚠</span><div><b>العتبتان تختلفان فى إشارة التغيّر</b> '
      +'('+nf(C.main,1)+'٪ مقابل '+nf(C.alt,1)+'٪) — لا يُعتدّ بهذا التغيّر ولا يُستشهد به. '
      +'السبب الغالب أن نسبة المياه قريبة من حدّ الكشف فى هذا النطاق، أو أن الرياح خشّنت السطح فى إحدى الفترات.</div></div>';
  }
  if(AG){
    if(AG.regulated){
      s+='<div class="banner info"><span>ℹ</span><div><b>اختبار التأكيد لا ينطبق على هذا النطاق.</b> '
        +'مساحة بحيرة ناصر تحكمها <b>قرارات تشغيل السد العالى</b> (سحب للرى ثم إعادة ملء) لا الوارد اللحظى عند وادى حلفا، '
        +'فالارتباط المحسوب هنا ('+nf(AG.r,3)+' على '+AG.n+' نقطة) <b>سالب بطبيعته وهذا صحيح فيزيائياً لا خطأ</b>: '
        +'البحيرة تنحسر فى الربيع للرى بينما الوارد يتصاعد. '
        +'قراءة هذا النطاق تكون كمؤشر تخزين لا كتحقق من الموجة.</div></div>';
    } else {
      s+='<div class="banner '+(AG.level.c==="green"?"ok":(AG.level.c==="danger"?"danger":"warn"))+'">'
        +'<span>'+(AG.level.c==="green"?"✓":"⚠")+'</span><div>'
        +'GloFAS يعطى عند '+esc(stn(A.ref)?stn(A.ref).nm:A.ref)+' تصرفاً قدره '+nf(cur(A.ref),0)+' م³/ث، '
        +'وأظهرت Sentinel-1 تغيّراً فى المسطح المائى قدره '+(C.main>0?"+":"")+nf(C.main,1)+'٪ منذ '+esc(C.from)+'. '
        +'درجة تأكيد القمر: <b>'+esc(AG.level.g)+'</b> — معامل ارتباط '+nf(AG.r,3)+' على '+AG.n+' نقطة زمنية '
        +'مع أرشيف تصرف نفس النافذة. <b>هذا تحقق مستقل تماماً</b>: مصدر الرادار لا علاقة له بنموذج GloFAS.'
        +'</div></div>';
    }
  }

  /* الرسم: سلسلتا العتبة + التصرف المرجعى */
  var tt=D.main.map(function(x){ return x.t; });
  var v1=D.main.map(function(x){ return x.f*D.area; });
  var v2=D.alt.map(function(x){ return x.f*D.area; });
  s+=panel("المساحة المائية عبر الزمن","العتبتان معاً كنطاق عدم يقين",
    '<div class="chart-box">'+plot({ t:tt, yTitle:"كم²", zero:false,
      bands:[{lo:v2, hi:v1, color:"#247ba0", op:0.22}],
      series:[{v:v1,color:"#155b75",wd:2.4},{v:v2,color:"#5fa3c4",wd:1.6,dash:"5 4"}] })+'</div>'
    +'<div class="legend">'
    +'<span><i style="background:#155b75"></i>عتبة '+D.th+' dB</span>'
    +'<span><i style="background:#5fa3c4"></i>عتبة '+D.thAlt+' dB</span>'
    +'<span><i style="background:#247ba0;opacity:.4"></i>المدى بين العتبتين</span></div>',
    'اتساع النطاق بين المنحنيين هو <b>عدم اليقين الحقيقى</b> فى الرقم المطلق. '
    +'ما يُعتدّ به هو تطابق <b>شكل</b> المنحنيين واتجاههما، لا تطابق قيمتيهما.');

  /* جدول الفترات */
  var rows="", i;
  for(i=0;i<D.main.length;i++){
    var f1=D.main[i].f, f2=(D.alt[i]?D.alt[i].f:null);
    var d1=(i>0 && D.main[i-1].f>0)? (f1-D.main[i-1].f)/D.main[i-1].f*100 : null;
    var qv=null, j;
    if(ST.q && ST.q[A.ref]) for(j=0;j<ST.q[A.ref].t.length;j++) if(ST.q[A.ref].t[j]===D.main[i].t) qv=ST.q[A.ref].q[j];
    rows+='<tr><td class="num" style="direction:ltr">'+esc(D.main[i].t)+'</td>'
      +'<td class="num">'+nf(f1*D.area,0)+'</td>'
      +'<td class="num">'+(f2!==null?nf(f2*D.area,0):"—")+'</td>'
      +'<td class="num" style="color:'+(d1!==null&&d1>2?"#b8503f":(d1!==null&&d1<-2?"#4d7c5a":"#66736f"))+'">'
      +(d1===null?"—":((d1>0?"+":"")+nf(d1,1)+"%"))+'</td>'
      +'<td class="num">'+(qv!==null?nf(qv,0):"—")+'</td></tr>';
  }
  s+=panel("الفترات","كل فترة "+SAR_INTERVAL.replace("P","").replace("D"," أيام")+" مقابل تصرف المحطة المرجعية",
    '<div class="tb-wrap"><table class="tb"><thead><tr><th>بداية الفترة</th><th>مساحة ('+D.th+'dB)</th>'
    +'<th>مساحة ('+D.thAlt+'dB)</th><th>التغيّر</th><th>تصرف '+esc(stn(A.ref)?stn(A.ref).nm:A.ref)+' (م³/ث)</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div>');

  /* المشاهد */
  var srows="";
  (D.scenes||[]).slice(0,10).forEach(function(x){
    srows+='<tr><td class="num" style="direction:ltr">'+esc(x.t)+'</td>'
      +'<td>'+esc(x.orbit==="ascending"?"صاعد":(x.orbit==="descending"?"هابط":x.orbit))+'</td>'
      +'<td>'+esc(x.mode)+'</td></tr>';
  });
  s+=panel("آخر مرور للقمر","من فهرس Copernicus — Sentinel-1 لا يتأثر بالسحب",
    srows? ('<div class="tb-wrap"><table class="tb"><thead><tr><th>وقت المرور (UTC)</th><th>المدار</th>'
      +'<th>النمط</th></tr></thead><tbody>'+srows+'</tbody></table></div>')
      : '<p class="note">لا مشاهد فى الفهرس.</p>',
    'تكرار المرور ١٢ يوماً لكل اتجاه مدار. عدد المشاهد وتواريخها هى مؤشر الجودة هنا — '
    +'لا يوجد «غطاء سحابى» لأن الرادار يخترق السحب ويعمل ليلاً.');

  s+=panel("حدود هذه الطبقة","اقرأها قبل أى استشهاد",
    '<div class="tb-wrap"><table class="tb"><tbody>'
    +'<tr><td style="width:30%"><b>إيجابية كاذبة</b></td><td>الرمل الأملس والسبخات تعطى ارتداداً منخفضاً كالمياه. لذلك النطاقات اختيرت حول المجارى والسهول الفيضية، والعتبة مضبوطة لكل نطاق.</td></tr>'
    +'<tr><td><b>سلبية كاذبة</b></td><td>الرياح تخشّن سطح الماء فترفع ارتداده فوق العتبة، فتنقص المساحة المقيسة دون أن تنقص المياه.</td></tr>'
    +'<tr><td><b>المجرى المحصور</b></td><td>بين دنقلا وحلفا النهر داخل واد ضيق، فزيادة كبيرة فى التصرف تعطى تغيّراً ضئيلاً فى العرض. لذلك <b>لا نطاق رصد على هذا القطاع</b> — الإشارة الصحيحة هناك منسوب السطح بالألتيمترى لا المساحة.</td></tr>'
    +'<tr><td><b>ما لا يُستنتج</b></td><td>لا يُستنتج تصرف ولا تخزين من المساحة وحدها. تقدير تخزين بحيرة ناصر يحتاج منسوباً ومنحنى منسوب/مساحة/حجم رسمياً — وهو مؤجَّل بقرارك.</td></tr>'
    +'</tbody></table></div>');
  return s;
}

/* ---- 8. المقارنة التاريخية ---- */
function secClim(){
  var opts="";
  STATIONS.forEach(function(S){ if(!S.key) return;
    opts+='<option value="'+S.id+'"'+(S.id===ST.climStation?" selected":"")+'>'+esc(S.nm)+'</option>'; });
  var ctrl='<div class="ctrl"><label>المحطة:</label><select id="cl-st">'+opts+'</select>'
    +'<button class="btn solid mini" id="cl-load"'+(ST.climLoading?" disabled":"")+'>⟳ تحميل أرشيف ٢٠٠٦–'+(new Date().getFullYear()-1)+'</button></div>';

  if(!ST.clim) return panel("المقارنة التاريخية","موقع الموسم الحالى من السنوات السابقة", ctrl,
    'يُجلب الأرشيف من إعادة تحليل GloFAS لنفس النافذة من كل سنة، ثم يُحسب الوسيط والمئينان ١٠ و٩٠ لكل يوم تقويمى. <b>هذا الأرشيف هو مصدر العتبات الافتراضية</b> — يُحمَّل تلقائياً لوادى حلفا عند الإقلاع.');
  var ys=Object.keys(ST.clim.years);
  if(ST.climLoading||!ys.length) return panel("المقارنة التاريخية","جارٍ تحميل الأرشيف",
    ctrl+'<p class="loading-note">تم تحميل '+ST.clim.done+' من '+ST.clim.total+' سنة…</p>'+skel(4));

  var d=ST.q[ST.clim.station], n=d?d.t.length:76, med=[],p10=[],p90=[],i,y;
  for(i=0;i<n;i++){
    var col=[];
    for(y=0;y<ys.length;y++){ var a=ST.clim.years[ys[y]];
      if(a&&a[i]!==null&&a[i]!==undefined&&!isNaN(a[i])) col.push(a[i]); }
    col.sort(function(p,q){return p-q;});
    med.push(col.length?quantile(col,0.5):null);
    p10.push(col.length?quantile(col,0.10):null);
    p90.push(col.length?quantile(col,0.90):null);
  }
  var k=nowIdx(), todayV=d?d.q[k]:null, tc=[];
  for(y=0;y<ys.length;y++){ var aa=ST.clim.years[ys[y]]; if(aa&&aa[k]!==null&&!isNaN(aa[k])) tc.push(aa[k]); }
  tc.sort(function(p,q){return p-q;});
  var rank=null;
  if(todayV!==null&&tc.length){ var c=0; for(i=0;i<tc.length;i++) if(tc[i]<=todayV) c++; rank=c/tc.length*100; }

  var s=panel("المقارنة التاريخية","الموسم الحالى مقابل مناخ "+ys.length+" سنة — "+(stn(ST.clim.station)?stn(ST.clim.station).nm:""),
    ctrl+'<div class="chart-box">'+plot({
      t:d.t, nowIdx:k, yTitle:"التصرف (م³/ث)",
      bands:[{lo:p10,hi:p90,color:"#4d7c5a",op:0.18}],
      series:[{v:med,color:"#4d7c5a",wd:2,dash:"6 4"},{v:d.q,color:"#b46f4b",wd:2.6,mark:k}]
    })+'</div>'
    +'<div class="legend"><span><i style="background:#b46f4b"></i>الموسم الحالى</span>'
    +'<span><i style="background:#4d7c5a"></i>الوسيط التاريخى</span>'
    +'<span><i style="background:#4d7c5a;opacity:.3"></i>المدى ١٠–٩٠٪</span></div>');

  s+='<div class="grid g3" style="margin-top:15px">'
    +kpi("◈", rank!==null&&rank>=75?"danger":(rank!==null&&rank<=25?"sand":"green"),
      "المئين التاريخى لليوم", rank!==null?nf(rank,0):"—","%",
      rank===null?"—":(rank>=75?"أعلى من ثلاثة أرباع السنوات":(rank<=25?"أدنى من ثلاثة أرباع السنوات":"داخل النطاق المعتاد")))
    +kpi("≡","","الوسيط التاريخى اليوم", nf(med[k],0),"م³/ث", ys.length+" سنة")
    +kpi("Δ",(todayV&&med[k]&&todayV<med[k])?"sand":"green","الفرق عن الوسيط",
      (todayV&&med[k])?((todayV>med[k]?"+":"")+nf((todayV-med[k])/med[k]*100,1)):"—","%","الموسم مقابل المناخ")
    +'</div>';

  /* أقرب السنوات شبهاً بالشكل لا بالتاريخ */
  var sims=[];
  ys.forEach(function(yy){
    var a=ST.clim.years[yy]; if(!a) return;
    var num=0,cnt=0,j;
    for(j=Math.max(0,k-30);j<=k;j++){
      if(a[j]===null||isNaN(a[j])||d.q[j]===null||isNaN(d.q[j])) continue;
      num+=Math.abs(a[j]-d.q[j])/Math.max(1,d.q[j]); cnt++;
    }
    if(cnt>5) sims.push({y:yy, err:num/cnt*100, pk:peakOf(a,d.t)});
  });
  sims.sort(function(p,q){return p.err-q.err;});
  var srows="";
  sims.slice(0,5).forEach(function(a,i){
    srows+='<tr'+(i===0?' class="hi"':'')+'><td><b>'+a.y+'</b></td><td class="num">'+nf(a.err,1)+'%</td>'
      +'<td class="num">'+nf(ST.clim.years[a.y][k],0)+'</td>'
      +'<td class="num">'+nf(a.pk.v,0)+'</td><td class="num" style="direction:ltr">'+esc(a.pk.t||"—")+'</td></tr>';
  });
  s+=panel("أقرب السنوات شبهاً بالموجة الحالية","بمطابقة شكل الـ٣٠ يوماً الماضية لا بنفس التاريخ",
    '<div class="tb-wrap"><table class="tb"><thead><tr><th>السنة</th><th>متوسط الفرق النسبى</th>'
    +'<th>نفس اليوم (م³/ث)</th><th>ذروة النافذة</th><th>تاريخها</th></tr></thead><tbody>'+srows+'</tbody></table></div>',
    'المطابقة على <b>شكل الموجة</b>: متوسط الفرق النسبى المطلق على الثلاثين يوماً الماضية. السنة الأقل فرقاً هى أقرب سابقة يمكن الاستئناس بمسارها اللاحق.');
  return s;
}

/* ---- 9. القياسات الميدانية والثقة ---- */
function secObs(){
  var opts="";
  STATIONS.forEach(function(S){ if(!S.key) return;
    opts+='<option value="'+S.id+'"'+(S.id===(ST.obsStation||"halfa")?" selected":"")+'>'+esc(S.nm)+'</option>'; });

  var s='<div class="ctrl"><label>اسم المُدخِل (يُقيَّد فى سجل التدقيق)</label>'
    +'<input type="text" id="usr" value="'+esc(ST.user||"")+'" placeholder="الاسم والصفة" style="min-width:180px">'
    +'<button class="btn mini" id="usr-save">حفظ</button></div>';

  var form='<div class="ctrl">'
    +'<label>المحطة</label><select id="ob-st">'+opts+'</select>'
    +'<label>التاريخ</label><input type="date" id="ob-date" value="'+todayISO()+'">'
    +'<label>التصرف المقيس (م³/ث)</label><input type="number" step="1" id="ob-q" placeholder="مثال 10500">'
    +'<button class="btn solid mini" id="ob-save">حفظ القياس</button></div>';

  var bulk='<div class="ctrl" style="align-items:flex-start;flex-wrap:wrap">'
    +'<label>المحطة</label><select id="obb-st">'+opts+'</select>'
    +'<textarea id="obb-txt" rows="4" placeholder="سطر لكل قياس:  2026-07-15, 10500" '
    +'style="min-width:220px;flex:1;font-family:inherit;direction:ltr;text-align:left;padding:8px;'
    +'border:1px solid var(--line);border-radius:8px"></textarea>'
    +'<button class="btn solid mini" id="obb-save">حفظ الدفعة</button></div>';
  if(ST.obsBulk)
    bulk+='<div class="banner '+(ST.obsBulk.bad?"warn":"ok")+'"><span>'+(ST.obsBulk.bad?"⚠":"✓")+'</span><div>'
      +'قُبل <b>'+ST.obsBulk.ok+'</b> قياساً'+(ST.obsBulk.bad? (' ورُفض <b>'+ST.obsBulk.bad+'</b> سطراً: '+esc(ST.obsBulk.why)) : '')
      +'</div></div>';

  s=panel("إدخال قياس ميدانى","فردياً أو دفعة واحدة — يُقيَّد باسم المُدخِل", s+form+bulk,
    'شروط اعتماد التصحيح: <b>'+OBS_MIN_N+' قياسات صالحة فأكثر</b> · خلال <b>'+OBS_MAX_AGE_D+' يوماً</b> · '
    +'موزّعة على مدى تصرفات لا نقطة واحدة (أقصى/أدنى ≥ '+OBS_MIN_SPAN.toFixed(2)+'×) · بعد رفض الشواذّ (|z| > 2). '
    +'<b>الإدخال الجماعى</b> يقبل سطراً لكل قياس بصيغة «تاريخ، تصرف» — والتاريخ إما 2026-07-15 أو 15/07/2026، والفاصل فاصلة أو مسافة أو تبويب. '
    +'وعند اكتمالها يُبنى <b>منحنى تصحيح خطى</b> (مقيس = a·نموذج + b) لا معامل نسبة ثابت.');

  /* حالة كل محطة */
  var rows="";
  STATIONS.forEach(function(S){
    if(!S.key) return;
    var bm=biasModel(S.id), cg=cellReliability(S.id), v=cur(S.id);
    var cq=bm&&bm.valid? correctedQ(S.id, v) : null;
    rows+='<tr><td><b>'+esc(S.nm)+'</b></td>'
      +'<td class="num">'+nf(v,0)+'</td>'
      +'<td class="num">'+(cq!==null?nf(cq,0):"—")+'</td>'
      +'<td class="num">'+(bm.n||0)+'</td>'
      +'<td class="num">'+(bm.span?nf(bm.span,2)+"×":"—")+'</td>'
      +'<td class="num">'+(bm.valid?("a="+nf(bm.fit.a,3)+" · b="+nf(bm.fit.b,0)):"—")+'</td>'
      +'<td>'+conf(cg.grade)+'</td>'
      +'<td>'+(bm.valid? stampPill("corr") : stampPill("model"))
        +'<div style="font-size:9px;color:var(--muted)">'+esc(bm.reason)+'</div></td></tr>';
  });
  s+=panel("حالة التصحيح لكل محطة","المنحنى لا يُطبَّق إلا باكتمال الشروط",
    '<div class="tb-wrap"><table class="tb"><thead><tr><th>المحطة</th><th>النموذج</th><th>المصحَّح</th>'
    +'<th>قياسات صالحة</th><th>مدى التغطية</th><th>منحنى التصحيح</th><th>الموثوقية</th><th>الحالة</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div>');

  /* تفصيل معايير الموثوقية */
  var crows="";
  STATIONS.forEach(function(S){
    if(!S.key) return;
    var c=cellReliability(S.id);
    crows+='<tr><td><b>'+esc(S.nm)+'</b></td>'
      +'<td class="num">'+nf(c.km,1)+' كم</td><td class="num">'+nf(c.sD,0)+'</td>'

    +'ويبقى الحكم القاطع هو القياس الميدانى: محطة عليها منحنى تصحيح معتمد تأخذ A مباشرة.');

  /* القياسات المسجّلة */
  var orows="", any=false;

    +'<tr><td>'+stampPill("corr")+'</td><td>ناتج نموذج مضروب فى منحنى تصحيح مستوفٍ للشروط أعلاه.</td></tr>'

    +'العتبة اليدوية المعتمدة تُحفظ فى القاعدة، وتُقيَّد فى سجل التدقيق باسم من اعتمدها، وتظهر على كل الأجهزة.');

  if(ST.thrClim && ST.thrBasis==="all"){
    s+='<div class="banner warn"><span>⚠</span><div><b>تنبيه تغيّر النظام:</b> الأرشيف الكامل '
      +'('+esc(ST.thrClim.from||"")+'–'+esc(ST.thrClim.to||"")+') تصرفاته المحاكاة أعلى بكثير من السنوات الأخيرة، '
      +'وعتبة مشتقّة منه قد لا تُبلَغ إطلاقاً فيصير الإنذار عديم الأثر. الافتراضى المعتمد <b>آخر ٥ سنوات</b>. '
      +'<b>وتنبيه لازم:</b> GloFAS لا يحاكى تشغيل الخزانات أصلاً، فآخر خمس سنوات منه تمثّل '

    ["طبيعى","أقل من "+nf(T.a,0),"متابعة يومية للنشرة، لا إجراء استثنائى","green"],
    ["متابعة لصيقة",nf(T.a,0)+" – "+nf(T.b,0),"رفع دورية الرصد، مراجعة جاهزية البوابات والمفيضات، إخطار الإدارات الفرعية","sand"],
    ["تأهّب",nf(T.b,0)+" – "+nf(T.c,0),"تفعيل غرفة العمليات، فحص المنشآت الحرجة والجسور، تنبيه محافظات المجرى","sand"],
    ["إنذار أحمر","أكثر من "+nf(T.c,0),"استعداد كامل، مراجعة سيناريو التصريف للمفيض، تنسيق مع أجهزة إدارة الأزمات","danger"]
  ];
  var mrows="";
  matrix.forEach(function(m){
    mrows+='<tr'+(m[0]===lvl.nm?' class="hi"':'')+'><td><span class="pill '+m[3]+'">'+esc(m[0])+'</span></td>'
      +'<td class="num">'+esc(m[1])+'</td><td style="font-size:11px">'+esc(m[2])+'</td></tr>';

    +'</tr></thead><tbody>'+mrows+'</tbody></table></div>');

  /* إصدار إنذار قابل للتتبّع */
  var stB = ens? ensembleThresholdStats(ens, T.b) : null;
  s+=panel("إصدار إنذار","يُحفظ بسببه الرقمى ويُتابَع حتى التنفيذ",

      +'<td style="font-size:10.5px">'+esc(A.to||"—")+'</td>'
      +'<td style="font-size:10.5px">'+esc(A.action||"—")+'</td>'

  });
  /* أول بلوغ متوقع لكل عتبة — من الأعضاء المُتتبَّعة */
  if(ens){
    var trows="";
    [["a","متابعة"],["b","تأهّب"],["c","إنذار"]].forEach(function(p){
      var L=ST.thr[p[0]], j, first=null, jj;
      for(j=k;j<ens.t.length;j++){ if(ens.mx[j]!==null && ens.mx[j]>=L){ first=ens.t[j]; break; } }
      var p7=exceedProbEns(ens, Math.min(ens.t.length-1,k+7), L);
      var p14=exceedProbEns(ens, Math.min(ens.t.length-1,k+14), L);
      var p30=exceedProbEns(ens, ens.t.length-1, L);

        +c(p7)+c(p14)+c(p30)+'</tr>';
    });

      '<div class="tb-wrap"><table class="tb"><thead><tr><th>العتبة</th><th>القيمة (م³/ث)</th>'
      +'<th>أول بلوغ (أقصى عضو)</th><th>احتمال +٧ي</th><th>احتمال +١٤ي</th><th>احتمال +٣٠ي</th>'

      +'وعمود «أول بلوغ» يستخدم أقصى الأعضاء أى السيناريو الأسوأ، فهو تاريخ تحوّط لا تاريخ متوقع.');
  }

  s+=panel("سجل الإنذارات","كل إنذار بسببه الرقمى وحالة متابعته",
    arows? ('<div class="tb-wrap"><table class="tb"><thead><tr><th>التاريخ</th><th>المستوى</th><th>التصرف</th>'

      +'</tr></thead><tbody>'+arows+'</tbody></table></div>')
      : '<p class="note">لا إنذارات مسجّلة.</p>');
  return s;
}

function secSkill(){

  var rows=evaluateLog(), SK=logSkill(), i;
  var s=panel("تسجيل تنبؤ اليوم","لتقييمه لاحقاً بما حدث فعلاً",
    '<div class="actions"><button class="btn solid" id="log-save">◷ سجّل تنبؤ اليوم</button>'
    +'<button class="btn" id="log-reload">⟳ تحديث السجل</button></div>',
    'يُحفظ فى القاعدة: تصرف اليوم، والتنبؤ عند +٣ و+٧ و+١٤ يوماً، والذروة وتاريخها، والعتبة المعمول بها. '
    +'بعد مرور المدة يقارن التطبيق كل تنبؤ بما حدث ويحسب الخطأ. <b>سجّل مرة واحدة يومياً</b>.');

  if(!rows.length) return s+panel("لا سجلات بعد","التقييم يبدأ بعد أول تسجيل",
    '<p class="note">بعد ثلاثة أيام من أول تسجيل يظهر خطأ التنبؤ عند +٣ أيام، وبعد أسبوعين تكتمل الصورة، '
    +'وبعد ثلاثين يوماً يبدأ تقييم الذروة وتوقيتها.</p>')+auditPanel();

  /* ── مصدر الحقيقة: هذا هو الفرق بين قياس الدقة وقياس الثبات ── */
  var nObs=0, nAll=0;
  for(i=0;i<SK.length;i++){ nObs+=SK[i].nObs; nAll+=SK[i].n; }
  s+='<div class="banner '+(nObs?"ok":"warn")+'"><span>'+(nObs?"✓":"⚠")+'</span><div>'
    +(nObs
      ? '<b>'+nObs+' مقارنة من '+nAll+' مستندة إلى قياس ميدانى مرصود</b> — هذه وحدها تقيس <b>الدقة</b>. '
        +'والباقى مقارنة بقيمة المنظومة اللاحقة لنفس اليوم، وهى تقيس <b>ثبات التنبؤ</b> لا صحته.'
      : '<b>لا توجد بعد أى مقارنة مقابل قياس ميدانى.</b> كل الأرقام أدناه تقارن التنبؤ '
        +'بقيمة المنظومة نفسها لاحقاً، فهى تقيس <b>ثبات التنبؤ (اتساقه مع نفسه)</b> لا دقته. '
        +'لحظة إدخال أول قياس لوادى حلفا فى قسم «القياسات الميدانية» يتحوّل هذا السجل من مؤشر ثبات إلى <b>مؤشر دقة حقيقى</b>.')
    +'</div></div>';

  /* ── مقاييس الدقة لكل أفق ── */
  var mrows="";
  for(i=0;i<SK.length;i++){
    var K=SK[i], m=K.m;

      +'<td class="num">'+(K.mae!==null?nf(K.mae,1)+'٪':"—")+'</td>'
      +'<td class="num">'+(K.bias!==null?((K.bias>0?"+":"")+nf(K.bias,1)+'٪'):"—")+'</td>'
      +'<td class="num">'+(m?nf(m.KGE,3):"—")+'</td>'
      +'<td class="num">'+(m?nf(m.NSE,3):"—")+'</td>'
      +'<td class="num">'+(m?nf(m.RMSE,0):"—")+'</td>'
      +'<td>'+(m&&K.grade? '<span class="pill '+K.grade.cls+'">'+esc(K.grade.g)+'</span>'
              : '<span class="pill info">عيّنة أقل من ٣</span>')+'</td></tr>';
  }
  s+=panel("مقاييس الدقة لكل أفق","نفس مقاييس معمل المعايرة — KGE وNSE وRMSE",
    '<div class="tb-wrap"><table class="tb"><thead><tr><th>الأفق</th><th>عدد المقارنات</th><th>منها مرصود</th>'

    'خطأ التوقيت موجب = المنظومة توقّعت الذروة <b>متأخرة</b> عن موعدها، وسالب = مبكرة. '
    +'خطأ التوقيت أخطر تشغيلياً من خطأ المقدار لأنه يحدّد موعد الاستعداد.');

  /* ── سجل التنبؤات ── */

    +kpi("◷", e3.length&&FIT.mean(e3)>15?"danger":"green","متوسط الخطأ المطلق +٣ أيام", e3.length?nf(FIT.mean(e3),1):"—","٪", e3.length+" مقارنة")
    +kpi("◷","","+٧ أيام", e7.length?nf(FIT.mean(e7),1):"—","٪", e7.length+" مقارنة")

    '<div class="tb-wrap"><table class="tb"><thead><tr><th>تاريخ الإصدار</th><th>التصرف وقتها</th>'
    +'<th>خطأ +٣</th><th>خطأ +٧</th><th>خطأ +١٤</th><th>مصدر الحقيقة</th></tr></thead><tbody>'+trows+'</tbody></table></div>',

    +'قياس ميدانى مرصود أم قيمة المنظومة اللاحقة.');
