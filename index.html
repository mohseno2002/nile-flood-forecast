/* =====================================================================
   خريطة خلايا الأمطار — مربعات ملوّنة بشدة المطر + حدود الأحواض
   ===================================================================== */
function rainColor(mm){
  if(mm===null||isNaN(mm)) return "#f1eee6";
  if(mm<5)   return "#eef2ea";
  if(mm<20)  return "#cfe0d2";
  if(mm<50)  return "#9ec7ae";
  if(mm<100) return "#5fa3c4";
  if(mm<200) return "#247ba0";
  return "#155b75";
}

function rainMapSVG(a, b){
  if(!ST.rain) return "";
  var w=700, h=460, i, j;
  var laMin=1e9, laMax=-1e9, loMin=1e9, loMax=-1e9;
  for(i=0;i<RAIN_CELLS.length;i++){
    var c=RAIN_CELLS[i];
    if(c.lat<laMin) laMin=c.lat; if(c.lat>laMax) laMax=c.lat;
    if(c.lon<loMin) loMin=c.lon; if(c.lon>loMax) loMax=c.lon;
  }
  var padLa=(laMax-laMin)*0.06, padLo=(loMax-loMin)*0.06;
  laMin-=padLa; laMax+=padLa; loMin-=padLo; loMax+=padLo;
  var m=34;
  function X(lo){ return m + (lo-loMin)/(loMax-loMin)*(w-2*m); }
  function Y(la){ return (h-m) - (la-laMin)/(laMax-laMin)*(h-2*m); }

  var s='<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet" role="img">';
  s+='<rect width="'+w+'" height="'+h+'" fill="#fdfcf8"/>';

  /* حدود الأحواض */
  for(i=0;i<BASINS.length;i++){
    var B=BASINS[i], d="";
    for(j=0;j<B.poly.length;j++)
      d += (j?" L":"M") + X(B.poly[j][1]).toFixed(1) + " " + Y(B.poly[j][0]).toFixed(1);
    d += " Z";
    s+='<path d="'+d+'" fill="'+B.col+'" fill-opacity=".05" stroke="'+B.col+'" stroke-width="1.4" stroke-dasharray="5 3"/>';
  }

  /* الخلايا */
  for(i=0;i<RAIN_CELLS.length;i++){
    var c2=RAIN_CELLS[i], p=ST.rain.P[i], sum=null;
    if(p){
      sum=0;
      for(j=Math.max(0,a); j<=Math.min(p.length-1,b); j++)
        if(p[j]!==null && !isNaN(p[j])) sum+=p[j];
    }
    var B2=basinOf(c2.b), st=B2? B2.step : 0.6;
    var x1=X(c2.lon-st/2), x2=X(c2.lon+st/2), y1=Y(c2.lat+st/2), y2=Y(c2.lat-st/2);
    s+='<rect x="'+x1.toFixed(1)+'" y="'+y1.toFixed(1)+'" width="'+Math.abs(x2-x1).toFixed(1)
      +'" height="'+Math.abs(y2-y1).toFixed(1)+'" fill="'+rainColor(sum)+'" stroke="#ffffff" stroke-width=".6"/>';
  }

  /* مراكز ثقل المطر */
  for(i=0;i<BASINS.length;i++){
    var cg=stormCentroid(BASINS[i].id, a, b);
    if(!cg) continue;
    s+='<circle cx="'+X(cg.lon).toFixed(1)+'" cy="'+Y(cg.lat).toFixed(1)+'" r="5" fill="none" stroke="#b8503f" stroke-width="2"/>';
    s+='<circle cx="'+X(cg.lon).toFixed(1)+'" cy="'+Y(cg.lat).toFixed(1)+'" r="1.6" fill="#b8503f"/>';
  }

  /* أسماء الأحواض */
  for(i=0;i<BASINS.length;i++){
    var B3=BASINS[i], cells=basinCells(B3.id);
    if(!cells.length) continue;
    var sla=0, slo=0;
    for(j=0;j<cells.length;j++){ sla+=cells[j].lat; slo+=cells[j].lon; }
    s+='<text class="node-lbl" x="'+X(slo/cells.length).toFixed(1)+'" y="'+Y(sla/cells.length).toFixed(1)
      +'" text-anchor="middle" style="font-weight:700;fill:'+B3.col+'">'+esc(B3.nm)+'</text>';
  }

  /* محطات المرجع */
  ["eldiem","atbara","jaulia","malakal"].forEach(function(id){
    var S=stn(id); if(!S) return;
    if(S.gLat<laMin||S.gLat>laMax||S.gLon<loMin||S.gLon>loMax) return;
    s+='<circle cx="'+X(S.gLon).toFixed(1)+'" cy="'+Y(S.gLat).toFixed(1)+'" r="3.6" fill="#243238"/>';
    s+='<text class="node-val" x="'+(X(S.gLon)+6).toFixed(1)+'" y="'+(Y(S.gLat)+3).toFixed(1)+'">'+esc(S.nm)+'</text>';
  });

  s+='<text class="axis-lbl" x="'+(w-8)+'" y="'+(h-8)+'" text-anchor="end">'
    + esc(ST.rain.t[Math.max(0,a)]) + ' ← ' + esc(ST.rain.t[Math.min(ST.rain.t.length-1,b)]) + '</text>';
  s+='</svg>';
  return s;
}

/* =====================================================================
   FIT — إحصاءات جودة المطابقة (إحصاء لا هيدروليكا؛ المعادلات الهيدروليكية
   تبقى حصراً فى MWRIHyd)
   ===================================================================== */
var FIT = (function(){
  function pair(obs, sim, a, b){
    var O=[],S=[],i;
    for(i=Math.max(0,a); i<=Math.min(Math.min(obs.length,sim.length)-1, b); i++){
      var o=obs[i], s=sim[i];
      if(o===null||o===undefined||isNaN(o)) continue;
      if(s===null||s===undefined||isNaN(s)) continue;
      O.push(o); S.push(s);
    }
    return {O:O, S:S};
  }
  function mean(a){ var s=0,i; for(i=0;i<a.length;i++) s+=a[i]; return a.length? s/a.length : 0; }
  function sd(a){
    var m=mean(a), s=0, i;
    for(i=0;i<a.length;i++) s+=(a[i]-m)*(a[i]-m);
    return a.length>1? Math.sqrt(s/(a.length-1)) : 0;
  }
  function corr(x,y){
    var mx=mean(x), my=mean(y), n=0, dx=0, dy=0, i;
    for(i=0;i<x.length;i++){ n+=(x[i]-mx)*(y[i]-my); dx+=(x[i]-mx)*(x[i]-mx); dy+=(y[i]-my)*(y[i]-my); }
    return (dx>0&&dy>0)? n/Math.sqrt(dx*dy) : 0;
  }
  function metrics(obs, sim, a, b){
    var p=pair(obs,sim,a,b), O=p.O, S=p.S, i;
    if(O.length<3) return null;
    var mo=mean(O), num=0, den=0, se=0;
    for(i=0;i<O.length;i++){ num+=(O[i]-S[i])*(O[i]-S[i]); den+=(O[i]-mo)*(O[i]-mo); se+=(S[i]-O[i]); }
    var nse = den>0? 1-num/den : null;
    var rmse = Math.sqrt(num/O.length);
    var pbias = mo!==0? (se/ (mo*O.length))*100 : 0;
    var r = corr(O,S);
    var alpha = sd(O)>0? sd(S)/sd(O) : 0;
    var beta  = mo!==0? mean(S)/mo : 0;
    var kge = 1 - Math.sqrt((r-1)*(r-1) + (alpha-1)*(alpha-1) + (beta-1)*(beta-1));
    return { n:O.length, NSE:nse, KGE:kge, RMSE:rmse, PBIAS:pbias, r:r, alpha:alpha, beta:beta };
  }
  function peakErr(obs, sim, t, a, b){
    var po=null, ps=null, i;
    for(i=Math.max(0,a); i<=Math.min(obs.length-1,b); i++){
      if(obs[i]!==null&&!isNaN(obs[i])&&(po===null||obs[i]>obs[po])) po=i;
      if(sim[i]!==null&&!isNaN(sim[i])&&(ps===null||sim[i]>sim[ps])) ps=i;
    }
    if(po===null||ps===null) return null;
    return { dtDays: ps-po, dQpct: obs[po]!==0? (sim[ps]-obs[po])/obs[po]*100 : 0,
             tObs:t[po], tSim:t[ps] };
  }
  function grade(kge){
    if(kge===null||kge===undefined) return {g:"—", cls:"info"};
    if(kge>=0.90) return {g:"ممتاز", cls:"green"};
    if(kge>=0.75) return {g:"جيد", cls:"green"};
    if(kge>=0.50) return {g:"مقبول", cls:"sand"};
    return {g:"ضعيف", cls:"danger"};
  }
  function linfit(x,y){
    /* انحدار خطى y = a·x + b — إحصاء لا هيدروليكا */
    var n=Math.min(x.length,y.length), sx=0,sy=0,sxx=0,sxy=0,i,c=0;
    for(i=0;i<n;i++){
      if(x[i]===null||y[i]===null||isNaN(x[i])||isNaN(y[i])) continue;
      sx+=x[i]; sy+=y[i]; sxx+=x[i]*x[i]; sxy+=x[i]*y[i]; c++;
    }
    if(c<2) return null;
    var den=c*sxx-sx*sx;
    if(Math.abs(den)<1e-12) return null;
    var a=(c*sxy-sx*sy)/den, b=(sy-a*sx)/c;
    return {a:a, b:b, n:c};
  }
  return { metrics:metrics, peakErr:peakErr, grade:grade, mean:mean, sd:sd,
           corr:corr, linfit:linfit };
})();

/* =====================================================================
   التتبّع — ماسكينجم متتالٍ عبر MWRIHyd حصراً
   ===================================================================== */
function routeCascade(inflow, K, x, n, dt){
  var q=inflow.slice(), Ks=K/n, ok=true, res, i, j;
  /* S = K[x·I + (1-x)·O] لكل مقطع فرعى — تخزين ماسكينجم بوحدة (م³/ث)·يوم */
  var S=[]; for(j=0;j<inflow.length;j++) S.push(0);
  for(i=0;i<n;i++){
    res = MWRIHyd.muskingum(q, Ks, x, dt, q[0]);
    if(!res.stable) ok=false;
    for(j=0;j<q.length;j++){
      var I=q[j], O=res.outflow[j];
      if(I!==null&&O!==null&&!isNaN(I)&&!isNaN(O)) S[j] += Ks*(x*I + (1-x)*O);
    }
    q = res.outflow;
  }
  return { out:q, stable:ok, Ks:Ks, lo:2*Ks*x, hi:2*Ks*(1-x), S:S };
}

/* المنظومة الكاملة لسلسلة مدخلات واحدة (تُستدعى للسيناريو ولكل عضو) */
function routeSystem(qEldiem, qJaulia, qAtbara, R){
  var dt=1, j;
  var r1 = routeCascade(qEldiem, R[0].K, R[0].x, R[0].n, dt);
  var blueKh = r1.out;
  var mainKh = addS(blueKh, qJaulia, 1);
  var r2 = routeCascade(mainKh, R[1].K, R[1].x, R[1].n, dt);   /* الخرطوم ← شندى */
  var atConf = r2.out;
  var inR3 = addS(atConf, qAtbara, 1);                          /* عطبرة تدخل هنا لا قبله */
  var r3 = routeCascade(inR3, R[2].K, R[2].x, R[2].n, dt);      /* الملتقى ← دنقلا */
  var r4 = routeCascade(r3.out, R[3].K, R[3].x, R[3].n, dt);    /* دنقلا ← حلفا */
  var Stot=[];
  for(j=0;j<qEldiem.length;j++) Stot.push(r1.S[j]+r2.S[j]+r3.S[j]+r4.S[j]);
  return { blueKh:blueKh, mainKh:mainKh, atConf:atConf, dongola:r3.out, halfa:r4.out,
           r1:r1, r2:r2, r3:r3, r4:r4, S:Stot };
}

function runRouting(){
  if(!ST.q||!ST.q.eldiem) return null;
  var t=ST.q.eldiem.t, f=scenF(), R=ST.reaches;
  var inflow = mulS(ST.q.eldiem.q, f);
  var white  = ST.q.jaulia? ST.q.jaulia.q : inflow.map(function(){return 0;});
  var atb    = ST.q.atbara? mulS(ST.q.atbara.q, f) : inflow.map(function(){return 0;});
  var sys = routeSystem(inflow, white, atb, R);

  /* التراكب الكمى — ماسكينجم خطى فالتفكيك مطابق تماماً */
  var zero = inflow.map(function(){ return 0; });
  var cBlue  = routeSystem(inflow, zero, zero, R).halfa;
  var cWhite = routeSystem(zero, white, zero, R).halfa;
  var cAtb   = routeSystem(zero, zero, atb, R).halfa;

  /* الوارد المُزاح لزمن وصول كل رافد إلى وادى حلفا */
  var L1 = R[0].K + R[1].K + R[2].K + R[3].K;   /* الديم */
  var L2 = R[1].K + R[2].K + R[3].K;            /* الأبيض (يدخل عند الخرطوم) */
  var L3 = R[2].K + R[3].K;                     /* عطبرة (تدخل عند الملتقى) */
  var alignedIn = addS(addS(shift(inflow,L1), shift(white,L2), 1), shift(atb,L3), 1);

  var pkIn = peakOf(alignedIn, t), pkOut = peakOf(sys.halfa, t);
  var last = t.length-1;
  var rising = (pkIn.i>=last-1 || pkOut.i>=last-1);
  /* الاستنفاد لا معنى له قبل بلوغ الذروة — الذروتان حينئذ طرف النافذة لا قمة */
  var att = (!rising && pkIn.v && pkOut.v)? (1 - pkOut.v/pkIn.v)*100 : null;

  var k = nowIdx();
  var volIn  = volume(alignedIn, k, t.length-1);
  var volOut = volume(sys.halfa, k, t.length-1);
  /* تغيّر التخزين داخل المقاطع خلال النافذة (مليون م³) — من صيغة ماسكينجم نفسها */
  var last=t.length-1;
  var dS = (sys.S[last]!==undefined && sys.S[k]!==undefined)? (sys.S[last]-sys.S[k])*86400/1e6 : null;
  /* اتزان صحيح: V_in − V_out − ΔS ≈ 0 */
  var volIn2  = volume(addS(addS(inflow, white,1), atb,1), k, last);
  var volResid = (dS!==null)? (volIn2 - volOut - dS) : null;

  return { t:t, inflow:inflow, white:white, atb:atb,
    blueAtKh:sys.blueKh, mainKh:sys.mainKh, atDongola:sys.dongola, atHalfa:sys.halfa,
    r1:sys.r1, r2:sys.r2, r3:sys.r3, r4:sys.r4, atConf:sys.atConf,
    comp:{ blue:cBlue, white:cWhite, atbara:cAtb },
    alignedIn:alignedIn, lag:L1, lagWhite:L2, lagAtbara:L3,
    dS:dS, volInRaw:volIn2, volResid:volResid,
    pkIn:pkIn, pkOut:pkOut, att:att, rising:rising, volIn:volIn, volOut:volOut,
    obsHalfa: ST.q.halfa? ST.q.halfa.q : null };
}

/* =====================================================================
   تتبّع الأعضاء الـ٥١
   ===================================================================== */
function runEnsemble(){
  if(!ST.mem || !ST.mem.eldiem || !ST.q) return null;
  var R=ST.reaches, f=scenF(), t=ST.q.eldiem.t, i, m;
  var Me=ST.mem.eldiem.M, Mw=ST.mem.jaulia?ST.mem.jaulia.M:null, Ma=ST.mem.atbara?ST.mem.atbara.M:null;
  var nM=Me.length;
  if(!nM) return null;
  var routed=[], peaks=[], pkDates=[], zero=t.map(function(){return 0;});
  for(m=0;m<nM;m++){
    var e = mulS(Me[m], f);
    var w = (Mw&&Mw[m])? Mw[m] : (ST.q.jaulia?ST.q.jaulia.q:zero);
    var a = (Ma&&Ma[m])? mulS(Ma[m], f) : (ST.q.atbara?mulS(ST.q.atbara.q,f):zero);
    var h = routeSystem(e, w, a, R).halfa;
    routed.push(h);
    var p = peakOf(h, t);
    peaks.push(p.v); pkDates.push(p.i);
  }
  /* الرتب اليومية */
  var p10=[],p25=[],p50=[],p75=[],p90=[],mn=[],mx=[];
  for(i=0;i<t.length;i++){
    var col=[];
    for(m=0;m<nM;m++){ var v=routed[m][i]; if(v!==null&&!isNaN(v)) col.push(v); }
    col.sort(function(x,y){return x-y;});
    p10.push(quantile(col,0.10)); p25.push(quantile(col,0.25)); p50.push(quantile(col,0.50));
    p75.push(quantile(col,0.75)); p90.push(quantile(col,0.90));
    mn.push(col.length?col[0]:null); mx.push(col.length?col[col.length-1]:null);
  }
  return { t:t, n:nM, routed:routed, p10:p10, p25:p25, p50:p50, p75:p75, p90:p90, mn:mn, mx:mx,
           peaks:peaks, pkDates:pkDates };
}

/* إحصاءات العتبة من الأعضاء المُتتبَّعة */
function ensembleThresholdStats(ens, L){
  if(!ens) return null;
  var k=nowIdx(), m, i;
  var nOver=0, vols=[], durs=[], firstDays=[];
  for(m=0;m<ens.n;m++){
    var r=ens.routed[m], vol=0, dur=0, first=null;
    for(i=k;i<r.length;i++){
      if(r[i]!==null&&!isNaN(r[i])&&r[i]>L){
        vol += (r[i]-L)*86400; dur++;
        if(first===null) first=i-k;
      }
    }
    if(dur>0){ nOver++; vols.push(vol/1e6); durs.push(dur); firstDays.push(first); }
  }
  vols.sort(function(a,b){return a-b;}); durs.sort(function(a,b){return a-b;}); firstDays.sort(function(a,b){return a-b;});
  return {
    prob: ens.n? nOver/ens.n*100 : 0,
    volMed: vols.length? quantile(vols,0.5) : 0,
    volMax: vols.length? vols[vols.length-1] : 0,
    durMed: durs.length? quantile(durs,0.5) : 0,
    durMax: durs.length? durs[durs.length-1] : 0,
    firstMed: firstDays.length? quantile(firstDays,0.5) : null,
    firstMin: firstDays.length? firstDays[0] : null,
    firstMax: firstDays.length? firstDays[firstDays.length-1] : null,
    nOver:nOver
  };
}
function exceedProbEns(ens, j, L){
  if(!ens) return null;
  var c=0, n=0, m;
  for(m=0;m<ens.n;m++){
    var v=ens.routed[m][j];
    if(v===null||isNaN(v)) continue;
    n++; if(v>=L) c++;
  }
  return n? c/n*100 : null;
}

/* =====================================================================
   المعايرة الآلية — بحث شبكى على الفترة الماضية فقط
   ===================================================================== */
function calibrateReach(idx){
  if(!ST.q) return null;
  var k=nowIdx(), a=Math.max(2,k-42), b=k;
  var t=ST.q.eldiem.t, inflow, obs;
  /* المرجع لكل مقطع = محطة مصبّه، والمدخل نفس ما تستخدمه routeSystem بالضبط */
  if(idx===0){ inflow=ST.q.eldiem.q;   obs=ST.q.bnkhart.q; }
  else if(idx===1){ inflow=ST.q.khartoum.q; obs=ST.q.shendi.q; }
  else if(idx===2){ inflow=addS(ST.q.shendi.q, ST.q.atbara.q, 1); obs=ST.q.merowe.q; }
  else { inflow=ST.q.merowe.q; obs=ST.q.halfa.q; }
  if(!inflow||!obs) return null;

  var Ks=[1,1.5,2,2.5,3,3.5,4,5,6,7,8,9,10];
  var Xs=[0.05,0.10,0.15,0.20,0.25,0.30,0.35,0.40];
  var Ns=[1,2,3,4,5,6,8];
  var best=null, i,j,z;
  for(i=0;i<Ks.length;i++) for(j=0;j<Xs.length;j++) for(z=0;z<Ns.length;z++){
    var K=Ks[i], x=Xs[j], n=Ns[z], Ksub=K/n;
    if(!(1 >= 2*Ksub*x && 1 <= 2*Ksub*(1-x))) continue; /* شرط الاستقرار عند Δt=1 */
    var r=routeCascade(inflow,K,x,n,1);
    var mt=FIT.metrics(obs, r.out, a, b);
    if(!mt||mt.KGE===null||isNaN(mt.KGE)) continue;
    if(!best || mt.KGE>best.m.KGE) best={K:K,x:x,n:n,m:mt,out:r.out};
  }
  /* قابلية التعريف: K وx لا يُعرَّفان من ساق صاعدة ملساء بلا ذروة */
  var wv=[], wi;
  for(wi=a; wi<=b; wi++) if(inflow[wi]!==null&&!isNaN(inflow[wi])) wv.push(inflow[wi]);
  var wmin=Math.min.apply(null,wv), wmax=Math.max.apply(null,wv), wmean=FIT.mean(wv);
  var ident = wmean>0? (wmax-wmin)/wmean : 0;
  var hasPeak=false, wj;
  for(wj=a+2; wj<=b-2; wj++)
    if(inflow[wj]!==null && inflow[wj]>=wmax*0.995) hasPeak=true;

  var R=ST.reaches[idx];
  var cur=routeCascade(inflow,R.K,R.x,R.n,1);
  var curM=FIT.metrics(obs, cur.out, a, b);
  var pe = best? FIT.peakErr(obs, best.out, t, a, b) : null;
  return { idx:idx, cur:{K:R.K,x:R.x,n:R.n,m:curM}, best:best, peak:pe,
           ident:ident, hasPeak:hasPeak,
           reliable:(ident>=0.5 && hasPeak),
           window:{from:t[a], to:t[b], n:b-a+1} };
}
function calibrateAll(){
  var out=[],i;
  for(i=0;i<ST.reaches.length;i++) out.push(calibrateReach(i));
  return out;
}

/* =====================================================================
   الاتزان الحجمى المزاح زمنياً
   ===================================================================== */
function balanceNode(node){
  if(!ST.q) return null;
  var k=nowIdx(), a=Math.max(0,k-29), b=k, ins=[], outQ, lagMap, nm;
  if(node==="khartoum"){
    lagMap=LAGS.khartoum; outQ=ST.q.khartoum.q; nm="ملتقى الخرطوم";
    ins=[{id:"bnkhart",nm:"الأزرق"},{id:"jaulia",nm:"الأبيض"}];
  } else {
    lagMap=LAGS.merowe; outQ=ST.q.merowe.q; nm="ملتقى عطبرة ← دنقلا";
    ins=[{id:"shendi",nm:"شندى"},{id:"atbara",nm:"عطبرة"}];
  }
  var comp=[], sumV=0, sumQ=0;
  ins.forEach(function(o){
    var raw=ST.q[o.id].q, lag=lagMap[o.id]||0, s=shift(raw,lag);
    var V=volume(s,a,b), Q=s[k];
    comp.push({nm:o.nm, lag:lag, V:V, Q:Q});
    sumV+=V; sumQ+=(Q||0);
  });
  var Vout=volume(outQ,a,b), Qout=outQ[k];
  var wb = MWRIHyd.waterBalance(
    comp.map(function(c){ return {Q:c.Q||0}; }),
    [{Q:Qout||0}], {tolerancePct:(node==="khartoum"?5:8)});
  return { nm:nm, comp:comp, sumV:sumV, Vout:Vout,
    closureV: sumV-Vout, closureVpct: sumV>0? (sumV-Vout)/sumV*100 : 0,
    sumQ:sumQ, Qout:Qout, wb:wb, window:{from:ST.q.eldiem.t[a], to:ST.q.eldiem.t[b], days:b-a+1} };
}

/* =====================================================================
   الجملة التشغيلية — تُبنى من الأرقام المحسوبة فقط
   ===================================================================== */
function operationalSentence(){
  if(!ST.q) return null;
  var k=nowIdx(), d=ST.q.halfa, ens=runEnsemble(), rt=runRouting();
  var q=d.q[k], q7=d.q[Math.min(d.q.length-1,k+7)];
  var rate = (q&&q7)? (q7-q)/q*100 : 0;
  var trend = rate>5? "صاعدة" : (rate<-5? "هابطة" : "شبه مستقرة");
  var sev = alertLevel(q);
  var st = ens? ensembleThresholdStats(ens, ST.thr.b) : null;
  var s = "موجة " + trend;
  if(Math.abs(rate)>1) s += " بمعدل " + (rate>0?"+":"") + nf(rate,1) + "٪ خلال ٧ أيام";
  s += "؛ الحالة الآن " + sev.nm + " عند " + nf(q,0) + " م³/ث.";
  if(st){
    s += " احتمال تجاوز عتبة التأهّب عند وادى حلفا " + nf(st.prob,0) + "٪";
    if(st.prob>0 && st.firstMin!==null)
      s += "، وزمن الوصول المتوقع " + nf(st.firstMin,0) + "–" + nf(st.firstMax,0) + " يوماً";
    s += ".";
  }
  if(rt && rt.pkOut && rt.pkOut.t)
    s += " أقصى قيمة متتبَّعة " + nf(rt.pkOut.v,0) + " م³/ث يوم " + rt.pkOut.t + ".";
  return s;
}

/* =====================================================================
   سجل أداء التنبؤ — يُقيَّم لاحقاً بالمقارنة بما حدث
   ===================================================================== */
function buildLogEntry(){
  if(!ST.q) return null;
  var k=nowIdx(), d=ST.q.halfa, ens=runEnsemble();
  var pk = ens? peakOf(ens.p50, d.t) : peakOf(d.q.slice(k), d.t.slice(k));
  return {
    date: todayISO(),
    issued: Date.now(),
    q0: d.q[k],
    f3:  d.q[Math.min(d.q.length-1,k+3)],
    f7:  d.q[Math.min(d.q.length-1,k+7)],
    f14: d.q[Math.min(d.q.length-1,k+14)],
    peak: pk.v, peakDate: pk.t,
    thrB: ST.thr? ST.thr.b : null,
    scen: ST.scen, build: BUILD
  };
}
function evaluateLog(){
  if(!ST.q) return [];
  var d=ST.q.halfa, out=[], keys=Object.keys(ST.log||{}).sort(), i, h;
  function actualOn(iso){
    var j; for(j=0;j<d.t.length;j++) if(d.t[j]===iso) return d.q[j];
    return null;
  }
  function addDays(iso,n){
    var p=iso.split("-"), dt=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
    dt=new Date(dt.getTime()+n*864e5);
    return dt.toISOString().slice(0,10);
  }
  for(i=0;i<keys.length;i++){
    var e=ST.log[keys[i]];
    if(!e||!e.date) continue;
    var row={date:e.date, q0:e.q0};
    [[3,"f3"],[7,"f7"],[14,"f14"]].forEach(function(pr){
      var act=actualOn(addDays(e.date,pr[0])), fc=e[pr[1]];
      row["a"+pr[0]]=act;
      row["e"+pr[0]]=(act&&fc)? (fc-act)/act*100 : null;
    });
    out.push(row);
  }
  return out;
}

/* =====================================================================
   موثوقية الخلية — مؤشر متعدد المعايير (لا مسافة وحدها)
   ===================================================================== */
/* الرافد المقابل عند كل ملتقى: الرافد الصغير يُقارن بـ«باقى المصبّ»
   بعد طرح شقيقه، وإلا عوقب ظلماً — الأبيض شبه ثابت ومصبّه يرتفع بالأزرق */
var SIBLING = { jaulia:"bnkhart", bnkhart:"jaulia", atbara:"shendi", shendi:"atbara" };

var DOWNSTREAM = {
  tana:"eldiem", eldiem:"roseires", roseires:"sennar", sennar:"bnkhart",
  bnkhart:"khartoum", sobat:"malakal", malakal:"jaulia", jaulia:"khartoum",
  khartoum:"shendi", shendi:"merowe", atbara:"merowe", merowe:"halfa", halfa:"aswan"
};

function cellReliability(id){
  var S=stn(id); if(!S) return null;
  var k=nowIdx(), a=Math.max(0,k-42), b=k, i;
  var d=haversine(S.gLat,S.gLon,S.lat,S.lon);
  /* ١) القرب المكانى */
  var sD = d<=5? 100 : (d>=30? 0 : Math.round(100*(30-d)/25));
  /* ٢) تطابق المسار: أعلى ارتباط مع المحطة التالية بعد الإزاحة الزمنية
        الموجة تصل المحطة التالية بعد أيام، فالارتباط عند إزاحة صفر يقلّل الدرجة ظلماً */
  var dn=DOWNSTREAM[id], r=null, sR=0, bestLag=null, L, refMode="—";
  if(dn && ST.q && ST.q[id] && ST.q[dn]){
    var sib = SIBLING[id];
    var useResidual = !!(sib && ST.q[sib]);
    for(L=0; L<=7; L++){
      var X=[],Y=[];
      for(i=a;i<=b;i++){
        var j=i+L;
        if(j>=ST.q[dn].q.length) break;
        var u=ST.q[id].q[i], v=ST.q[dn].q[j];
        if(useResidual){
          var w2=ST.q[sib].q[j];
          if(w2===null||isNaN(w2)) continue;
          v = v - w2;                     /* باقى المصبّ بعد طرح الرافد المقابل */
        }
        if(u===null||v===null||isNaN(u)||isNaN(v)) continue;
        X.push(u); Y.push(v);
      }
      if(X.length<=10) continue;
      var rr=FIT.corr(X,Y);
      if(r===null || rr>r){ r=rr; bestLag=L; }
    }
    if(r!==null) sR=Math.max(0, Math.round(r*100));
    refMode = useResidual? "باقى المصبّ" : "المصبّ";
  }
  /* ٣) معقولية الحجم مقابل المحطة التالية */
  var ratio=null, sP=50;
  if(dn && ST.q && ST.q[id] && ST.q[dn]){
    var qu=ST.q[id].q[k], qd=ST.q[dn].q[k];
    if(qu&&qd){
      ratio=qu/qd;
      sP = (ratio>=0.10 && ratio<=1.30)? 100 : (ratio>=0.03 && ratio<=2.0? 55 : 10);
    }
  }
  var score = Math.round(0.40*sD + 0.40*sR + 0.20*sP);
  var g = score>=80?"A":(score>=65?"B":(score>=45?"C":"D"));
  /* القياس الميدانى الموثّق يرفع الدرجة إلى A مباشرة */
  var bm = biasModel(id);
  if(bm && bm.valid){ g="A"; score=Math.max(score,85); }
  return { km:d, sD:sD, r:r, sR:sR, lag:bestLag, refMode:refMode, ratio:ratio, sP:sP, score:score, grade:g,
           downstream:dn, calibrated:!!(bm&&bm.valid) };
}

/* =====================================================================
   تصحيح الانحياز — بضوابط لا بمعامل من نقطة واحدة
   الشروط: ٣ قياسات فأكثر · خلال ٣٦٥ يوماً · تغطى مدى تصرفات · بعد رفض الشواذّ
   ===================================================================== */
var OBS_MIN_N = 3, OBS_MAX_AGE_D = 365, OBS_MIN_SPAN = 1.30;

function obsPairs(id){
  var o = ST.obs && ST.obs[id]; if(!o) return [];
  var d = ST.q && ST.q[id]; if(!d) return [];
  var out=[], keys=Object.keys(o), i, j;
  var nowMs = Date.now();
  for(i=0;i<keys.length;i++){
    var rec=o[keys[i]];
    if(!rec || typeof rec.q!=="number") continue;
    var mv=null;
    for(j=0;j<d.t.length;j++) if(d.t[j]===keys[i]) mv=d.q[j];
    if(mv===null||!mv) continue;                      /* لا نموذج لنفس اليوم */
    var p=keys[i].split("-");
    var ageD=(nowMs - Date.UTC(+p[0],+p[1]-1,+p[2]))/864e5;
    if(ageD>OBS_MAX_AGE_D) continue;                  /* منتهى الصلاحية */
    out.push({ date:keys[i], obs:rec.q, mod:mv, ratio:rec.q/mv, age:ageD,
               by:rec.by||"—", out:false });
  }
  out.sort(function(x,y){ return x.mod-y.mod; });
  return out;
}

function biasModel(id){
  var P=obsPairs(id);
  if(!P.length) return { valid:false, n:0, reason:"لا قياسات" };
  /* رفض الشواذّ على النسبة (|z| > 2) */
  var rs=P.map(function(p){ return p.ratio; });
  var m=FIT.mean(rs), sd=FIT.sd(rs), i;
  var kept=[];
  for(i=0;i<P.length;i++){
    if(sd>0 && Math.abs((P[i].ratio-m)/sd)>2){ P[i].out=true; }
    else kept.push(P[i]);
  }
  var n=kept.length;
  if(n<OBS_MIN_N)
    return { valid:false, n:n, pairs:P, reason:"القياسات الصالحة "+n+" والحدّ الأدنى "+OBS_MIN_N };
  var mods=kept.map(function(p){ return p.mod; });
  var span = Math.min.apply(null,mods)>0? Math.max.apply(null,mods)/Math.min.apply(null,mods) : 1;
  if(span<OBS_MIN_SPAN)
    return { valid:false, n:n, pairs:P, span:span,
             reason:"القياسات متجمّعة على تصرف واحد (المدى "+span.toFixed(2)+"×) — لا تصلح لمنحنى تصحيح" };
  var fit = FIT.linfit(mods, kept.map(function(p){ return p.obs; }));
  if(!fit) return { valid:false, n:n, pairs:P, reason:"تعذّر حساب منحنى التصحيح" };
  var meanRatio = FIT.mean(kept.map(function(p){ return p.ratio; }));
  return { valid:true, n:n, pairs:P, span:span, fit:fit, meanRatio:meanRatio,
           newest: Math.min.apply(null, kept.map(function(p){ return p.age; })),
           reason:"صالح" };
}
function correctedQ(id, q){
  var bm=biasModel(id);
  if(!bm||!bm.valid||q===null||isNaN(q)) return null;
  return bm.fit.a*q + bm.fit.b;
}

    +'<span><i style="background:#247ba0;opacity:.25"></i>١٠–٩٠٪</span>'
    +'<span><i style="background:#247ba0;opacity:.15"></i>أدنى–أقصى</span></div>');

  /* توزيع الذروة */
  var pk=ens.peaks.slice().sort(function(a,b){return a-b;});
  var bestI=0,worstI=0,i;
  for(i=0;i<ens.n;i++){ if(ens.peaks[i]<ens.peaks[bestI]) bestI=i; if(ens.peaks[i]>ens.peaks[worstI]) worstI=i; }
  s+='<div class="grid g4" style="margin-top:15px">'
    +kpi("▼","green","أفضل سيناريو (أدنى عضو)", nf(pk[0],0),"م³/ث","العضو "+(bestI+1))
    +kpi("≡","","الوسيط", nf(quantile(pk,0.5),0),"م³/ث","الذروة المتوقعة")
    +kpi("▲","sand","المئين ٩٠", nf(quantile(pk,0.90),0),"م³/ث","عُشر الأعضاء أعلى منه")
    +kpi("⚠","danger","أسوأ سيناريو (أقصى عضو)", nf(pk[pk.length-1],0),"م³/ث","العضو "+(worstI+1))
    +'</div>';

  /* مدرّج تاريخ الذروة */
  var lab=[],val=[],map={};
  ens.pkDates.forEach(function(d){ map[d]=(map[d]||0)+1; });
  var keys=Object.keys(map).map(Number).sort(function(a,b){return a-b;});
  keys.forEach(function(d){ lab.push(dmy(t[d])); val.push(map[d]); });
  s+=panel("توزيع تاريخ الذروة","كم عضواً يضع الذروة فى كل يوم",
    '<div class="chart-box">'+histSVG(val,lab,"#b46f4b")+'</div>',
    'تركّز الأعمدة يعنى اتفاق الأعضاء على توقيت الذروة؛ تشتّتها يعنى أن توقيت الوصول نفسه غير مؤكد وليس الحجم فقط.');

  /* جدول العتبات */
  var rows="";
  [["a","متابعة"],["b","تأهّب"],["c","إنذار"]].forEach(function(p){
    var stt=ensembleThresholdStats(ens, ST.thr[p[0]]);
    var c=stt.prob>=60?"#b8503f":(stt.prob>=25?"#c58a2f":"#4d7c5a");
    rows+='<tr><td><b>'+p[1]+'</b> — '+nf(ST.thr[p[0]],0)+'</td>'
      +'<td class="num" style="color:'+c+';font-weight:700">'+nf(stt.prob,0)+'%</td>'
      +'<td class="num">'+(stt.firstMed!==null?nf(stt.firstMed,0):"—")+'</td>'
      +'<td class="num">'+(stt.firstMin!==null?(nf(stt.firstMin,0)+"–"+nf(stt.firstMax,0)):"—")+'</td>'
      +'<td class="num">'+nf(stt.volMed,0)+'</td><td class="num">'+nf(stt.durMed,0)+'</td></tr>';
  });
  s+=panel("ما وراء الاحتمال","حجم المياه فوق العتبة ومدة البقاء فوقها",
    '<div class="tb-wrap"><table class="tb"><thead><tr><th>العتبة (م³/ث)</th><th>احتمال التجاوز</th>'
    +'<th>زمن الوصول (يوم)</th><th>مداه</th><th>الحجم فوقها (مليون م³)</th><th>المدة (يوم)</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div>',
    'الاحتمال وحده لا يكفى للقرار: تجاوز بيوم واحد و٢٠ مليون م³ غير تجاوز بعشرة أيام و٦٠٠ مليون م³، وإن تساوى الاحتمالان.');
  return s;
}

/* ---- 4. التراكب الكمى ---- */
function secCompose(){
  if(!ST.q) return panel("التراكب","جارٍ التحميل", skel(4));
  var rt=runRouting(); if(!rt) return panel("التراكب","تعذّر الحساب","");
  var k=nowIdx();
  var b=rt.comp.blue[k], w=rt.comp.white[k], a=rt.comp.atbara[k];
  var modelTot=rt.atHalfa[k], obs=rt.obsHalfa? rt.obsHalfa[k] : null;
  var rawAligned=rt.alignedIn[k];
  var storage = (rawAligned!==null && modelTot!==null)? (rawAligned-modelTot) : null;
  var gap = (obs!==null && modelTot!==null)? (obs-modelTot) : null;

  function trend(series){
    var v=series[k], v7=series[Math.min(series.length-1,k+7)];
    if(!v||!v7) return "—";
    var r=(v7-v)/v*100;
    return r>10?"صاعد حادّ":(r>3?"صاعد":(r<-10?"هابط حادّ":(r<-3?"هابط":"مستقر")));
  }
  var items=[
    {nm:"النيل الأزرق", v:b||0, c:"#247ba0"},
    {nm:"النيل الأبيض", v:w||0, c:"#4d7c5a"},
    {nm:"عطبرة",       v:a||0, c:"#b46f4b"}
  ];
  var tot=(b||0)+(w||0)+(a||0);

  var s=scenBar();
  s+=panel("تركيب الوارد لبحيرة ناصر اليوم","تفكيك مطابق — ماسكينجم خطى فتنطبق قاعدة التراكب",
    '<div class="chart-box" style="padding:4px">'+stackBarSVG(items, tot)+'</div>');

  var rows=
    '<tr><td><b>النيل الأزرق</b> (عبر ٤ مقاطع)</td><td class="num">'+nf(b,0)+'</td><td class="num">'+nf(tot>0?b/tot*100:0,1)+'%</td><td>'+esc(trend(rt.comp.blue))+'</td></tr>'
   +'<tr><td><b>النيل الأبيض</b> (عبر ٣ مقاطع)</td><td class="num">'+nf(w,0)+'</td><td class="num">'+nf(tot>0?w/tot*100:0,1)+'%</td><td>'+esc(trend(rt.comp.white))+'</td></tr>'
   +'<tr><td><b>نهر عطبرة</b> (عبر مقطعين — من الملتقى)</td><td class="num">'+nf(a,0)+'</td><td class="num">'+nf(tot>0?a/tot*100:0,1)+'%</td><td>'+esc(trend(rt.comp.atbara))+'</td></tr>'
   +'<tr class="hi"><td><b>مجموع النموذج عند حلفا</b></td><td class="num">'+nf(modelTot,0)+'</td><td class="num">100%</td><td>'+esc(trend(rt.atHalfa))+'</td></tr>'
   +'<tr><td>أثر التخزين بالمجرى (استنفاد)</td><td class="num">'+(storage!==null?("−"+nf(Math.abs(storage),0)):"—")+'</td>'
     +'<td class="num">'+(storage!==null&&rawAligned?nf(-Math.abs(storage)/rawAligned*100,1)+"%":"—")+'</td><td>مقابل الوارد المُزاح زمنياً</td></tr>'
   +'<tr><td>عدم انغلاق النموذج (مقابل GloFAS)</td><td class="num">'+(gap!==null?((gap>0?"+":"")+nf(gap,0)):"—")+'</td>'
     +'<td class="num">'+(gap!==null&&obs?((gap>0?"+":"")+nf(gap/obs*100,1)+"%"):"—")+'</td><td>مؤشر جودة لا مصدر مياه</td></tr>';

  s+=panel("لماذا تغيّر الوارد؟","المساهمة الكمية لكل مكوّن",
    '<div class="tb-wrap"><table class="tb"><thead><tr><th>المكوّن</th><th>التصرف (م³/ث)</th>'
    +'<th>المساهمة</th><th>الاتجاه</th></tr></thead><tbody>'+rows+'</tbody></table></div>',
    'التفكيك مطابق رياضياً لأن ماسكينجم عامل خطى: تتبّع (أ+ب) = تتبّع(أ) + تتبّع(ب). لذلك مجموع المكوّنات الثلاثة يساوى ناتج النموذج بالضبط دون بواقٍ.');

  var residPct = rt.volInRaw? (rt.volResid/rt.volInRaw*100) : null;
  s+=panel("الاتزان الحجمى للنافذة","V_in − V_out = ΔS + الفواقد",
    '<div class="grid g4">'
    +kpi("∑","","حجم الوارد الخام", nf(rt.volInRaw,0),"مليون م³","الديم + الأبيض + عطبرة")
    +kpi("∑","green","حجم الخارج عند حلفا", nf(rt.volOut,0),"مليون م³","بعد التتبّع")
    +kpi("◱","sand","تغيّر التخزين ΔS", rt.dS!==null?((rt.dS>0?"+":"")+nf(rt.dS,0)):"—","مليون م³","داخل المقاطع الأربعة")
    +kpi("Δ", (residPct!==null&&Math.abs(residPct)>2)?"danger":"green","الباقى بعد ΔS",
        residPct!==null?nf(residPct,3):"—","%","يقارب الصفر بالبناء")
    +'</div>',
    'الاتزان الصحيح خلال نافذة محدودة ليس V_in − V_out بل <b>V_in − V_out − ΔS</b>: جزء من الموجة يظل مخزّناً داخل المقاطع عند نهاية النافذة. '
    + 'وΔS محسوب من صيغة ماسكينجم نفسها S = K·[x·I + (1−x)·O] مجموعةً على كل المقاطع الفرعية. '
    + 'الباقى بعد خصم ΔS هو مقياس حفظ الكتلة الحقيقى، وأى انحراف فيه خلل عددى لا فقد مادى.');
  return s;
}

/* ---- 5. الشبكة والاتزان ---- */
function secNetwork(){
  if(!ST.q) return panel("الشبكة","جارٍ التحميل", skel(5));
  var s=panel("مخطط المجارى","سُمك المجرى متناسب مع التصرف الحى",
    '<div class="chart-box">'+networkSVG()+'</div>'
    +'<div class="legend"><span><i style="background:#247ba0"></i>النيل الأزرق</span>'
    +'<span><i style="background:#4d7c5a"></i>النيل الأبيض</span>'
    +'<span><i style="background:#b46f4b"></i>عطبرة</span>'
    +'<span><i style="background:#155b75"></i>الرئيسى</span></div>');

  ["khartoum","merowe"].forEach(function(node){
    var B=balanceNode(node); if(!B) return;
    var rows="";
    B.comp.forEach(function(c){
      rows+='<tr><td>'+esc(c.nm)+'</td><td class="num">'+nf(c.lag,1)+'</td>'
        +'<td class="num">'+nf(c.Q,0)+'</td><td class="num">'+nf(c.V,0)+'</td></tr>';
    });
    rows+='<tr class="hi"><td><b>المجموع الوارد</b></td><td class="num">—</td>'
      +'<td class="num">'+nf(B.sumQ,0)+'</td><td class="num">'+nf(B.sumV,0)+'</td></tr>'
      +'<tr><td><b>المنصرف</b></td><td class="num">—</td><td class="num">'+nf(B.Qout,0)+'</td><td class="num">'+nf(B.Vout,0)+'</td></tr>';
    var okV=Math.abs(B.closureVpct)<=(node==="khartoum"?5:8);
    s+=panel("الاتزان — "+B.nm,"لحظى مزاح + حجمى على "+B.window.days+" يوماً",
      '<div class="tb-wrap"><table class="tb"><thead><tr><th>المكوّن</th><th>الإزاحة (يوم)</th>'
      +'<th>التصرف اليوم (م³/ث)</th><th>الحجم (مليون م³)</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      +'<div class="grid g3" style="margin-top:13px">'
      +kpi("Δ", okV?"green":"sand","الانغلاق الحجمى", nf(B.closureVpct,2),"%", nf(B.closureV,0)+" مليون م³")
      +kpi("≈", Math.abs(B.wb.closurePct)<=8?"green":"sand","الانغلاق اللحظى", nf(B.wb.closurePct,2),"%", esc(B.wb.status))
      +kpi("⏱","","الإزاحة المطبَّقة", B.comp.map(function(c){return c.lag;}).join(" / "),"يوم","زمن انتقال الموجة")
      +'</div>',
      node==="khartoum"
        ? 'الملتقى مسافته كيلومترات وزمن العبور فيه ساعات، لذلك الإزاحة صفر والاتزان اللحظى صحيح هنا.'
        : 'شندى تبعد عن دنقلا أكثر من ٤٠٠ كم وعطبرة تصبّ بينهما — المقارنة بلا إزاحة تعطى عجزاً وهمياً، ولذلك تُزاح السلسلتان بزمن انتقال الموجة قبل الجمع. '
          + '<b>هذه محطات نموذج لا مقاطع تتبّع</b>، فتغيّر التخزين بينها غير معلوم؛ ولذلك يُقرأ الفرق كـ«باقٍ يشمل التخزين والفواقد وفروق التوقيت» لا كخطأ حفظ كتلة.');
  });

  /* المساهمة الخام لكل مصدر — تكمّل التراكب المُتتبَّع فى قسم «مِمّ يتكوّن الوارد؟» */
  var lab=[], val=[], col=[];
  [["eldiem","الديم","#247ba0"],["bnkhart","الأزرق/الخرطوم","#5fa3c4"],
   ["jaulia","الأبيض","#4d7c5a"],["atbara","عطبرة","#b46f4b"],
   ["sobat","السوباط","#7fa86b"],["malakal","ملكال","#4d7c5a"]].forEach(function(a){
    var v=cur(a[0]); if(v===null) return;
    lab.push(a[1]); val.push(v); col.push(a[2]);
  });
  if(lab.length) s+=panel("المساهمة الخام اليوم","تصرف كل مصدر عند محطته قبل التتبّع",
    '<div class="chart-box">'+barPlot({labels:lab, values:val, colors:col, yTitle:"م³/ث", h:250})+'</div>',
    'هذه قراءات المحطات كما هى — تختلف عن «التراكب الكمى» الذى يعرض مساهمة كل مصدر <b>بعد تتبّعها زمنياً حتى وادى حلفا</b>.');
  return s;
}

/* ---- 6. التتبّع والمعايرة ---- */
function secRouting(){
  if(!ST.q) return panel("التتبّع","جارٍ التحميل", skel(5));
  var rt=runRouting(); if(!rt) return panel("التتبّع","تعذّر الحساب","");
  var k=nowIdx();
  var s=scenBar();

  var ctrl='<div class="ctrl">';
  ST.reaches.forEach(function(R,i){
    ctrl+='<label style="margin-right:8px">'+esc(R.nm)+' — K</label>'
      +'<input type="number" step="0.5" min="0.5" max="20" value="'+R.K+'" data-rk="'+i+'">'
      +'<label>x</label><input type="number" step="0.05" min="0" max="0.5" value="'+R.x+'" data-rx="'+i+'">'
      +'<label>n</label><input type="number" step="1" min="1" max="12" value="'+R.n+'" data-rn="'+i+'">';
  });
  ctrl+='</div>';

  var rows="";
  ST.reaches.forEach(function(R,i){
    var r=[rt.r1,rt.r2,rt.r3,rt.r4][i];
    if(!r) return;
    rows+='<tr'+(r.stable?"":' class="hi"')+'><td><b>'+esc(R.nm)+'</b></td>'
      +'<td class="num">'+R.K.toFixed(1)+'</td><td class="num">'+R.x.toFixed(2)+'</td><td class="num">'+R.n+'</td>'
      +'<td class="num">'+r.Ks.toFixed(2)+'</td>'
      +'<td class="num">'+r.lo.toFixed(2)+' ≤ 1 ≤ '+r.hi.toFixed(2)+'</td>'
      +'<td><span class="pill '+(r.stable?"green":"danger")+'">'+(r.stable?"مستقر":"غير مستقر")+'</span></td>'
      +'<td>'+(R.lat? '<span class="pill sand">'+esc(stn(R.lat)?stn(R.lat).nm:R.lat)+' تدخل هنا</span>':'—')+'</td></tr>';
  });
  s+=panel("معاملات المقاطع","شرط الاستقرار: 2·(K/n)·x ≤ Δt ≤ 2·(K/n)·(1−x) عند Δt = يوم",
    ctrl+'<div class="tb-wrap"><table class="tb"><thead><tr><th>المقطع</th><th>K (يوم)</th><th>x</th>'
    +'<th>n</th><th>K/n</th><th>نطاق الاستقرار</th><th>الحالة</th><th>رافد جانبى</th></tr></thead><tbody>'+rows+'</tbody></table></div>',
    'المقطع الثانى قُسِّم عند <b>ملتقى عطبرة</b>: عطبرة تدخل عند رأس المقطع الثالث لا عند الخرطوم، '
    +'فتسافر مساهمتها '+nf(ST.reaches[2].K+ST.reaches[3].K,1)+' يوماً حتى حلفا بدلاً من '
    +nf(ST.reaches[1].K+ST.reaches[2].K+ST.reaches[3].K,1)+'. '
    +'الإصدار السابق كان يضيفها عند الخرطوم فيؤخّر ذروتها ويشوّه التركيب الكمى.');

  /* معمل المعايرة */
  var cal='<div class="actions"><button class="btn solid" id="cal-run"'+(ST.calibRunning?" disabled":"")+'>⚙ شغّل المعايرة على الـ٤٢ يوماً الماضية</button>'
    +(ST.calib?'<button class="btn" id="cal-apply">✓ اعتماد الموثوق فقط</button>':'')
    +(ST.reachesPrev?'<button class="btn" id="cal-undo">↺ رجوع للمعاملات السابقة</button>':'')+'</div>';
  if(ST.calib){
    var crows="";
    ST.calib.forEach(function(c,i){
      if(!c){ return; }
      var g=FIT.grade(c.best?c.best.m.KGE:null);
      var impr=(c.best&&c.cur.m)? (c.best.m.KGE-c.cur.m.KGE) : null;
      crows+='<tr><td><b>'+esc(ST.reaches[i].nm)+'</b><div style="font-size:9.5px;color:var(--muted)">'
        +esc(c.window.from)+' ← '+esc(c.window.to)+'</div></td>'
        +'<td class="num">'+c.cur.K+' / '+c.cur.x+' / '+c.cur.n+'</td>'
        +'<td class="num">'+(c.cur.m?nf(c.cur.m.KGE,3):"—")+'</td>'
        +'<td class="num"><b>'+(c.best?(c.best.K+" / "+c.best.x+" / "+c.best.n):"—")+'</b></td>'
        +'<td class="num">'+(c.best?nf(c.best.m.KGE,3):"—")+'</td>'
        +'<td class="num">'+(c.best?nf(c.best.m.NSE,3):"—")+'</td>'
        +'<td class="num">'+(c.best?nf(c.best.m.RMSE,0):"—")+'</td>'
        +'<td class="num">'+(c.best?nf(c.best.m.PBIAS,1)+"%":"—")+'</td>'
        +'<td class="num">'+(c.peak?(c.peak.dtDays+" ي / "+nf(c.peak.dQpct,1)+"%"):"—")+'</td>'
        +'<td><span class="pill '+g.cls+'">'+g.g+'</span>'+(impr!==null?'<div style="font-size:9px;color:var(--muted)">+'+nf(impr,3)+'</div>':'')+'</td>'
        +'<td><span class="pill '+(c.reliable?"green":"danger")+'">'+(c.reliable?"موثوقة":"ضعيفة التعريف")+'</span>'
        +'<div style="font-size:9px;color:var(--muted)">مدى/متوسط = '+nf(c.ident,2)+(c.hasPeak?"":" · بلا ذروة")+'</div></td></tr>';
    });
    cal+='<div class="tb-wrap"><table class="tb"><thead><tr><th>المقطع</th><th>الحالى K/x/n</th><th>KGE الحالى</th>'
      +'<th>المقترح K/x/n</th><th>KGE</th><th>NSE</th><th>RMSE</th><th>PBIAS</th><th>خطأ الذروة</th><th>التقييم</th><th>الموثوقية</th>'
      +'</tr></thead><tbody>'+crows+'</tbody></table></div>';
    var anyWeak=false;
    ST.calib.forEach(function(c){ if(c && !c.reliable) anyWeak=true; });
    if(anyWeak) cal+='<div class="banner warn"><span>⚠</span><div><b>لا تعتمد هذه المعايرة.</b> '
      +'نافذة المعايرة الحالية ساق صاعدة ملساء بلا ذروة واضحة، وفى هذه الحالة لا يكون K قابلاً للتعريف: '
      +'أى قيمة تقريباً تعطى KGE مرتفعاً، فيميل البحث الشبكى إلى أصغر K وأكبر x بلا معنى فيزيائى. '
      +'المعايرة السليمة تحتاج نافذة تحوى ذروة كاملة (صعود ثم هبوط) — أى موسماً تاريخياً من قسم المقارنة التاريخية.</div></div>';
  }
  s+=panel("معمل المعايرة","بحث شبكى على K وx وn بمعيار KGE — على الفترة الماضية فقط",
    cal,
    '<b>المرجع المستخدم للمعايرة هو GloFAS نفسه</b> عند المحطة المصبّية لكل مقطع، فهذه معايرة اتساق داخلى للنموذج لا مطابقة للواقع الميدانى. للمعايرة الحقيقية أدخل قياساتك من قسم «القياس والثقة». لا تُغيَّر المعاملات إلا بضغطك على زر الاعتماد.');

  s+=panel("تدرّج الموجة على المجرى","الهيدروجراف عند كل عقدة",
    '<div class="chart-box">'+plot({
      t:rt.t, nowIdx:k, yTitle:"التصرف (م³/ث)",

        {v:rt.atHalfa,color:"#b46f4b",wd:2.4},{v:rt.obsHalfa,color:"#155b75",wd:1.5,dash:"5 4"},

    +'<span><i style="background:#c58a2f"></i>دنقلا (بعد عطبرة)</span>'
    +'<span><i style="background:#b46f4b"></i>حلفا مُتتبَّع</span>'
    +'<span><i style="background:#155b75"></i>حلفا GloFAS</span>'
    +'<span><i style="background:#8a938f"></i>الوارد المُزاح</span></div>');

    +kpi("▼","sand","أقصى الخارج عند حلفا", nf(rt.pkOut.v,0),"م³/ث",
        rt.rising?"طرف النافذة — الموجة ما زالت صاعدة":"ذروة "+esc(rt.pkOut.t||"—"))
    +kpi("≈", rt.att===null?"sand":"green","استنفاد الذروة", rt.att!==null?nf(rt.att,1):"—","%",
        rt.att===null?"لا يُحسب قبل بلوغ الذروة":"مقارنة متزامنة بعد الإزاحة")
    +kpi("⏱","","زمن الوصول للديم", nf(rt.lag,1),"يوم",
        "الأبيض "+nf(rt.lagWhite,1)+" · عطبرة "+nf(rt.lagAtbara,1)+" يوم")
    +'</div>';
  if(rt.rising) s+='<div class="banner info"><span>ℹ</span><div>الذروتان تقعان على طرف نافذة التنبؤ، '
    +'أى أن الموجة لم تبلغ قمتها بعد. رقم الاستنفاد يُحجب عمداً لأن مقارنة طرفين ليست مقارنة ذروتين — '
    +'وهذا بالضبط الخطأ الذى كان يُنتج رقماً بلا معنى فى الإصدار الأول.</div></div>';
  return s;
}

/* ---- 7. الأمطار الحوضية ---- */
function secRain(){
  if(!ST.rain) return panel("المنابع","جارٍ تحميل أمطار الأحواض", skel(5));
  var k=rainNowIdx(), ri=rainIndex(), i;

  var s='<div class="grid g4">'
    + kpi("☂","","المؤشر الموزون — ماضٍ ٧ أيام", ri?nf(ri.past7,1):"—","مم","متوسط مساحى بأوزان المساهمة")
    + kpi("⟳", (ri&&ri.next7>ri.past7*1.2)?"danger":"green","المتوقع — قادم ٧ أيام", ri?nf(ri.next7,1):"—","مم",
        (ri&&ri.past7>0)?("نسبة التغيّر "+((ri.next7>ri.past7)?"+":"")+nf((ri.next7-ri.past7)/ri.past7*100,0)+"%"):"—")
    + kpi("▦","","خلايا نموذج المطر", RAIN_CELLS.length,"خلية", BASINS.length+" أحواض فرعية")
    + kpi("◉","sand","تشبّع الحوض الأزرق (API)", nf(apiIndex("blue"),1),"مم","متراكم مُنضِب ٢١ يوماً")
    + '</div>';

  s+='<div class="banner info"><span>ℹ</span><div><b>مصدر هذه الطبقة نموذج جوى لا قمر صناعى.</b> '
    +'الأمطار كلها — الماضية والقادمة — مخرجات نموذج Open-Meteo (ECMWF/GFS): الماضية <b>تحليل/إعادة تحليل</b> '
    +'وليست قياساً مطرياً أرضياً ولا رصداً قمرياً، والقادمة تنبؤ. '
    +'الشبكة ترفع دقة التمثيل المكانى ولا تُدخل مصدر رصد جديداً. '
    +'<b>لم يُربط بعد أى قمر صناعى بهذا التطبيق</b> — لا GPM ولا Sentinel ولا SWOT.</div></div>';

  if(ri && ri.past7>0 && ri.next7 > ri.past7*1.4){
    s+='<div class="banner warn"><span>⚠</span><div><b>تصاعد مطرى متوقع.</b> '
      +'المؤشر الموزون يقفز من '+nf(ri.past7,1)+' إلى '+nf(ri.next7,1)+' مم خلال الأسبوع القادم. '
      +'راجع جدول أزمنة الوصول أسفل الصفحة لمعرفة متى ينعكس ذلك على الوارد.</div></div>';
  }

  /* خريطة الخلايا */
  s+=panel("خريطة الأحواض","كل مربع خلية رصد — اللون شدة المطر المتوقع للأسبوع القادم (مخرج نموذج)",
    '<div class="chart-box">'+rainMapSVG(k+1, k+7)+'</div>'
    + '<div class="legend">'
    + '<span><i style="background:#eef2ea"></i>&lt; 5 مم</span>'
    + '<span><i style="background:#cfe0d2"></i>5–20</span>'
    + '<span><i style="background:#9ec7ae"></i>20–50</span>'
    + '<span><i style="background:#5fa3c4"></i>50–100</span>'
    + '<span><i style="background:#247ba0"></i>100–200</span>'
    + '<span><i style="background:#155b75"></i>&gt; 200</span>'
    + '<span><i style="background:#b8503f"></i>مركز ثقل المطر</span></div>',
    'الحدود مضلعات تقريبية مرسومة يدوياً لتقريب امتداد كل حوض فرعى — <b>ليست حدوداً هيدرولوجية رسمية</b>. '
    + 'المتوسط المساحى موزون بجيب تمام العرض لتصحيح تناقص مساحة الخلية شمالاً.');

  /* السلاسل الزمنية */
  var series=[], tt=ST.rain.t;
  BASINS.forEach(function(B){
    var v=[], j;
    for(j=0;j<tt.length;j++) v.push(arealMean(B.id, j, j));
    series.push({v:v, color:B.col, wd:2});
  });
  s+=panel("المتوسط المساحى اليومى","لكل حوض فرعى",
    '<div class="chart-box">'+plot({ t:tt, series:series, nowIdx:k, yTitle:"مم/يوم", zero:true })+'</div>'
    + '<div class="legend">'+BASINS.map(function(B){
        return '<span><i style="background:'+B.col+'"></i>'+esc(B.nm)+'</span>'; }).join("")+'</div>');

  /* الجدول الرئيسى */
  var rows="";
  BASINS.forEach(function(B){
    var p7=arealMean(B.id,k-6,k), n7=arealMean(B.id,k+1,k+7), n3=arealMean(B.id,k+1,k+3);
    var a20=areaOver(B.id,20,k+1,k+7), a50=areaOver(B.id,50,k+1,k+7), a100=areaOver(B.id,100,k+1,k+7);
    var mv=stormMove(B.id);
    rows+='<tr><td><b>'+esc(B.nm)+'</b><div style="font-size:9.5px;color:var(--muted)">'
      +basinCells(B.id).length+' خلية · وزن '+nf(B.w*100,0)+'%</div></td>'
      +'<td class="num">'+nf(p7,1)+'</td><td class="num">'+nf(n3,1)+'</td>'
      +'<td class="num"><b>'+nf(n7,1)+'</b></td>'
      +'<td class="num">'+nf(apiIndex(B.id),1)+'</td>'
      +'<td class="num">'+nf(a20,0)+'%</td><td class="num">'+nf(a50,0)+'%</td><td class="num">'+nf(a100,0)+'%</td>'
      +'<td style="font-size:10.5px">'+(mv? (esc(mv.dir)+" · "+nf(mv.km,0)+" كم") : "—")+'</td></tr>';
  });
  s+=panel("مؤشرات كل حوض","متوسط مساحى · تشبّع · مساحة التجاوز · حركة العاصفة",
    '<div class="tb-wrap"><table class="tb"><thead><tr><th>الحوض</th><th>ماضٍ ٧ي</th><th>قادم ٣ي</th>'
    +'<th>قادم ٧ي</th><th>API</th><th>مساحة&gt;٢٠مم</th><th>&gt;٥٠مم</th><th>&gt;١٠٠مم</th><th>حركة المركز</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div>',
    '<b>API</b> = المطر المتراكم السابق مُنضِباً بمعامل '+API_DECAY.toFixed(2)+' يومياً على ٢١ يوماً — كلما ارتفع كان الحوض أقرب للتشبّع '
    +'وحوّل نسبة أكبر من المطر إلى جريان. <b>مساحة التجاوز</b> أهم من المتوسط: ١٠٠ مم على ربع الحوض تولّد موجة، وعلى كامله بالتساوى تولّد أخرى مختلفة تماماً.');

  /* أزمنة الوصول */
  var lrows="";
  BASINS.forEach(function(B){
    var L=basinLag(B), n7=arealMean(B.id,k+1,k+7);
    lrows+='<tr><td><b>'+esc(B.nm)+'</b></td>'
      +'<td>'+esc(stn(B.target)?stn(B.target).nm:B.target)+'</td>'
      +'<td class="num">'+nf(L.toTarget,1)+'</td><td class="num">'+nf(L.routed,1)+'</td>'
      +'<td class="num"><b>'+nf(L.toHalfa,1)+'</b></td>'
      +'<td class="num">'+nf(n7,1)+'</td>'
      +'<td style="font-size:10.5px">'+esc(B.note)+'</td></tr>';
  });
  s+=panel("متى ينعكس مطر اليوم على الوارد؟","زمن التركيز + زمن التتبّع",
    '<div class="tb-wrap"><table class="tb"><thead><tr><th>الحوض</th><th>المحطة الهدف</th>'
    +'<th>زمن التركيز (يوم)</th><th>تتبّع حتى حلفا</th><th>الإجمالى</th><th>مطر قادم ٧ي</th><th>ملاحظة</th>'
    +'</tr></thead><tbody>'+lrows+'</tbody></table></div>',
    '<b>زمن التركيز تقديرى إرشادى</b> غير معايَر بقياس — يعطى ترتيب المقدار لا الرقم الدقيق. '
    +'زمن التتبّع مأخوذ من معاملات K الفعلية المعمول بها الآن، فيتغيّر مع أى تعديل فى قسم التتبّع. '
    +'أحواض السوباط والاستوائى مخمّدة عبر منطقة السدّ إلى حدّ يجعل مطرها إشارة موسمية لا إشارة إنذار.');
  return s;
}

/* ---- مرصد الأقمار — Sentinel-1 ---- */
function secSar(){
  var sel=ST.sar.sel, A=sarAoi(sel), D=ST.sar.data[sel];
  var opts="";
  SAR_AOIS.forEach(function(a){
    opts+='<option value="'+a.id+'"'+(a.id===sel?" selected":"")+'>'+esc(a.nm)+'</option>';
  });
  var ctrl='<div class="ctrl"><label>النطاق:</label><select id="sar-aoi">'+opts+'</select>'
    +'<button class="btn solid mini" id="sar-load"'+(ST.sar.loading?" disabled":"")+'>'
    +(ST.sar.loading===sel?"جارٍ الحساب…":"◎ احسب من Sentinel-1")+'</button>'
    +(ST.sar.credSrc? '<span class="pill green">اعتماد من '+esc(ST.sar.credSrc)+'</span>':'')
    +'</div>';

  var s=panel("مرصد الأقمار الصناعية","Sentinel-1 SAR — رادار يخترق السحب ويعمل ليلاً", ctrl,
    'الحساب يتم على خادم Copernicus عبر <b>Statistical API</b> ويعود رقماً — لا تُنزَّل أى صورة على جهازك. '
    +'النطاق المختار: '+esc(A.nm)+' · مساحته '+nf(sarAreaKm2(A),0)+' كم² · مدار '+esc(A.orbit==="ASCENDING"?"صاعد":"هابط")+' مثبَّت '
    +'(خلط المدارين يضيف ضوضاء زاوية السقوط). <b>'+esc(A.note)+'</b>');

  s+='<div class="banner warn"><span>⚠</span><div><b>حدّ مُعايَر بالتجربة لا مأخوذ من كتاب.</b> '
    +'عتبة الارتداد المطلقة تعطى <b>إيجابية كاذبة فوق الرمل الأملس</b>: عند −١٨ dB أعطى نطاق ملتقى عطبرة ٧٫٧٪ مياه '
    +'بينما النهر هناك لا يتجاوز ٣٪ من مساحته. وعند −٢٠ dB انخفض لـ١٫٨٪ لكن بحيرة ناصر هبطت من ٥٧٪ إلى ٤٦٪ وهى مياه دائمة. '
    +'<b>لا توجد عتبة واحدة تصلح للنطاقين</b> — لذلك: العتبة مضبوطة لكل نطاق على حدة، '
    +'و<b>الرقم الحاكم هو التغيّر النسبى لا المساحة المطلقة</b>، لأن الاتجاه ثبت أنه واحد عند العتبتين بينما المقدار لا.</div></div>';

  if(!D) return s+panel("لم يُحسب بعد","اضغط زر الحساب أعلاه",
    '<p class="note">يُجلب توكن Copernicus ثم تُحسب سلسلة نسبة المياه على '+SAR_INTERVAL.replace("P","").replace("D"," أيام")
    +' لكل فترة خلال آخر ~١٦٠ يوماً، عند عتبتين لبناء نطاق عدم اليقين. قد يستغرق نصف دقيقة.</p>');

  var C=sarChange(sel), AG=sarAgreement(sel);
  s+='<div class="grid g4">'
    + kpi("◎","","المساحة المائية الآن", nf(C.kmNow,0),"كم²","بالعتبة "+D.th+" dB — تقديرى")
    + kpi("~","sand","بالعتبة البديلة", nf(C.kmNowAlt,0),"كم²","بالعتبة "+D.thAlt+" dB — مدى عدم اليقين")
    + kpi("Δ", (C.main>5?"danger":(C.main<-5?"sand":"green")),"التغيّر منذ "+esc(C.from),
        (C.main>0?"+":"")+nf(C.main,1),"%","بالعتبة البديلة "+(C.alt>0?"+":"")+nf(C.alt,1)+"%")
    + kpi("✓", AG? AG.level.c : "", "درجة تأكيد القمر", AG? AG.level.g : "—","",
        AG? ("ارتباط "+nf(AG.r,3)+" مع "+(stn(AG.ref)?stn(AG.ref).nm:AG.ref)+" · "+AG.n+" نقطة") : "لا نقاط متطابقة كافية")
    + '</div>';

  if(C.conflict){
    s+='<div class="banner danger"><span>⚠</span><div><b>العتبتان تختلفان فى إشارة التغيّر</b> ('
      +(C.main>0?"+":"")+nf(C.main,1)+'٪ مقابل '+(C.alt>0?"+":"")+nf(C.alt,1)+'٪). '
      +'فى هذه الحالة <b>لا يُعتدّ بالتغيّر إطلاقاً</b> — الإشارة داخل ضوضاء العتبة، '
      +'والسبب غالباً رياح خشّنت سطح الماء أو رطوبة تربة غيّرت ارتداد اليابسة. أعد الحساب بعد المرور التالى.</div></div>';
  }

  if(C.conflict){
    s+='<div class="banner danger"><span>⚠</span><div><b>العتبتان تختلفان فى إشارة التغيّر</b> '
      +'('+nf(C.main,1)+'٪ مقابل '+nf(C.alt,1)+'٪) — لا يُعتدّ بهذا التغيّر ولا يُستشهد به. '
      +'السبب الغالب أن نسبة المياه قريبة من حدّ الكشف فى هذا النطاق، أو أن الرياح خشّنت السطح فى إحدى الفترات.</div></div>';
  }
  if(AG){
    if(AG.regulated){
      s+='<div class="banner info"><span>ℹ</span><div><b>اختبار التأكيد لا ينطبق على هذا النطاق.</b> '
        +'مساحة بحيرة ناصر تحكمها <b>قرارات تشغيل السد العالى</b> (سحب للرى ثم إعادة ملء) لا الوارد اللحظى عند وادى حلفا، '
        +'فالارتباط المحسوب هنا ('+nf(AG.r,3)+' على '+AG.n+' نقطة) <b>سالب بطبيعته وهذا صحيح فيزيائياً لا خطأ</b>: '
        +'البحيرة تنحسر فى الربيع للرى بينما الوارد يتصاعد. '
        +'قراءة هذا النطاق تكون كمؤشر تخزين لا كتحقق من الموجة.</div></div>';
    } else {
      s+='<div class="banner '+(AG.level.c==="green"?"ok":(AG.level.c==="danger"?"danger":"warn"))+'">'
        +'<span>'+(AG.level.c==="green"?"✓":"⚠")+'</span><div>'
        +'GloFAS يعطى عند '+esc(stn(A.ref)?stn(A.ref).nm:A.ref)+' تصرفاً قدره '+nf(cur(A.ref),0)+' م³/ث، '
        +'وأظهرت Sentinel-1 تغيّراً فى المسطح المائى قدره '+(C.main>0?"+":"")+nf(C.main,1)+'٪ منذ '+esc(C.from)+'. '
        +'درجة تأكيد القمر: <b>'+esc(AG.level.g)+'</b> — معامل ارتباط '+nf(AG.r,3)+' على '+AG.n+' نقطة زمنية '
        +'مع أرشيف تصرف نفس النافذة. <b>هذا تحقق مستقل تماماً</b>: مصدر الرادار لا علاقة له بنموذج GloFAS.'
        +'</div></div>';
    }
  }

  /* الرسم: سلسلتا العتبة + التصرف المرجعى */
  var tt=D.main.map(function(x){ return x.t; });
  var v1=D.main.map(function(x){ return x.f*D.area; });
  var v2=D.alt.map(function(x){ return x.f*D.area; });
  s+=panel("المساحة المائية عبر الزمن","العتبتان معاً كنطاق عدم يقين",
    '<div class="chart-box">'+plot({ t:tt, yTitle:"كم²", zero:false,
      bands:[{lo:v2, hi:v1, color:"#247ba0", op:0.22}],
      series:[{v:v1,color:"#155b75",wd:2.4},{v:v2,color:"#5fa3c4",wd:1.6,dash:"5 4"}] })+'</div>'
    +'<div class="legend">'
    +'<span><i style="background:#155b75"></i>عتبة '+D.th+' dB</span>'
    +'<span><i style="background:#5fa3c4"></i>عتبة '+D.thAlt+' dB</span>'
    +'<span><i style="background:#247ba0;opacity:.4"></i>المدى بين العتبتين</span></div>',
    'اتساع النطاق بين المنحنيين هو <b>عدم اليقين الحقيقى</b> فى الرقم المطلق. '
    +'ما يُعتدّ به هو تطابق <b>شكل</b> المنحنيين واتجاههما، لا تطابق قيمتيهما.');

  /* جدول الفترات */
  var rows="", i;
  for(i=0;i<D.main.length;i++){
    var f1=D.main[i].f, f2=(D.alt[i]?D.alt[i].f:null);
    var d1=(i>0 && D.main[i-1].f>0)? (f1-D.main[i-1].f)/D.main[i-1].f*100 : null;
    var qv=null, j;
    if(ST.q && ST.q[A.ref]) for(j=0;j<ST.q[A.ref].t.length;j++) if(ST.q[A.ref].t[j]===D.main[i].t) qv=ST.q[A.ref].q[j];
    rows+='<tr><td class="num" style="direction:ltr">'+esc(D.main[i].t)+'</td>'
      +'<td class="num">'+nf(f1*D.area,0)+'</td>'
      +'<td class="num">'+(f2!==null?nf(f2*D.area,0):"—")+'</td>'
      +'<td class="num" style="color:'+(d1!==null&&d1>2?"#b8503f":(d1!==null&&d1<-2?"#4d7c5a":"#66736f"))+'">'
      +(d1===null?"—":((d1>0?"+":"")+nf(d1,1)+"%"))+'</td>'
      +'<td class="num">'+(qv!==null?nf(qv,0):"—")+'</td></tr>';
  }
  s+=panel("الفترات","كل فترة "+SAR_INTERVAL.replace("P","").replace("D"," أيام")+" مقابل تصرف المحطة المرجعية",
    '<div class="tb-wrap"><table class="tb"><thead><tr><th>بداية الفترة</th><th>مساحة ('+D.th+'dB)</th>'

/* ---- 8. المقارنة التاريخية ---- */
function secClim(){
  var opts="";
  STATIONS.forEach(function(S){ if(!S.key) return;
    opts+='<option value="'+S.id+'"'+(S.id===ST.climStation?" selected":"")+'>'+esc(S.nm)+'</option>'; });
  var ctrl='<div class="ctrl"><label>المحطة:</label><select id="cl-st">'+opts+'</select>'
    +'<button class="btn solid mini" id="cl-load"'+(ST.climLoading?" disabled":"")+'>⟳ تحميل أرشيف ٢٠٠٦–'+(new Date().getFullYear()-1)+'</button></div>';

  if(!ST.clim) return panel("المقارنة التاريخية","موقع الموسم الحالى من السنوات السابقة", ctrl,
    'يُجلب الأرشيف من إعادة تحليل GloFAS لنفس النافذة من كل سنة، ثم يُحسب الوسيط والمئينان ١٠ و٩٠ لكل يوم تقويمى. <b>هذا الأرشيف هو مصدر العتبات الافتراضية</b> — يُحمَّل تلقائياً لوادى حلفا عند الإقلاع.');
  var ys=Object.keys(ST.clim.years);
  if(ST.climLoading||!ys.length) return panel("المقارنة التاريخية","جارٍ تحميل الأرشيف",
    ctrl+'<p class="loading-note">تم تحميل '+ST.clim.done+' من '+ST.clim.total+' سنة…</p>'+skel(4));

  var d=ST.q[ST.clim.station], n=d?d.t.length:76, med=[],p10=[],p90=[],i,y;
  for(i=0;i<n;i++){
    var col=[];
    for(y=0;y<ys.length;y++){ var a=ST.clim.years[ys[y]];
      if(a&&a[i]!==null&&a[i]!==undefined&&!isNaN(a[i])) col.push(a[i]); }
    col.sort(function(p,q){return p-q;});
    med.push(col.length?quantile(col,0.5):null);
    p10.push(col.length?quantile(col,0.10):null);
    p90.push(col.length?quantile(col,0.90):null);
  }
  var k=nowIdx(), todayV=d?d.q[k]:null, tc=[];
  for(y=0;y<ys.length;y++){ var aa=ST.clim.years[ys[y]]; if(aa&&aa[k]!==null&&!isNaN(aa[k])) tc.push(aa[k]); }
  tc.sort(function(p,q){return p-q;});
  var rank=null;
  if(todayV!==null&&tc.length){ var c=0; for(i=0;i<tc.length;i++) if(tc[i]<=todayV) c++; rank=c/tc.length*100; }

  var s=panel("المقارنة التاريخية","الموسم الحالى مقابل مناخ "+ys.length+" سنة — "+(stn(ST.clim.station)?stn(ST.clim.station).nm:""),
    ctrl+'<div class="chart-box">'+plot({
      t:d.t, nowIdx:k, yTitle:"التصرف (م³/ث)",
      bands:[{lo:p10,hi:p90,color:"#4d7c5a",op:0.18}],
      series:[{v:med,color:"#4d7c5a",wd:2,dash:"6 4"},{v:d.q,color:"#b46f4b",wd:2.6,mark:k}]
    })+'</div>'
    +'<div class="legend"><span><i style="background:#b46f4b"></i>الموسم الحالى</span>'
    +'<span><i style="background:#4d7c5a"></i>الوسيط التاريخى</span>'
    +'<span><i style="background:#4d7c5a;opacity:.3"></i>المدى ١٠–٩٠٪</span></div>');

  s+='<div class="grid g3" style="margin-top:15px">'
    +kpi("◈", rank!==null&&rank>=75?"danger":(rank!==null&&rank<=25?"sand":"green"),
      "المئين التاريخى لليوم", rank!==null?nf(rank,0):"—","%",
      rank===null?"—":(rank>=75?"أعلى من ثلاثة أرباع السنوات":(rank<=25?"أدنى من ثلاثة أرباع السنوات":"داخل النطاق المعتاد")))
    +kpi("≡","","الوسيط التاريخى اليوم", nf(med[k],0),"م³/ث", ys.length+" سنة")
    +kpi("Δ",(todayV&&med[k]&&todayV<med[k])?"sand":"green","الفرق عن الوسيط",
      (todayV&&med[k])?((todayV>med[k]?"+":"")+nf((todayV-med[k])/med[k]*100,1)):"—","%","الموسم مقابل المناخ")
    +'</div>';

  /* أقرب السنوات شبهاً بالشكل لا بالتاريخ */
  var sims=[];
  ys.forEach(function(yy){
    var a=ST.clim.years[yy]; if(!a) return;
    var num=0,cnt=0,j;
    for(j=Math.max(0,k-30);j<=k;j++){
      if(a[j]===null||isNaN(a[j])||d.q[j]===null||isNaN(d.q[j])) continue;
      num+=Math.abs(a[j]-d.q[j])/Math.max(1,d.q[j]); cnt++;
    }
    if(cnt>5) sims.push({y:yy, err:num/cnt*100, pk:peakOf(a,d.t)});
  });
  sims.sort(function(p,q){return p.err-q.err;});
  var srows="";
  sims.slice(0,5).forEach(function(a,i){
    srows+='<tr'+(i===0?' class="hi"':'')+'><td><b>'+a.y+'</b></td><td class="num">'+nf(a.err,1)+'%</td>'
      +'<td class="num">'+nf(ST.clim.years[a.y][k],0)+'</td>'
      +'<td class="num">'+nf(a.pk.v,0)+'</td><td class="num" style="direction:ltr">'+esc(a.pk.t||"—")+'</td></tr>';
  });
  s+=panel("أقرب السنوات شبهاً بالموجة الحالية","بمطابقة شكل الـ٣٠ يوماً الماضية لا بنفس التاريخ",
    '<div class="tb-wrap"><table class="tb"><thead><tr><th>السنة</th><th>متوسط الفرق النسبى</th>'
    +'<th>نفس اليوم (م³/ث)</th><th>ذروة النافذة</th><th>تاريخها</th></tr></thead><tbody>'+srows+'</tbody></table></div>',
    'المطابقة على <b>شكل الموجة</b>: متوسط الفرق النسبى المطلق على الثلاثين يوماً الماضية. السنة الأقل فرقاً هى أقرب سابقة يمكن الاستئناس بمسارها اللاحق.');
  return s;
}

function secObs(){
  var opts="";
  STATIONS.forEach(function(S){ if(!S.key) return;
    opts+='<option value="'+S.id+'"'+(S.id===(ST.obsStation||"halfa")?" selected":"")+'>'+esc(S.nm)+'</option>'; });

  var s='<div class="ctrl"><label>اسم المُدخِل (يُقيَّد فى سجل التدقيق)</label>'

    +'<button class="btn mini" id="usr-save">حفظ</button></div>';

  var form='<div class="ctrl">'
    +'<label>المحطة</label><select id="ob-st">'+opts+'</select>'
    +'<label>التاريخ</label><input type="date" id="ob-date" value="'+todayISO()+'">'
    +'<label>التصرف المقيس (م³/ث)</label><input type="number" step="1" id="ob-q" placeholder="مثال 10500">'
    +'<button class="btn solid mini" id="ob-save">حفظ القياس</button></div>';

  s=panel("إدخال قياس ميدانى","يُحفظ فى قاعدة الإدارة ويُقيَّد باسم المُدخِل", s+form,
    'شروط اعتماد التصحيح: <b>'+OBS_MIN_N+' قياسات صالحة فأكثر</b> · خلال <b>'+OBS_MAX_AGE_D+' يوماً</b> · '
    +'موزّعة على مدى تصرفات لا نقطة واحدة (أقصى/أدنى ≥ '+OBS_MIN_SPAN.toFixed(2)+'×) · بعد رفض الشواذّ (|z| > 2). '
    +'وعند اكتمالها يُبنى <b>منحنى تصحيح خطى</b> (مقيس = a·نموذج + b) لا معامل نسبة ثابت.');

  /* حالة كل محطة */
  var rows="";

    rows+='<tr><td><b>'+esc(S.nm)+'</b></td>'
      +'<td class="num">'+nf(v,0)+'</td>'
      +'<td class="num">'+(cq!==null?nf(cq,0):"—")+'</td>'
      +'<td class="num">'+(bm.n||0)+'</td>'
      +'<td class="num">'+(bm.span?nf(bm.span,2)+"×":"—")+'</td>'
      +'<td class="num">'+(bm.valid?("a="+nf(bm.fit.a,3)+" · b="+nf(bm.fit.b,0)):"—")+'</td>'
      +'<td>'+conf(cg.grade)+'</td>'
      +'<td>'+(bm.valid? stampPill("corr") : stampPill("model"))
        +'<div style="font-size:9px;color:var(--muted)">'+esc(bm.reason)+'</div></td></tr>';
  });
  s+=panel("حالة التصحيح لكل محطة","المنحنى لا يُطبَّق إلا باكتمال الشروط",
    '<div class="tb-wrap"><table class="tb"><thead><tr><th>المحطة</th><th>النموذج</th><th>المصحَّح</th>'
    +'<th>قياسات صالحة</th><th>مدى التغطية</th><th>منحنى التصحيح</th><th>الموثوقية</th><th>الحالة</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div>');

  /* تفصيل معايير الموثوقية */
  var crows="";
  STATIONS.forEach(function(S){
    if(!S.key) return;
    var c=cellReliability(S.id);
    crows+='<tr><td><b>'+esc(S.nm)+'</b></td>'
      +'<td class="num">'+nf(c.km,1)+' كم</td><td class="num">'+nf(c.sD,0)+'</td>'
      +'<td class="num">'+(c.r!==null?nf(c.r,3):"—")+(c.lag!==null&&c.lag!==undefined?' <span style="font-size:9px;color:var(--muted)">@'+c.lag+'ي · '+esc(c.refMode||"")+'</span>':'')+'</td><td class="num">'+nf(c.sR,0)+'</td>'
      +'<td class="num">'+(c.ratio!==null?nf(c.ratio,2)+"×":"—")+'</td><td class="num">'+nf(c.sP,0)+'</td>'
      +'<td class="num"><b>'+nf(c.score,0)+'</b></td><td>'+conf(c.grade)+'</td></tr>';
  });
  s+=panel("معايير موثوقية الخلية","مؤشر مركّب لا مسافة وحدها",
    '<div class="tb-wrap"><table class="tb"><thead><tr><th>المحطة</th><th>المسافة</th><th>درجة القرب</th>'
    +'<th>أعلى ارتباط (إزاحة)</th><th>درجة المسار</th><th>نسبة الحجم</th><th>درجة المعقولية</th>'
    +'<th>المجموع</th><th>الدرجة</th></tr></thead><tbody>'+crows+'</tbody></table></div>',
    'القرب المكانى وحده لا يكفى: خلية على بُعد ٣ كم قد تقع على فرع آخر تماماً. '
    +'لذلك يدخل <b>الارتباط مع المحطة التالية على المجرى</b> بوزن مساوٍ — ويُحسب على <b>أفضل إزاحة زمنية من ٠ إلى ٧ أيام</b> لا على نفس اليوم، لأن الموجة تصل المصبّ بعد أيام؛ والإزاحة المثلى معروضة بجوار المعامل وهى فى ذاتها تقدير مستقل لزمن العبور. <b>وعند الملتقيات يُقارَن الرافد بباقى المصبّ بعد طرح شقيقه</b> — بدون ذلك يظهر النيل الأبيض بارتباط سالب لأنه شبه ثابت بينما مصبّه يرتفع بالأزرق، فيُعاقَب ظلماً. '
    +'ويبقى الحكم القاطع هو القياس الميدانى: محطة عليها منحنى تصحيح معتمد تأخذ A مباشرة.');

  /* القياسات المسجّلة */
  var orows="", any=false;
  STATIONS.forEach(function(S){
    if(!S.key) return;
    var bm=biasModel(S.id);
    (bm.pairs||[]).forEach(function(p){
      any=true;
      orows+='<tr'+(p.out?' class="hi"':'')+'><td><b>'+esc(S.nm)+'</b></td>'
        +'<td class="num" style="direction:ltr">'+esc(p.date)+'</td>'
        +'<td class="num">'+nf(p.obs,0)+'</td><td class="num">'+nf(p.mod,0)+'</td>'
        +'<td class="num" style="color:'+(Math.abs(p.ratio-1)>0.15?"#b8503f":"#4d7c5a")+'">'
        +((p.ratio-1)>0?"+":"")+nf((p.ratio-1)*100,1)+'%</td>'
        +'<td class="num">'+nf(p.age,0)+' يوم</td>'
        +'<td>'+(p.out?'<span class="pill danger">شاذّ — مرفوض</span>':'<span class="pill green">مقبول</span>')+'</td></tr>';
    });
  });
  if(any) s+=panel("القياسات المسجّلة","مع نتيجة فحص الشذوذ",
    '<div class="tb-wrap"><table class="tb"><thead><tr><th>المحطة</th><th>التاريخ</th><th>مقيس</th>'
    +'<th>نموذج</th><th>الانحياز</th><th>العمر</th><th>الفحص</th></tr></thead><tbody>'+orows+'</tbody></table></div>');

  s+=panel("سُلَّم الأختام","ماذا يعنى كل ختم",
    '<div class="tb-wrap"><table class="tb"><tbody>'
    +'<tr><td style="width:22%">'+stampPill("obs")+'</td><td>رقم مقيس ميدانياً ومقيَّد باسم مُدخِله.</td></tr>'
    +'<tr><td>'+stampPill("corr")+'</td><td>ناتج نموذج مضروب فى منحنى تصحيح مستوفٍ للشروط أعلاه.</td></tr>'
    +'<tr><td>'+stampPill("model")+'</td><td>ناتج GloFAS أو التتبّع بلا قياس مرجعى — يُستأنس به.</td></tr>'
    +'<tr><td>'+stampPill("scen")+'</td><td>محسوب على افتراض سيناريو اخترته أنت، لا على الوارد الحى.</td></tr>'
    +'<tr><td>'+stampPill("hist")+'</td><td>مشتقّ من أرشيف إعادة التحليل لا من التنبؤ.</td></tr>'
    +'</tbody></table></div>');
  return s;
}

  }

  s+=panel("سجل الإنذارات","كل إنذار بسببه الرقمى وحالة متابعته",
    arows? ('<div class="tb-wrap"><table class="tb"><thead><tr><th>التاريخ</th><th>المستوى</th><th>التصرف</th>'

      +'</tr></thead><tbody>'+arows+'</tbody></table></div>')

    +'بعد مرور المدة يقارن التطبيق كل تنبؤ بما حدث ويحسب الخطأ. <b>سجّل مرة واحدة يومياً</b>.');

  if(!rows.length) return s+panel("لا سجلات بعد","التقييم يبدأ بعد أول تسجيل",

    +'</div>';

    +'<tr><td><b>نصوص قديمة</b></td><td>صُحّحت ثلاثة نصوص تخلّفت عن الكود: عدد الأعضاء (٥١ ← '+NMEM+')، وإزاحات الاتزان (٢٫٠/١٫٥ ← ٣٫٥/٣٫٥)، ووصف ثقة الخلية بأنها مسافة فقط.</td></tr>'
    +'</tbody></table></div>');

  s+=panel("الأقمار الصناعية — الوضع الصريح","ما هو رصد وما هو نمذجة",
    '<div class="banner info"><span>ℹ</span><div>'
    +'<b>المربوط فعلياً: Sentinel-1 وحده</b> (رادار SAR عبر Copernicus Data Space) فى قسم «مرصد الأقمار» — '
    +'وهو رصد حقيقى يقيس المسطح المائى على أربعة نطاقات. '
    +'<b>وما ليس رصداً:</b> شبكة الـ'+RAIN_CELLS.length+' خلية المطرية مخرج نموذج جوى لا قمر صناعى، وتصرفات المحطات مخرج نموذج GloFAS لا قياس. '
    +'<b>وغير المربوط:</b> GPM–IMERG (يحتاج توثيق NASA Earthdata بلا CORS، أى خدمة وسيطة) وSentinel-2 وSWOT وSMAP والألتيمترى.'
    +'</div></div>');

  s+=panel("ما لا يفعله التطبيق","حدود صريحة",
    '<div class="tb-wrap"><table class="tb"><tbody>'
    +'<tr><td style="width:32%"><span class="pill danger">لا يفعل</span></td>'
    +'<td>لا يحاكى تشغيل سد النهضة أو أى خزان · لا يمثّل توأم بحيرة ناصر (مؤجَّل بقرارك لعدم توفر المنسوب ومنحنى التخزين الرسمى) · '
    +'لا ينتج خرائط غمر بـDEM · لا يصدر عتبات رسمية · لا يستبدل القياس الميدانى · لا يستنتج تصرفاً ولا تخزيناً من مساحة المسطح المائى · لا يستخدم حدود أحواض رسمية — مضلعات الأحواض <b>مرسومة يدوياً تقريبياً</b>، وللاعتماد التشغيلى تُستبدل بحدود HydroBASINS أو حدود معتمدة من الوزارة.</td></tr>'
    +'</tbody></table></div>');

  s+=panel("تنبيه أمنى جديد","بيانات اعتماد Copernicus",
    '<div class="banner danger"><span>⚠</span><div>'
    +'<b>مفتاح Copernicus السرّى مخزَّن فى قاعدة مفتوحة بلا مصادقة</b> (المسار sh_config)، مُرمَّزاً بـbase64 — '
    +'و<b>base64 ترميز لا تشفير</b>، يفكّه أى أحد فى ثانية. من يعرف رابط القاعدة يستطيع أخذ المفتاح '
    +'واستنفاد حصّتك على Copernicus أو استخدامها باسمك. هذا التطبيق يقرأ المفتاح ولا يعرضه إطلاقاً، '
    +'لكن الخطر قائم من مصدره لا منه. العلاج: تقييد قواعد القاعدة على مسار sh_config وحده — '
    +'تعديل صغير لا يمسّ باقى تطبيقاتك.</div></div>');

  s+=panel("أمان القاعدة","الوضع الحالى بقرارك",
    '<div class="banner warn"><span>⚠</span><div>القاعدة مفتوحة للقراءة والكتابة <b>بلا مصادقة</b> — '
    +'من يعرف العنوان يستطيع تعديل العتبات والقياسات والإنذارات وحالة تنفيذها. '
    +'البديل المعتمد حالياً هو <b>سجل تدقيق</b> يقيّد من فعل ماذا ومتى وبأى جهاز — '
    +'وهو ضبط تتبّع لا ضبط صلاحيات: يُثبت الفعل ولا يمنعه. '
    +'حين تقرّر تفعيل المصادقة يصير التطبيق نظاماً تشغيلياً كاملاً؛ حتى ذلك الحين يُقرأ كنموذج تحليلى متقدّم.</div></div>');
  return s;
}

/* ---------------------------------------------------------------
   التوجيه والربط
   --------------------------------------------------------------- */
function render(){
  var c=$("content"); if(!c) return;
  var h="";
  if(ST.sec==="command")       h=secCommand();
  else if(ST.sec==="finger")   h=secFinger();
  else if(ST.sec==="ensemble") h=secEnsemble();
  else if(ST.sec==="compose")  h=secCompose();
  else if(ST.sec==="network")  h=secNetwork();
  else if(ST.sec==="routing")  h=secRouting();
  else if(ST.sec==="rain")     h=secRain();
  else if(ST.sec==="sar")      h=secSar();
  else if(ST.sec==="clim")     h=secClim();
  else if(ST.sec==="obs")      h=secObs();
  else if(ST.sec==="alerts")   h=secAlerts();
  else if(ST.sec==="skill")    h=secSkill();
  else if(ST.sec==="sources")  h=secSources();
  c.innerHTML=h;
  bindControls();
}

function bindControls(){
  var i,els;
  function each(sel,fn){ var e=document.querySelectorAll(sel),j; for(j=0;j<e.length;j++) fn(e[j]); }

  each("[data-scen]",function(b){ b.onclick=function(){ ST.scen=this.getAttribute("data-scen"); render(); }; });

  each("[data-rk],[data-rx],[data-rn]",function(b){
    b.onchange=function(){
      var idx,key;
      if(this.hasAttribute("data-rk")){ idx=+this.getAttribute("data-rk"); key="K"; }
      else if(this.hasAttribute("data-rx")){ idx=+this.getAttribute("data-rx"); key="x"; }
      else { idx=+this.getAttribute("data-rn"); key="n"; }
      var v=parseFloat(this.value);
      if(!isNaN(v)&&v>0) ST.reaches[idx][key]=(key==="n")?Math.round(v):v;
      render();
    };
  });

  each("[data-thr]",function(b){
    b.onchange=function(){ var v=parseFloat(this.value);
      if(!isNaN(v)){ ST.thr[this.getAttribute("data-thr")]=v; } render(); };
  });

  var el;
  el=$("thr-save"); if(el) el.onclick=function(){
    ST.thrManual={a:ST.thr.a,b:ST.thr.b,c:ST.thr.c};
    auditLog("اعتماد عتبات", "متابعة "+ST.thr.a+" · تأهّب "+ST.thr.b+" · إنذار "+ST.thr.c);
    MwriDb.patch("apps/"+APPID+"/data/thresholds", ST.thrManual)
      .then(function(){ ST.thrSrc="يدوية"; render(); })
      .catch(function(e){ netErr("تعذّر حفظ العتبات", e); });
  };
  each("[data-basis]",function(b){ b.onclick=function(){
    ST.thrBasis=this.getAttribute("data-basis");
    ST.thrManual=null; applyClimThresholds(); render(); }; });

  el=$("thr-reset"); if(el) el.onclick=function(){
    ST.thrManual=null;
    MwriDb.remove("apps/"+APPID+"/data/thresholds").catch(function(){});
    if(ST.thrClim){ ST.thr=ST.thrClim; ST.thrSrc="تاريخية"; } else { ST.thr=fallbackThresholds(); ST.thrSrc="مؤقتة"; }
    render();
  };

  el=$("cl-st"); if(el) el.onchange=function(){ ST.climStation=this.value; ST.clim=null; render(); };
  el=$("cl-load"); if(el) el.onclick=function(){ loadClimatology(ST.climStation); };
  el=$("mem-load"); if(el) el.onclick=function(){
    this.disabled=true; loadMembers().then(render).catch(function(){ render(); }); };

  el=$("fday"); if(el) el.oninput=function(){ ST.fingerDay=+this.value; render(); };
  el=$("fday-now"); if(el) el.onclick=function(){ ST.fingerDay=nowIdx(); render(); };

  el=$("sar-aoi"); if(el) el.onchange=function(){ ST.sar.sel=this.value; render(); };
  el=$("sar-load"); if(el) el.onclick=function(){ sarLoad(ST.sar.sel); };

  el=$("cal-run"); if(el) el.onclick=function(){
    ST.calibRunning=true; render();
    setTimeout(function(){ ST.calib=calibrateAll(); ST.calibRunning=false; render(); }, 30);
  };
  el=$("cal-apply"); if(el) el.onclick=function(){
    if(!ST.calib) return;
    var ok=[], skip=[];
    ST.calib.forEach(function(c,i){
      if(c && c.best && c.reliable) ok.push(i); else skip.push(i);
    });
    if(!ok.length){
      netErr("لا مقطع موثوق للاعتماد", new Error("كل المقاطع ضعيفة التعريف على هذه النافذة — المعايرة مرفوضة"));
      return;
    }
    var names=ok.map(function(i){ return ST.reaches[i].nm; }).join("، ");
    if(!window.confirm("سيُعتمد "+ok.length+" مقطعاً موثوقاً: "+names
        +(skip.length?("\n\nويُستبعد "+skip.length+" مقطعاً ضعيف التعريف."):"")
        +"\n\nهل تعتمد؟")) return;
    ST.reachesPrev = JSON.parse(JSON.stringify(ST.reaches));
    var det=[];
    ok.forEach(function(i){
      var c=ST.calib[i];
      det.push(ST.reaches[i].nm+": "+ST.reaches[i].K+"/"+ST.reaches[i].x+"/"+ST.reaches[i].n
        +" ← "+c.best.K+"/"+c.best.x+"/"+c.best.n);
      ST.reaches[i].K=c.best.K; ST.reaches[i].x=c.best.x; ST.reaches[i].n=c.best.n;
    });
    MwriDb.patch("apps/"+APPID+"/data/reaches", {r:JSON.stringify(ST.reaches)}).catch(function(){});
    auditLog("اعتماد معايرة", det.join(" · "));
    render();
  };
  el=$("cal-undo"); if(el) el.onclick=function(){
    if(!ST.reachesPrev) return;
    ST.reaches=JSON.parse(JSON.stringify(ST.reachesPrev));
    ST.reachesPrev=null;
    MwriDb.patch("apps/"+APPID+"/data/reaches", {r:JSON.stringify(ST.reaches)}).catch(function(){});
    auditLog("رجوع عن معايرة", "استعادة المعاملات السابقة");
    render();
  };

  el=$("usr-save"); if(el) el.onclick=function(){
    var v=$("usr")? $("usr").value : "";
    ST.user=String(v||"").slice(0,60);
    try{ localStorage.setItem("mwri_user", ST.user); }catch(e){}
    MwriDb.patch("apps/"+APPID+"/data/user", {name:ST.user}).catch(function(){});
    render();
  };

  el=$("ob-save"); if(el) el.onclick=function(){
    var sid=$("ob-st").value, dt=$("ob-date").value, q=parseFloat($("ob-q").value);
    if(!sid||!dt||isNaN(q)){ netErr("بيانات القياس ناقصة", new Error("املأ المحطة والتاريخ والتصرف")); return; }
    ST.obsStation=sid;
    ST.obs[sid]=ST.obs[sid]||{};
    ST.obs[sid][dt]={q:q, at:Date.now(), by:ST.user||"غير محدد"};
    auditLog("قياس ميدانى", (stn(sid)?stn(sid).nm:sid)+" · "+dt+" · "+q+" م³/ث");
    MwriDb.patch("apps/"+APPID+"/data/obs/"+sid+"/"+dt, {q:q, by:ST.user||"غير محدد"})
      .then(function(){ render(); })
      .catch(function(e){ netErr("تعذّر حفظ القياس (حُفظ محلياً وسيُرفع تلقائياً)", e); render(); });
  };
  el=$("ob-st"); if(el) el.onchange=function(){ ST.obsStation=this.value; };

  el=$("al-new"); if(el) el.onclick=function(){
    var q=cur("halfa"), lvl=alertLevel(q), ens=runEnsemble();
    var stB=ens? ensembleThresholdStats(ens, ST.thr.b) : null;
    var id=String(Date.now());
    var A={ at:Date.now(), level:lvl.k, levelName:lvl.nm, q:q, thr:ST.thr.b,
      prob: stB? stB.prob : null, eta: stB? stB.firstMed : null,
      to: ($("al-to")?$("al-to").value:"") || "", action: ($("al-act")?$("al-act").value:"") || "",
      status:"مُصدَر" };
    A.by=ST.user||"غير محدد";
    ST.alerts[id]=A;
    auditLog("إصدار إنذار", A.levelName+" · "+nf(q,0)+" م³/ث · "+(A.to||"—"));
    MwriDb.patch("apps/"+APPID+"/data/alerts/"+id, A).catch(function(e){ netErr("تعذّر حفظ الإنذار", e); });
    render();
  };
  each("[data-ack]",function(b){ b.onclick=function(){
    var id=this.getAttribute("data-ack");
    ST.alerts[id].status="تم الاطلاع";
    auditLog("اطّلاع على إنذار", id);
    MwriDb.patch("apps/"+APPID+"/data/alerts/"+id, {status:"تم الاطلاع", ackBy:ST.user||"غير محدد"}).catch(function(){});
    render(); }; });
  each("[data-done]",function(b){ b.onclick=function(){
    var id=this.getAttribute("data-done");
    ST.alerts[id].status="نُفّذ";
    auditLog("تنفيذ إنذار", id);
    MwriDb.patch("apps/"+APPID+"/data/alerts/"+id, {status:"نُفّذ", doneBy:ST.user||"غير محدد"}).catch(function(){});
    render(); }; });

  el=$("log-save"); if(el) el.onclick=function(){
    var e=buildLogEntry(); if(!e) return;
    ST.log[e.date]=e;
    MwriDb.patch("apps/"+APPID+"/data/log/"+e.date, e).catch(function(er){ netErr("تعذّر حفظ السجل", er); });
    render();
  };
  el=$("log-reload"); if(el) el.onclick=function(){ loadDbState().then(render).catch(function(){ render(); }); };
}

function buildNav(){
  var nav=$("nav"), mob=$("mobnav");
  if(nav) nav.innerHTML=""; if(mob) mob.innerHTML="";
  SECTIONS.forEach(function(s,i){
    if(nav){
      var b=document.createElement("button");
      b.setAttribute("data-id",s.id);
      b.innerHTML='<span class="nav-icon">'+s.icon+'</span><span>'+esc(s.title)+'</span>'
        +'<span class="nav-num">'+("0"+(i+1)).slice(-2)+'</span>';
      b.onclick=function(){ selectSection(s.id); };
      nav.appendChild(b);
    }
    if(mob){
      var m=document.createElement("button");
      m.setAttribute("data-id",s.id);
      m.textContent=s.title;
      m.onclick=function(){ selectSection(s.id); };
      mob.appendChild(m);
    }
  });
}
function selectSection(id){
  var sec=null,i;
  for(i=0;i<SECTIONS.length;i++) if(SECTIONS[i].id===id) sec=SECTIONS[i];
  if(!sec) return;
  ST.sec=id;
  var b=document.querySelectorAll("#nav button, #mobnav button");
  for(i=0;i<b.length;i++) b[i].classList.toggle("active", b[i].getAttribute("data-id")===id);
  $("tb-eyebrow").textContent=sec.eyebrow;
  $("tb-title").textContent=sec.title;
  render();
  window.scrollTo(0,0);
}
function setConn(ok,msg){
  var d=$("dot"), c=$("conn");
  if(d) d.style.background= ok? "var(--green)":"var(--danger)";
  if(c) c.textContent=msg;
}
function setSync(state, detail, queued){
  var e=$("syncbadge"); if(!e) return;
  var map={ok:["green","القاعدة متصلة"], connecting:["sand","جارٍ الاتصال بالقاعدة"],
    queued:["sand","مؤجَّل ("+queued+")"], error:["danger","خطأ قاعدة"], init:["lake","—"]};
  var m=map[state]||map.init;
  e.className="pill "+m[0];
  e.textContent=m[1]+(detail?(" — "+String(detail).slice(0,60)):"");
}

function loadDbState(){
  return Promise.all([
    MwriDb.get("apps/"+APPID+"/data/thresholds").catch(function(){ return null; }),
    MwriDb.get("apps/"+APPID+"/data/obs").catch(function(){ return null; }),
    MwriDb.get("apps/"+APPID+"/data/alerts").catch(function(){ return null; }),
    MwriDb.get("apps/"+APPID+"/data/log").catch(function(){ return null; }),
    MwriDb.get("apps/"+APPID+"/data/reaches").catch(function(){ return null; }),
    MwriDb.get("apps/"+APPID+"/data/audit").catch(function(){ return null; })
  ]).then(function(r){
    if(r[0]&&typeof r[0].a==="number"){ ST.thrManual={a:r[0].a,b:r[0].b,c:r[0].c}; ST.thr=ST.thrManual; ST.thrSrc="يدوية"; }
    ST.obs   = r[1]||{};
    ST.alerts= r[2]||{};
    ST.log   = r[3]||{};
    ST.audit = r[5]||{};
    if(r[4] && r[4].r){
      try{
        var rr=JSON.parse(r[4].r);
        if(rr && rr.length===REACHES.length) ST.reaches=rr;   /* المعاملات المعتمدة تعود بعد إعادة الفتح */
      }catch(e){}
    }
    try{ ST.user = localStorage.getItem("mwri_user") || ""; }catch(e){}
    return true;
  });
}

function publish(){
  if(!ST.q) return;
  /* العتبات المؤقتة مشتقّة من نافذة قصيرة وتعطى مستوى إنذار مضخّماً.
     نشرها للقاعدة المشتركة ينشر إنذاراً كاذباً على كل لوحة تقرأ منها — لا يُنشر قبل وصول الأرشيف. */
  if(ST.thrSrc === "مؤقتة"){
    MwriDb.patch("apps/"+APPID+"/summary", { status:"جارٍ تحميل الأرشيف", pending:true }).catch(function(){});
    return;
  }
  var q=cur("halfa"), lvl=alertLevel(q), ens=runEnsemble();
  var stB=ens? ensembleThresholdStats(ens, ST.thr.b) : null;
  MwriDb.publishSummary({
    kpis:{ halfa:Math.round(q||0), eldiem:Math.round(cur("eldiem")||0),
      khartoum:Math.round(cur("khartoum")||0), atbara:Math.round(cur("atbara")||0),
      level:lvl.k, prob: stB? Math.round(stB.prob) : 0 },
    status: lvl.nm, note: operationalSentence()||""
  }).catch(function(){});
}

function boot(){
  $("buildtag").textContent="build "+BUILD;
  buildNav();
  selectSection("command");
  setConn(false,"جارٍ الاتصال…");
  clearErr();
  MwriDb.onStatus(setSync);
  MwriDb.init({ app:APPID, name:"مِرقاب الفيضان — التنبؤ بفيضان النيل", type:"forecast", version:BUILD });
  loadDbState().catch(function(){});

  Promise.all([
    loadDischarge().catch(function(){ return null; }),
    loadRain().catch(function(){ return null; })
  ]).then(function(){
    if(ST.q && !ST.thr){ ST.thr=fallbackThresholds(); ST.thrSrc="مؤقتة"; }
    if(ST.q){
      var h=ST.stamp;
      setConn(true,"متصل — "+("0"+h.getHours()).slice(-2)+":"+("0"+h.getMinutes()).slice(-2));
    } else setConn(false,"تعذّر الاتصال — راجع الشارة");
    render();
    publish();
    /* الأرشيف فى الخلفية — هو مصدر العتبات الافتراضية */
    if(ST.q) loadClimatology("halfa", true).then(function(){ publish(); }).catch(function(){});
  });
}

var br=$("btn-refresh");
if(br) br.onclick=function(){
  ST.q=null; ST.mem=null; ST.rain=null; ST.clim=null; ST.calib=null;
  if(!ST.thrManual){ ST.thr=null; ST.thrClim=null; }
  render(); boot();
};

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(e){
      console.warn("SW registration failed", e && e.message);
    });
  });
}

boot();

</script>
